body:
  text: 椒邱文集卷三十四明何喬新撰奏議集略奏為乞恩致仕事臣見年五十九歲江西建昌府廣昌縣人由進士屢更部屬出任藩臬入佐部臺厯官三十餘年叨䝉聖恩纍遷顯秩碎首刳心未足報稱顧桑榆之景漸迫蒲栁之姿易衰年踰五十百病交集往歲在於山西公幹忽患暗風病證用藥調理暫痊復作每遇疾作頭目昏眩精神恍惚不能省覽文書今年三月以來肺經積熱發於四肢眼目昏花艱於僉押兩足酸痛不任走趨雖欲黽勉從事以效犬馬之報但以筋力難支每懷竊祿之慚以此疲憊之體寧免曠廢之愆伏望聖恩憐憫令臣致仕歸田就醫以全殘喘臣不勝懇惻感恩之至為此具本令義孫何善親齎謹具奏聞伏候勑㫖奏為陳情乞恩休致事臣見年六十歲江西建昌府廣昌縣人由進士除授南京禮部主客清吏司主事丁憂去職服滿改刑部陜西清吏司主事厯升本部廣東清吏司貟外郎郎中福建按察司副使河南按察司按察使湖廣布政司左布政使都察院右副都御史巡撫山西以殺敗敵冦升本院左副都御史又為缺官事升今職厯官三十餘年荐䝉恩寵雖犬馬微忱切於圖報而蒲栁脆質望秋先零臣往在山西因暗風中體兩足麻痺步履惟艱眼目昏花僉署不便况臣材識迂踈精力衰憊不堪世用雖知聖恩之未報顧以老病之日侵强顔班行實切慚靦伏惟皇上哀憐將臣照例致仕歸老田園以全殘喘臣無任感激之至具本親齎謹具奏聞伏候勑㫖成化二十三年九月某日奉聖㫖朕初嗣位正欲用人分理庶務所辭不允該部知道欽此奏為辭免升職事該吏部推選得臣等堪任南京刑部尚書緣由具題節該奉聖㫖何喬新升南京刑部尚書欽此欽遵切臣學本迂踈識尤膚淺厯官郎署未著材猷荐任藩方初無治效出董戎旅無安邊禦狄之績入佐秋官乏伸寃理枉之能方懷負乘之慚遽沐升遷之寵撫躬增懼揣分奚堪况南京實根本之地尚書乃喉舌之司非臣庸愚可稱委任伏望皇上收還綸命俾臣仍任舊職以圖補報不勝感戴之至為此具本親齎謹具奏聞伏候勑㫖成化二十三年十月初八日奉聖㫖卿歷官中外鍊逹老成特兹升任所辭不允欽此奏為乞恩致仕事臣以庸愚遭逢盛世歷任中外三十餘年皇上嗣位之初首升臣南京刑部尚書曽未數月又䝉欽取來京改任今職近因臣患病欽䝉命醫調治又遣中使下臨賜以酒米等物聖恩深厚碎首刳心未足報稱於萬一臣自少多疾肌體孱弱往歲巡撫山西邪風中體兩股麻痺趨走艱難今犬馬之齒六十有二加以健忘之疾况患病之後邪熱雖除元氣益耗行則膝顫視則眼花臣竊惟刑部尚書以詰奸刑暴為職茍非資禀剛明曷稱厥任臣以朴􅈪之材又迫桑榆之景精力疲憊則不足於剛神思昏瞶則不足於明以此居官何以體皇上欽恤之德而察庶獄枉直之情伏望聖恩憐憫准臣致仕歸老田園以全餘齒則臣雖不䏻宣力於生前尤當圖報於冥漠臣不勝懇惻哀祈之至𢎞治二年三月十九日具奏本月二十一日奉聖㫖卿病已痊年未衰老不准致仕欽此奏為乞恩致仕事臣以鄙劣之質生際聖明之時歷任郎官荐升藩臬過䝉天寵備員六卿自始仕至今三十有七年而犬馬之齒六十有三矣感恩圖報靡日或忘顧臣自少多疾肌體素羸中年以來暗風襲體每遇疾作心氣怔忡頭目昏暈以致臨政之時處置顛倒不䏻自知文移舛訛亦不自覺雖聖德寬宏每垂矜宥而臣撫心省咎驚悸實深近又加以頭風痛徹心髓自度百病交攻死亡無日伏䝉聖恩命醫診治又遣中使下臨賜以酒米等物天地大德捐軀未足報稱也切惟一命之士尚懷報國之心况臣受列聖之恩從六卿之後豈忘竭駑鈍之力以效涓埃之報㦲但以老病日侵不堪驅䇿强顔竊祿實切慙惶伏望聖慈憫臣蒲栁之姿已衰察臣桑榆之景將迫特准致仕歸老田園則自今至死之年皆皇上之賜也臣無任懇惻哀祈之至𢎞治三年七月初六日具本次日奉聖㫖卿年未老宜勉副任用不允致仕欽此奏為致政以弭灾變事邇者乾象示變彗星見於天津皆由臣等失職所致皇上不忍加罪特賜勑戒諭俾痛加警省修舉職業聖恩深厚天地莫量臣以菲材叨掌邦禁明不足以察情僞剛不足以折姦慝刑罰失中上干天象彗星之變咎實在臣加以年老多病兩目昏眊僉署惟艱久玷班行實切慙懼伏望聖恩憐憫准臣致仕歸老田園另選賢能以理刑獄庶幾和氣可致灾變可弭臣不勝恐懼懇祈之至𢎞治三年十二月十一日具本十三日奉聖㫖卿掌刑獄當勉盡職務以副委任不允所辭朝廷進退大臣自有公論以後各官不必紛擾自陳吏部知道欽此奏為乞恩辭免掌印事該本部題為印信事因臣被劾待罪將印咨出在部缺官掌管等因具題奉聖㫖印還著何喬新掌欽此伏念臣年老多疾處事乖方已嘗四次上章乞罷聖恩深厚未賜俞允今秋自覺年迫衰暮方欲具本再陳而六科十三道交章劾臣罪戻皇上未即加罪仍待問得明白處治今又命臣還掌印信臣彈擊之餘百念俱灰正當伏藁私室以待誅殛何顔復立班行何心掌印涖事况御史鄒魯劾臣貪叨欺罔使臣實有此罪迸諸四夷尚有餘辜堂堂天朝賢材如林豈使貪叨欺罔之人以居大臣之位㦲臣俯伏待罪未敢供職伏乞聖明簡命相應官員代臣掌印候饒二漢等問結臣若無干另行具奏致仕若有干礙聽從該衙門提問定奪臣干冒天威無任悚懼戰兢之至為此具本親齎謹具奏聞伏候敕㫖奏為懇乞休致事臣近因暗風舉發不䏻管事具奏乞恩致仕欽奉聖㫖卿年未老宜勉副任用不允致仕欽此臣祗奉玉音感激泣下當鞠躬盡瘁死而後已尚未足以答聖恩之萬一何敢更請但臣力有不䏻强而情有不䏻堪者故敢冒死再瀆聖聰伏乞陛下少垂聽焉臣自往年巡撫山西暗風中體然㦯數月一發當時血氣未衰扶病治事不敢言疾近年以來年齒益老血氣益衰或一月一發㦯一月二三發每遇疾作寒熱交攻頭目昏眩太醫院判任義診脉具知其證非敢妄言自念死亡無日有孤聖恩此臣之力所不䏻强者也臣有三子成化二十二年兩子相繼病故今春長子又亡僅有一孫年方八歲一門孤寡惸惸無依恃臣為命有可憫者今臣去家七千餘里一旦溘先朝露非惟孤寡失所亦且骸骨不能歸葬此臣之情不能堪者也臣聞人窮則呼天疾痛則呼父母陛下猶天也猶父母也臣危苦之情如此非訴諸陛下尚誰訴邪伏望聖明曲賜憐察准臣致仕歸老田園庶幾生則孤寡有託死獲歸骨首丘則臣志願永畢矣干冒天威罪當萬死臣無任懇惻戰兢之至為此具本令外孫揭瑀親賫謹具奏聞伏候勑㫖椒邱文集卷三十四
