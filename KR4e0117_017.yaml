body:
  text: 椒邱文集卷十七明何喬新撰銘陽休軒銘御史中丞永新劉公宣撫楚甸嘗謁襄王王大書陽休二字贈公俾扁其燕休之軒且為記以發其義揚休見戴記玉藻篇說者謂陽與揚同休與噓同言和氣接人如陽和之噓物也賢王書此贈公蓋狀公之德云大夫君子咸為賦詠以頌公德而豫為之銘其詞曰太和坱圠塞乎兩間吹之噓之萬彚以蕃繄人之生實禀兹氣充養有道式完以粹和氣內實德容外形溫乎其恭湛乎其清於為中丞氣剛且大先哲是師善養罔害如春之溫如醴之醇如彼時雨潤澤生民我思古人維顔若愚深潜純粹於道庶乎在宋有程金聲玉色涵而充之渾然天德顔兮程兮百世之師是鑽是仰庶幾同歸保我天和消彼隂慝睟焉盎兮斯為至德恆齊銘樂安唐君佐名其燕居之所曰恆齊蓋念其祖考世有恆德故以是榜于其前朝夕出入觀焉思先世所以為恆者而務及之也士大夫咸賦詩以發其名齊之義而旴江何喬新為之銘其詞曰天道維恆四序行焉人道維恆百行成焉相彼昧者乃罔斯守虛而為盈無而為有樂只君子齊居晏如久焉若暫終焉若初惟兹恆德匪今斯今乃祖乃考世有恆心人之有恆若水有本放乎四海其流混混人之無恆猶彼汙渠驟焉而溢倏焉而除嗟爾君子動息于此無念祖考維恆是履南人之言大易之辭罔或忽忘念兹在兹德星堂銘將樂陳君叔誠其先蓋出太丘長嘗構一堂以為燕休之所其從父中書君為本太丘之事題之曰德星蓋叔誠兄弟四人雍雍翼翼無愧紀諶而諸子若姪又皆溫雅有學行克肖長文兄弟者也試使太史氏占之安知德星不爛然聚於斗牛之墟邪君之從子監察御史維裕既求翰林學士王公記其事又屬喬新銘之乃為之銘曰粵城之隅有堂孔阜繄堂之人維時孔修思卬顯祖實長太丘懷德葆光卓焉寡儔仁義之澤延被後裔若紀若諶難兄難弟念兹同德實為荀君駕言訪之從子若孫於維荀君亦多才子矯矯八龍乃饋乃侍靈臺峩峩占象于天今夕何夕德星萃焉繇漢迄今殆于千祀荀也罕聞陳則有繼其繼伊何有美叔誠溫乎其和介乎其清克紹其先克啓其後玉樹瓊芝競爽偕秀迪德在人其象在天天人一理于兹徴焉髙秋無月湛乎玉宇爛然德星照我牖户爰銘斯堂告爾來昆世德無怠以永厥聞持敬齊銘龍虎山人張君留本四十五代天師淡然之從子也嘗闢一室為藏修之所扁曰持敬大理少卿李公既為之記留本又屬豫為之銘豫嘉其有志於聖賢之學也取吾儒之說銘之曰靈臺孔微曰理之郛持之有要曰德之輿其功伊何主一無適無怠無荒有嚴有翼窅兮暗室若帝之臨坦兮康衢若淵之深端爾之儀定爾之志儼乎若思肅乎若祭心之流蕩譬彼逝川敬以為防湛乎澄淵心之放逸譬彼奔驥敬以為靮駸乎按轡朝焉栗栗夕焉兢兢五官弗擾百度惟貞從事於斯永矢弗渝匪仙之流伊聖之徒嗟爾君子毋兹怠逸我銘爾心匪銘爾室敬慎齊銘無錫令李君叔蘭闢小齊於其署公退則燕休其中而扁之曰敬慎間因冬官丁君元美屬豫銘之豫謂敬以心言慎以事言能敬且慎修己安民之要不外是矣乃為之銘曰錫山之署有齊伊闢愷悌君子于焉燕息嗟爾君子惟敬是蘉爾心或怠厥政以龎嗟爾君子尚慎無斁爾事或荒終纍厥德敬之惟何夙夜兢兢譬彼涉川而履春氷慎之維何朝夕惕厲譬彼山行而蹈虎尾內敬于心外慎于事上帝臨汝其敢或肆從事於斯靡怠靡荒厥績用懋厥民用康華扁有煒齊居有翼銘以坐右尚朂爾德寶賢堂銘晉世子既攝邦政爰作堂于王宫之西南以為燕休之所屏去玩好惟圖書琴瑟彛卣之器布列左右日延師碩論道講業其間扁曰寶賢蓋取周書召公之語也喬新宣撫晉陽祗謁世子于兹堂出示薦紳歌詠諸什且授簡俾賦焉乃再拜而獻銘曰懸藜結緑梁宋所珍玩好之美匪益身心繁弱闕鞏魯晋是寶佩服之華靡兹治道若古有訓所寶惟賢於惟王儲克迪斯言乃構兹堂以燕以息忠賢是親典謨是式殷盤周誥味兹道腴左琴右瑟斥彼齊竽濟濟俊賢乃賔乃友以紏我慝以詔我美若鄒與枚詞匪不工弗以為寶厭彼雕蟲若衍與髠辨匪不博弗以為寶惡彼曲學黃髮諤諤文儒申申所寶在兹乂我受民漢有河間克崇古學亦有東平惟善是樂𢎞我祖訓闡我大猷與古哲王異世同休景霍之疆汾澮之域世祚大邦繄賢之力硯銘硯之德直以方磨而不磷維其剛溫乎如玉浬而不緇既貞且白宜君子之寶之其德若此其用則待乎時其遇於時也則勒彛卣之銘演綸綍之辭其不用也端居深藏若無能為孔子云用之則行舍之則藏吾與汝其庶幾楷杖銘豫得孔林楷杖以遺豫弟廷祺而為之銘曰産于孔林化雨維深嗤彼桃竹出于江心匪規而圓匪繩而直制以為杖用之無斁金嶂銀溪出入相從或過葛陂毋化為龍顛兮汝扶危兮汝持爾子爾孫永世保之贊附字辭李晉王遺像贊王諱克用其先本朱邪氏世為沙陀部長父國昌當唐懿宗時從康承訓討龎勛有功始賜國姓附屬籍纍拜振武節度使王初為沙陀副兵馬使廣明之亂遷鴈門節度使舉兵勤王誅黃巢復長安功第一遂引兵東解陳汳之圍巢黨朱溫節度宣武媢王初功夜遣兵圍之王幾不自脫既免歸晉陽以溫終為國患數請討之當是時奸閹擅政宰輔非材顧右溫而抑王已而朱邪王行瑜相繼構亂詔王討之逆臣就戮勞賜優洽然昭宗不諒王心終疑而不用王既歸鎮諸藩以賞罰無章愈肆凶逆溫遂逼遷昭宗洛陽竟移唐祚溫之篡也蜀王建以書勸王稱帝王復書曰誓於此生靡失臣節嗚呼王於國亡之後猶不敢自帝况於宗國尚存忍隳臣節邪君相疑之過矣唐有天下三百年宗室布天下如璘如煴遭時不靖竊窺神器而振佐溫為逆以覆宗國亦何取於維城哉王雖賜姓實非王𦙍然乃心帝室始終不渝賢於人逺矣使唐倚為藩扞遽至於亡哉王志圖恢復抱憤以歿而子莊宗克剪逆類復國號曰唐亦足以慰王在天之靈矣王葬于代州今所謂晉陽是也豫巡邉至代得王遺像于寺僧亟命畫工摹而傳之感王忠節遂為之贊其詞曰蒲海之濵金山之麓産兹傑人面如赭玉鹵豎倡亂爰覆西都鑾輿狩蜀禁壘為墟王奮厥旅于彼晉陽龍旗虎䩨我威孔揚乃殱羣醜乃復帝京妖氛既豁九廟載清維汳有梟實彼逆類險悍慓賊睥睨神器維君與相聽胡不聰謂梟為鳯謂逆為忠凶渠是親忠謀是憝金祥受冊宗祊以墜王心孔䀌清淚浪浪移檄到閫誓復宗邦天不憖遺溘然長逝錦囊三矢以遺厥嗣維嗣孔武既孝且賢珍其鯤鮞祀唐配天嗟彼凶渠朽骨以腐王歿不朽英聲益著堂堂遺像朱服𤣥冠百爾具瞻肅然易顔德馨堂贊安成之書岡世傳為晉徴士陶元亮讀書處今國子司業張先生振烈之居在焉先生之祖澧陵君素以學行稱嘗仕有祿位矣既罷官南歸盡以先宅讓其族人而相故宅之旁得異地焉作屋數十楹而居之前臨東湖後負書岡烟雲紛蔚花竹繁鮮極幽雅之趣落成之日瀘溪司訓周君尚善以詩賀之有眼前多少幽人宅寧似其中有德馨之句鄉人傳誦焉澧陵君之子以儒起家纍官祁陽教諭而其孫則司業君與其兄振光甫也司業君念嗣續孔繄堂構未稱乃與振光甫鳩工庀材聿新其居輪且奐焉而顔其堂曰德馨取周君詩中語也間與豫道之豫惟德者仁義禮智之得於心者也德藴於心無聲無臭曷有所謂馨香哉蓋盛德之至充諸身見諸行而洽諸人則休聲令聞發而不可掩譬諸物之馨香旁達而無間也世之穹堂奧屋侈且麗者不少然德義不聞君子耻道焉澧陵君之宅傳子若孫而休澤益隆芳聲益振非本於德耶夫藝蘭於戺蘭悴而香消樹桂於庭桂摧而香絶惟積德於身則馨香旁達越百世而有遺芳也若澧陵君是巳命其堂曰德馨宜已哉喬新與司業君同領鄉薦相好也乃為之贊以頌張氏之世美且以朂其子孫焉其詞曰東湖之隩書岡之麓奕奕斯堂君子攸宅允哲君子遺後以安肇此堂構孔阜且完禮以為門智以為牖厥德惟馨曷云其陋顯允司業克承厥祉念我先宅胡兹傾圮乃築乃救乃茨乃塗髙閎將將峻宇渠渠我居聿新有嚴有翼曷克臻兹曰維先德我祖我考于兹享祀我宗我姻于兹燕喜斯堂何有馥郁其馨匪蘭匪蓀維德昭升斯堂何有維香芬苾匪椒匪桂維德發越先祖之基我維𢎞之先祖之德我維承之克永其德克篤其祜如瓜斯綿永宅兹土嗟爾嗣孫陟降斯堂纘之其艱維德是蘉我頌我歌以揚芳聲維雲若仍世振其馨定逺張允器畫像贊此豫友定逺張先生允器之像也豫與先生别四十餘年矣思一見其眉宇不可得乃今於畫圖見之因為之贊曰涵和茹粹容色穆如帶規佩衡威儀肅如或玩游鯈於濠上或濯清風於舞雩不狥時以為通不泥古以為迂觀其外則蕭然物表類山澤之臞探其中則淵然宏博乃君子之儒噫斯人也采苓者之徒歟釣瀨者之徒歟陳秋官贊名章松江人氷蘖之操梧竹之姿其檢身也以禮其酬酢也有儀所味者道而淡然於人所同嗜所勇者義而退然於世所競馳人所推者漢之不疑心所期者古之士師用能迓休命保羣黎噫詩所謂邦家之基書所謂無疆之辭非斯人將屬之誰邪劉先生廷益字辭福建按察使永新劉公之子裒既冠憲副四明錢君字之曰廷益蓋附其名之義而為之耳公以裒之冠豫實有位于賔戺俾申其義以飭之豫惟裒之為義聚也君子之求益必學以聚之焉山惟聚衆土也故能益其髙川惟聚衆流也故能益其深君子惟聚衆善也故知益髙明行益光大裒而聚之其求益之本乎夫子生而父名之既冠而賔字之非直使之有美稱而已蓋欲其顧名思義因字勉德而不失其所以美焉裒也朂之四端五典之懿也禮樂名物之詳也前言往行之浩以繁也博學以聚之反躬以踐之㑹萬善于一身其為益也不亦深且逺哉祗遹前休以建嘉績以膺純嘏以為我皇家之世臣豫有望於子矣裒也朂之尚無忘父若賔命名制字之意乃祝之曰維天之命播為萬理萃萬于一斯益於己六籍羣言既浩以穰融而㑹之我智以明天道物理既微且密博而求之斯協于一溫溫劉生文若抒霞裒名益字厥義孔嘉學以裒之萬善咸備道積厥躬聖賢可企一簣不已積為崇丘一勺不已瀦為洪流於惟若翁為時膚使克念厥紹乃為有子晉有碩輔其名曰裒仗鉞東夏厥聞惟休虞有藎臣實為伯益顯有丕功皂斿是錫父命若名賔制若字念之敬之古人是似我言惟服毋忽毋忘受之天慶邦家之光周仲儀字辭古者子生而父名之既冠而賔字之禮也非求以為美稱也周公孔子禮之所繇出者名其子曰伯禽字其子曰伯魚曷嘗求美稱哉後之君子愛其子者必求美稱焉夫美稱者無它亦曰使之顧名思義曰仁迪仁曰孝履孝焉耳名字所係豈輕也哉近世冠禮既廢命字亦非其時士大夫簡於禮也甚矣惟御史大夫太原周公則不然公之子紞年既可冠筮日擇賔而授事焉既成禮賔字之曰仲儀蓋紞者冠之垂王后親織以充耳者也古之聖賢知人之不可無威儀也故為衡紞紘綖以章之為琚瑀珩璜以節之為琴瑟鐘鼓以養之凡使之淑慎厥儀而已詩曰敬慎威儀維民之則又曰慎爾威儀無不柔嘉蓋威儀之不可不慎也如此紞雖冕之一物然一有缺焉則其制不備而不足為人之儀况君子之行一有虧焉其能使人則而象之邪名紞字仲儀父師之所望者逺且大矣豈徒使之有美稱哉春秋之法其人賢則字以褒之否則名以貶之二百四十二年之間以字見經者十有二人而已人有美稱而不失其美何鮮也仲儀其尚率禮無違進學不怠庶幾克保美稱詩所謂無不柔嘉維民之則者將於子乎見之僉謂仲儀之冠喬新與供事焉俾為說以朂之乃敷其義而申之以辭其辭曰冕之為制大備於周有紘有綖有覆有旒彼垂者紞維后所織以章令儀匪以為飾都憲之子內翰之弟曰紞其名仲儀其字服之有紞厥冠峩峩望之儼然可樂可嘉一或蹶焉厥冠僛僛就之弗畏無威無儀來爾仲儀明聽無惑淑慎爾止以成乃德去爾幼志毋儇以輕順爾成德克明以誠相爾嚴君國之司直正色立朝其儀不忒相爾元兄出入鑾坡溫恭和懿其儀孔嘉爾往何監監于父兄克敬克勤紹厥休聲克享遐福若軾有轍若尹有陟嗟爾仲儀念之敬之成人之道祗服訓辭椒邱文集卷十七
