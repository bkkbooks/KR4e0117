body:
  text: 椒邱文集卷十八明何喬新撰題跋題金石例後豫少讀栁文肅公集見其序集賢學士潘公所著金石例者思一見其書而不可得訪之士大夫家無有也近與司封左君時翊論文及之時翊曰吾嘗得寫本于鄭內翰瑶夫家因録藏之豫亟假以歸篝燈閲之其援據博其去取精修辭者得之真猶法家之有斷例也豫愛其書乃録藏于家其書有鄱陽楊本傳貴全桐川湯植翁之序而文肅公之序缺焉故録諸卷首然栁序稱公諡曰文簡而楊傅諸君子稱之曰文僖豈先諡文簡後改文僖邪抑傳録之訛邪姑缺之以俟知者跋閩人余應詩皇宋第十六飛龍元朝降封瀛國公元君詔公尚公主時䝉賜宴明光宫酒酣舒指爬金柱化為龍爪驚天容元君含笑語羣臣鳯雛寧與凡禽同侍臣獻謀將見除公主夜泣沾酥胸瀛公晨馳見帝師大雄門下參禪宗幸脫虎口走方外易名合尊沙漠中是時明宗在沙漠締交合尊情頗濃合尊之妻夜生子明宗隔帳聞笙鏞乞歸行營養為嗣皇考崩時年甫童文宗降詔移南海五年乃歸居九重壬癸枯乾丙丁發西江月下生涯終至今兒孫主沙漠吁嗟趙氏何其雄惟昔皇祖受周禪仁厚綽有三王風雖因浪子失中國世為君長傳無窮此詩叙元順帝為瀛國公之子乃閩儒余應所作也其詩有壬癸枯乾丙丁發之句蓋壬癸為水丙丁為火元以水德王而宋以火德王也又云西江月下生涯終故老相傳順帝北遁殂于應昌倉猝取西江寺梁以供梓宫之用梁間隱隱有字亟視之乃西江月一調有龍蛇跨馬亂如麻可汗却在西江寺下之句或云太保劉秉忠所作故應云爾也考之於史瀛國公以德佑丙子降元時年六歲後十有二年為至元戊子瀛國公學佛法于吐蕃又二十八年為延祐丙辰仁宗遣明宗出鎮雲南明宗不受命逃之漠北其與瀛國公締交蓋在此時也托歡特穆爾以元統癸酉即位是為順帝時年十四其生當在元祐庚申上距丙子凡四十四年而瀛國公年始五十矣應之詩或有徴也史又云文宗以乳母失言明宗在日素謂上非其子黜之江南召奎章閣學士虞集書詔播中外而不言順帝為何人之子蓋諱之也豫年二十時赴江西鄉試於館人家見古樂府一帙內有沙漠主一篇云楊廉夫所作豫方從事科舉之業不暇録但記其篇末句云吁嗟乎鳯為鳩龍為魚三百年來龍鳯裔竟來漠北稱單于又識其後云宋太祖之德至矣肇造帝業不傳諸子而傳諸弟太宗負約金人之禍舉族北遷而太祖之末孫復紹大統有江南者百餘年為元所滅而瀛國公之子隂纂元緒世為漠北主天之報太祖一何厚哉其言頗與應合近考鐵崖樂府無此篇豈出於假托邪抑有所遺邪新安程克勤録此詩示豫因具疏豫所聞見者以廣異聞云跋晦庵遺墨吾旴包氏兄弟俱遊紫陽朱夫子之門故得朱夫子手書為多其藏於光風霽月閣者凡二十五紙宋末兵火之餘逸其大半楚國程文憲公嘗跋焉元季焚掠之酷又復散失其存者僅此數紙與文憲公之跋耳而包氏子孫不能守故此卷遂歸于郡之大家可慨也已豫友左君時翊學朱而希包者也購得此卷寶之愛之殆若河圖大訓然或者顧謂善學朱子者亦惟志於其道焉耳區區遺墨朱子之糟粕也胡為眷眷於是哉是不然朱子之手書其詞則心聲也其字則心畫也讀而玩之使人形神肅鄙吝消固可因是以得其心於數百年之下矣是豈世之尋常詞翰徒以供耳目之娛者比哉明窗净几展而玩之要當悚然易視如與朱子唯諾於武夷九曲之間斯可謂善學者矣晦庵先生以豪傑之才聖賢之學凡發於文詞者皆至道所寓非後世詞人所及至其緒餘見于字畫亦皆遒徑雄放如懸崖之古柏出峽之驚濤而非以書名家者所能倣佛也故其殘章片簡流傳人間得之者弆而藏之不啻懸藜垂棘之珍盱眙陳主事大章嘗得先生三劄於金華傅氏二劄皆上時宰者前一劄乞减稅請祠後一劄乞痛治豪猾劄後有大司成陳公大理少卿廖公題跋主事寶藏惟謹請豫識其未豫閲之肅然起敬蓋三百年物矣嘗聞之書者心畫也因先生之書以求先生之心斯善學先生者已即二劄觀之惓惓减稅可以見先生恤民之仁懇懇請祠可以見先生勇退之義請治豪猾又可見先生除惡佑善之心也主事於此求之則修己治人之道可以得其槩矣若徒玩物適情而已亦何益於身心哉所上時宰何人則陳廖二公考訂審矣豫可略也跋古器物銘三代盛時凡諸侯卿大夫有駿烈丕績者必作彛器而銘之所以垂不朽而昭示其子孫也其辭宏深奧雅與書之典誥詩之雅頌相表裏自浮屠氏入中國凡三代彛器往往毁之以鑄佛像其存于世者鮮矣豫家食時村氓耕地得一器狀若古之所謂卣者村氓疑其金也剖而棄之豫取以歸視其銘識皆籀文知其為三代之物而惜其已毁也及來京師遊廢佛剎有僧以銅器焚薌狀若禮圖所謂敦者制作精巧其為古物無疑豫欲以白金市之僧靳而不豫後數年過而問之則己為豪有力者所攘矣乃知卣彛敦匜猶有存者特出非其時遇非其人故湮淪毁棄而莫有寶之者矣則夫君子懷瑾握瑜而不遇知者其沉沒無聞亦何異是器也豫惟嗜古每恨不及覩三代之禮器無以見聖人制作之盛間取傳記所載古器物諸銘裒而録之得三十有三將以傳諸好古博雅君子蓋聖人之制作有道存焉是數者雖其器亡矣然頌其詞而繹其理非徒有以見盛王良弼之德烈亦庶幾可以想見聖人之道焉豈眷眷於器數之末乎哉跋韓國華神道碑右宋諫議大夫韓國華神道碑富弼彥國撰王圭禹玉書國華魏國公忠獻公之父而富王二公嘗與忠獻公同居政府其文與書皆可傳也富公以勛業名世其文章不多見今觀此碑叙事質而不俚贍而不穢殆非稚筆所及蓋宋之諸君崇尚儒雅公卿百執事率用文學之士故士大夫爭自淬礪於問學在當時雖不以文名其文亦自有以過人如富公是已自元以來所用以為公卿大臣者第取其體貌瓌梧音吐洪暢而以文學進者十不一二焉故雖耳目近事亦懵無所知不獨誤以伏臘為伏獵杕杜為狀杜而已或譏其然則諛佞者又從而解之曰䕫龍稷卨所讀何書絳侯灌嬰重厚少文者也執用人之柄者遂以為當然而不之怪嗚呼以卿相之位而委諸不學無術之人宜夫治之不古若也悲乎題先冡宰致政復留公牘景泰中先公以老疾求致仕章五上乃得㫖云朕欲留卿匡輔治道而卿纍稱老疾辭歸田里特允所請翰林院寫勑書兵部應付腳力著去致仕陛辭之日上復眷留不許去先公上章固辭溫詔不允且斷來章吏部移咨請先君視事此當時公牘也少傅王文端公直侍郎俞公山項公文曜之花押存焉先兄本茂姪㑹同從孫豐寶藏已三世矣豐之弟亹懼其久而漫滅裝潢以示子孫喬新稽首伏讀感先皇之寵光悼先猷之日逺不自知涕泗之澘然也謹識于下方題碧梧沈先生挽詩冊後挽詩一冊大夫君子哀碧梧沈先生而作也先生吳興名家其父以事謫戍撫寧先生長于戍所而讀書篤行喜吟詠兼工繪事有薦于朝者召入供奉始徙家京師同時被召者多得美官先生恬退不肯干勢要故不沾一命以歿君子哀之先生將歿遺命諸子曰葬不歸故鄉猶不葬也諸子以貧不能歸葬旅殯都城外者久之君子尤哀之此挽詩之所繇作也既而先生之子清刻苦力學思立其身以顯其親遂以明經登進士第出宰名縣入為郎官朝廷推恩贈先生刑部主事錫之勑命君子曰先生膺是寵命亦足少慰矣清奉使南畿始扶旅櫬歸葬君子又曰先生復魂故丘庶幾瞑目矣相率追賦虞殯之章以舒其哀清今為江西按察司僉事出此冊示豫閲之盡卷作而言曰先生善人也清其孝子歟易曰積善之家必有餘慶先生有焉傳曰立身行道以顯父母清無愧矣嗟夫為人父為人子者讀是詩亦將慨然興起乎遂題其後而歸之跋二老餘芳卷少師東里楊文貞公少游湖湘與大宗伯東吳楊先生為布衣交既而公仕登朝致位丞弼而宗伯先生亦纍官翰苑交誼益篤詩筒尺牘之􅉨還者殆無虛月先生之門人湯原靜得公與先生遺墨若干幅裝潢成卷寶而弆之間持至汳出示喬新俾識之喬新垂髫時以通家子拜公于私第逮今三十餘年盛德之容夢寐見之而公之塋樹拱矣展卷莊誦凄然增欷又奚忍言邪然嘗聞君子之論公者謂公之清忠大節似宋廣平故考行易名皆以文貞而公之文視廣平過之其文章雍容純雅有歐陽公之風致如石臺沙羡諸作雜諸六一集中蓋未易辨而公辨章迓衡之功視歐陽公尤偉嗚呼自唐歷宋以迄于今兼二美者公一人而已宗伯先生喬新未及識然與文貞公友而公之文亟稱道之公豈阿其所好者哉則其賢可知矣是宜片簡隻字流傳人間者為世所寶不啻天球𢎞璧然若原靜此卷是己昔人有得歐陽公五代史稿者持歸其鄉以為寶二公遺墨亦稀世之寶也湯氏子孫尚慎弆之哉題劉原父投壺義後臨川吳文正公校正儀禮既因鄭氏本而詮次其篇章凡經文散見於戴禮鄭注者則表而出之為逸經八篇禮必有義又取戴記所存與清江劉原父所補者為傳十篇若士相見義公食大夫義則原父所補也豫近讀原父文集又得投壺一篇蓋釋禮經投壺之義也故附録于朝事之後以備逸經之傳焉正經十七篇有傳者十逸經八篇有傳者一其餘缺焉崇禮君子雖追而補之可也或曰束晳補南陔諸詩白居易補湯征皆見非於君子原父所補亦南陔湯征之類耳豈可取以為訓哉豫以為不然南陔湯征經也經出於聖人所刪補之僭也冠婚諸義傳也傳出於周末漢初諸儒所作補之奚不可邪且朱子嘗補格物致知之傳矣今與曽子之傳並列于學官未有非之者茍以補傳為不韙則朱子豈為之哉書儀禮叙録後儀禮十七篇有禮有記禮則其正經先儒以為周公所作記則述其儀節之詳蓋周末諸儒所記以補正經之未備者也每篇正經居首而記附焉自髙堂生所傳及唐石經皆如此宋紫陽朱子作儀禮經傳通解始以記文附于正經各章之末臨川吳文正公疑其經傳混淆為朱子未定之稿乃重加考訂一仍髙堂之舊而為之詮次焉先王之制度粗可考矣元季兵燹其書散亡深可痛惜喬新弱冠嘗讀儀禮注疏而愛之方研究其奧㫖尋以科舉之學中輟登第以來讀文正公三禮叙録又知公嘗考定是經鋭意求之庶得以盡心焉遍訪藏書之家無有也三禮考注近刻於吾旴廬陵楊文貞公以為此文正公所考定而晏璧彥文掩為己作者也竊嘗考之文正公考定儀禮正經與記一仍其舊今考注仍於朱子通解經傳雜然無倫其所注釋徒取鄭𤣥賈公彥之說而綴緝焉亦與易書戴記纂言之文不類决非出於公手豈晏氏不見公本而以己意為之邪喬新不揣庸陋輒因唐人石經兼考叙録詳加校定經自為經記自為記而不相雜揉其章次則依朱子所定亦不敢妄為紛更冠昏二篇賔主問對冠字醴醮之辭石本俱在經文之後今因朱子移置各章之末蓋欲便於讀者也於是儀禮十七篇復為完書嗟夫秦火之餘先王典禮十亡八九其存于世者惟此十七篇而已炎漢以來雖未能舉行然猶列之學官師弟子講習焉自王安石廢經用傳士大夫知此經者鮮矣喬新少嘗讀之而不能無韓昌黎之患每欲採托諸儒之說為之注以成紫陽臨川二大儒之志今學殖荒落不能為已姑校正遺經藏之家孰傳之同志庶幾有好古之士為吾所欲為者豈非曠世之一快哉書資治通鑑後司馬溫公資治通鑑二百九十四卷天台胡三省注并釋文辨誤十二卷凡八十本板在南京國子監初公作此書讀者病其太詳往往不能終卷子朱子取其事之大者為通鑑綱目蓋用春秋之法也今綱目盛行于世而此書幾乎廢矣加以卷帙重大人不易致非好古博雅之士鮮克留心成化丙午秋鬻書者擕此書欵門求市豫以它書易得之蓋正統初所印者顧多殘脫乃遍假諸名公家藏本參互校補然後可讀雖其楮墨未精然視它本頗為完善謹識于此使豫後之人知得書之艱而保之不敢失云書國學羣書殘編後元有天下垂百年頗崇儒雅經籍之板藏于國子監者甚富天兵入燕百司安堵經籍庋置如故無毁棄者宣德以來典守者不以為意蟲鼠蛀齧之餘膳奴監𨽻或竊以宿火殘脫磨滅百僅一二者存焉然其存者字畫既妙刻手亦精非今書坊鹵莽之比雖殘章斷簡使人把玩不忍釋手今大司成京口費公惜其可寶而不完也乃模印裝禠共為一帙間以遺豫豫閲之如夏小正考儀禮逸經江文通文集皆今世所不傳者又其字偏傍多用古法精緻可愛因題其目曰國學羣書殘編時出而覽之亦足以佐嗜古之癖昔人有得古漆簡者寶而藏之此編豈徒漆簡之比哉乃書以示後之人題皇明文纂後文纂四十卷金華鄭柏編選我朝名公俊儒所作詩文也國家承平百有餘年文章軼宋元而追周漢者蓋多矣萃而選之以繼蕭統姚鉉吕伯恭蘇天爵之書者惟姑蘇劉欽謨文要與柏此篇欽謨所選諸體未備又徒詳於洪武間諸公所作自永樂以降遺缺甚多不足以備一代制作之盛柏此編諸體略備然所去取托星宿而遺羲娥者蓋亦不少讀書不能無憾焉豫嘗欲合二家所選嚴擇而精采之勒成一書以昭皇明文章之盛顧以俗務倥偬未暇為也此編豫得之盱眙陳主事大章卷中多錯亂乃為正其錯簡重加裝禠而識于卷末云謹題牧民備用後我朝自太祖皇帝受命建號至宣德初蓋六十餘年矣宣宗章皇帝篤意於阜成兆民妙簡朝臣素有政聲者出為郡守蓋欲比隆周成康之世漢文景之治也惟時先公以監察御史為大臣所薦出守永嘉上宴勞賜璽書俾馳驛赴任永嘉古之東甌地在海上頗號難理先公感上簡命之意思欲追古循良之迹凡為郡所以事神治民者條列為一書名曰牧民備用蓋多本之經史而參以時政也既數月郡境稱治聞於京師及先公入覲召入便殿命近臣傳㫖奬勵并賜御製招隱歌由是政聲聞於天下以為龔黃卓魯不足多也相知有來問先公所以為政者先公命録牧民備用以遺之有依倣而行之者亦皆以善治聞好事者以傳録之艱因為鏤板以廣其傳而歸其板於吾家藏於吾弟喬夀之書樓近為回祿所燬而得之者鮮矣邑庠生黃鶴以為是書簡而不迂質而不俚考之古而無戾施諸今而可行實為政者之凖繩也每見有司為政防範不密重貽民害者輒曰彼未見吾先正牧民備用故耳乃捐資重刻之凡為郡縣者輒摸一帙以贈之曰諸公依此而行則吾先正之仁政遍於郡縣矣刻既成又托豫甥揭瑀捧以示豫屬題其後先公諱文淵世家廣昌宋寶謨學士坦之裔也為郡六載徴為刑部侍郎其後纍官太子太保兼吏部尚書昔人有言施藥不如施方有司之得此書其猶醫者之得方歟鶴之用心仁矣哉他日為政必能心先公之心矣名位所至其可量乎書老子道德經後老子道德經五千餘言臨川吳文正公為之注分為四卷定為六十八章豫與大宗伯瓊臺丘公仲深論老子公曰注老子者數十家惟文正之注為善蓋諸家之注或以為神仙修養之術或以為用兵權謀之說是皆知其一而不知其二者也惟文正公注深得老子之㫖臨川舊有刻本而今亡矣今其書幸載于道藏經子試求之豫因托公假諸道流久而未得今年春公與豫陪祀南郊同宿于神樂觀公乃假于道士以示豫豫亟命書吏録之以歸篝燈閲之其言簡而明近而易知老子所謂道德之㫖燦然矣河上公林獻齊之說皆不及也豫觀老子之說世儒多非之然大要以清虛為本以慈儉為用是亦不悖於吾儒也使為君者用之必能如文帝恭儉愛民為相者用之必能如曹參清靜為治矣豈可輕訾哉因識于卷末跋大事記續編大事記續編凡七十七卷翰林待制金華王公子充所著公與宋學士景濓皆以文章學術顯于國初同典制誥後奉使南詔諭元宗室梁王巴圖不屈死之蓋公與宋公皆黃文獻公晉卿之門人齊驅藝苑世無異論然嘗考之宋公之文雄渾贍麗自蘇長公後鮮能及之公之文好模擬甚者剽前人之成說如贈郭士中序用馬子才子長遊蕭然堂記用曽南豐記學舍之類非宋公自成一家言者比至其學術亦有不同金李純甫著明道集說以孔孟老莊並稱宋公譏其偏駁是矣公序其書乃以豪傑之士稱之又何所見邪其著此書蓋以續東萊吕公所未就者也然東萊作大事記在朱子通鑑綱目未作之先綱目盛行于時此書不可作也其間豫奪褒貶又與綱目大不合者綱目以昭烈紹漢統章武紀年直接建安此萬世不易之論也此書顧謂抑揚太過乃用無統之類例以漢與魏吳並從分注不從朱子而取陳夀裴松之之說可乎不可乎綱目出武后之號紀中宗之年每歲書帝之所在蓋春秋書公在乾侯之例也此書乃以武后紀年則所謂秉筆迷至公者豈獨歐陽子哉李克用父子在唐雖未為純臣然唐亡猶稱天祐年號以討賊為辭名義甚正故綱目紀年先晉而後梁是乃春秋存紀存陳之義也此書乃先梁而後晉不幾於奬篡乎夫學如朱子著述如綱目亦可以止矣而公此書乃故為異同豈好竒之過邪公在建文間以近臣言其死節特贈翰林學士諡文節永樂初凡建文所設施悉皆革去無敢復稱其贈諡者正統六年義烏丞廬陵劉傑以公死節請加恤典乃贈翰林學士諡忠文云題元祐黨籍碑元祐黨籍碑一卷蔡京元長所書也崇寧初京在相府追憾元祐諸賢乃籍司馬光以下三百九人指為奸黨請徽宗書而刻之又自書頒于天下俾各刻石以示後世京之意蓋欲汚衊諸賢使其子孫亦有餘辱也抑豈知公論之在人心者終不可泯至于摩挲遺刻歷數姓名粲然若繁星之麗天雖其子孫亦以祖父得與涑水伊川聨名為榮曽不以為辱也嗚呼愛憎之私果何以掩是非之公邪京可謂謬用其心矣碑之所列德業無聞者居多然賴此碑之存而天下後世知其為君子之黨是則京之詆之乃所以譽之也歐陽子有言彼讒人之致力乃借譽而揄揚豈不信哉霅川沈暐以其祖干名在黨籍懼久而磨滅特取家藏榻本重刻于石行人司副姑蘇周君得此卷出以示豫瞻仰之餘肅然起敬因識于下方嗚呼世之惡直醜正倣佛於京者覽此碑尚亦自省哉旴江何喬新識恭題恩榮録後冬官郎中臣冕録其筮仕以來所被制勑命誥璽書凡十有二通而題其目曰恩榮録將刻諸家孰以示其子孫且屬臣喬新題其卷末臣伏讀而嘆曰大哉皇言是足以昭一代之人文非惟為蕭氏一家之光寵而已蓋冕初以進士試于廷先皇帝賜之制䇿而問焉俾陳其所藴遂擢上第既而除冬官主事遷員外郎以至今官恭勤周慎克舉其職先帝嘉之推恩其父母以及其妻凡再賜勑誥以示旌褒尋以潁川營建王府工大役繁特勑臣冕往董之所以申飭戒勵之意尤為深切今冕所録是也臣惟古昔聖帝明王訓迪厥官具載于書不可尚已西漢詔令深醇簡盡猶有典誥之遺風焉河汾王通取以續典謨訓誥誓命之文蓋有以也六朝以降文日靡麗非王言之體矣我國家以人文化天下凡絲綸之出典雅深厚蓋軼西漢而追踪于三代後世有如通者安知不取之以續書邪冕之子孫於是録寶之弆之口誦而身履之則所以光前啓後之道在是矣若徒持之以誇閭里則豈臣冕所以示後之意哉題助教林君致仕公牘𢎞治戊申冬十有一月南京國子監助教莆陽林君文華以內艱服闋至京慨然嘆曰吾老矣齒髮衰而筋力憊可以休矣乃請于吏部願致其政以休于家太子太保吏部尚書王公侍郎劉公楊公嘉其恬退為請于朝聖天子俞其請俾以其官致仕吏部移文飭郡縣以禮相待且蠲其繇俾得自逸又劄付君曰其以禮自處毋干有司之政君得請喜甚既詣闕頓首謝且以所得吏部劄裝演成軸持示豫請識之豫惟先王之世為士者四十而仕五十而爵七十而致仕而年至者請于上曰吾力不能任干戈而謀不足贊國論願乞身以休為上者亦曰大夫誠老矣吾不敢煩以政賜之几杖俾休于家當是時士皆明於進退之禮而無貪戀寵利之私漢以來禮廢而士俗薄於是乎有年餘八十猶托權近求進者矣有老而當罷叩頭祈哀而不耻者矣我國家以禮待士而士亦以禮自待其身然其濡忍將老之年以茍升斗之祿者蓋亦有焉君年方六十有六精力未衰而毅然求去視彼冒昧而不知止者其賢不肖何如也君歸矣日與鄉之耆德探壺山之幽勝濯涵江之清流唱和於山霞水月之間以寫夷猶之悰以頌國家太平之盛以追蘇太傅楊司業之髙風人之望之何啻登仙邪是劄也傳之後世將有低佪感嘆曰朝廷待士以禮如此林君以禮自待又如此是豈尋常吏牘之比哉君名英以鄉貢進士起家歷寧逺吉豐教諭瑞州教授以至今官所至以善教稱書三國志後陳夀三國志十有四册豫巡撫晉陽時録于襄陵縣學蓋少宗伯邢公所印南雍本以遺其後學者也其間殘缺甚多豫因令裝書者遇有脫簡置空紙焉聞士夫家有善本輒假而補之十僅得二三近聞吳興大姓有元末印本最為精善乃托主事沈清就其家録而補之然後稍完雖間有缺文誤字可以意屬讀也夀作此書帝魏而寇蜀吾先儒嘗斥其非然其叙事簡健非李延夀輩所能及而葉水心謂其勝班固則謬矣裴松之注時有異聞可喜亦好古博雅者不可廢也金華吳師道論夀叙事多摹倣左傳班史事多失實豫謂後世作史者遞相摹倣非獨夀書然也校補既完因識于卷末書金榮襄公碑隂太子太保兼户部尚書追封沐陽伯諡榮襄淮陽金公先公之同年友也自初仕為監察御史晚歲同以宫保兼六卿相得甚歡先公每稱公為一代偉人公之薨少保兼太子太傅芳洲陳先生為撰神道碑其家久未刻蓋有所忌也至今三十有八年矣豫托淮陽太守徐侯用和求諸其孫得録本於故篋字多脫謬侯録示喬新且礱石置隧道屬喬新校定其文將刻之以圖永久喬新乃取東魯許先生所述公行狀校其訛缺竊惟芳洲與公仕同時碑文宜詳實然叙公平閩寇之功甚略而自户部左轉工部又似有所諱者喬新公通家子也敢述耳目所及者以補碑文之缺初公受命南征兵抵浙江遣都督劉德新以偏師繇杉關進自與寧陽侯陳公帥大兵繇分水關進刻期㑹于延平及兵至建寧賊首鄧茂七已敗死餘黨立其姪為主勢益熾公揭榜招諭降者日數千惟凶徒負固不服公乃進兵沙縣剪貢川芟掛口夷陳山而尤溪將樂諸邑以次破降遂分遣偏禆解汀漳之圍不數月八閩肅清其䇿畫皆出于公諸將受成算而已及在户部南北用兵儲偫不足公經度攟拾未嘗乏絶浙東大姓有輸歲賦綿絹至京者適有詔蠲逋賦乃匿其半而以其半賄權貴囑公以赦蠲之公言此乃已徴在官者力持不可權貴怒嗾臺諫劾公文致其罪請下廷尉景皇帝察其誣不許都御史王文素與公有隙抗言詆公以為不可宥景皇帝不得已乃落公太子太保改工部尚書時先公為吏部尚書上言北境未平南夷復閧所急者軍儲耳金某有經濟才其計度財賦以充邉儲非為私也自古理財之臣多招怨謗如唐之韓滉宋之趙開是已惟陛下察之書上景皇帝嘉納還公户部尋復太子太保此二事皆喬新所睹記者不敢誣也嗟夫讒說殄行古有之矣何必諱哉謹識于碑隂使來者有考焉徐侯名鏞武昌人起家進士為監察御史以謇諤聞其在淮陽清慎寬和有古循吏風觀其慕公為人而為之刻碑志尚之卓可見矣跋書傳輯録纂注右鄱陽董氏輯録纂注二帙先冡宰舊讀之書也國初用翰林學士劉三吾等言蔡氏釋書有與朱子不合者乃作㑹選於蔡傳多所更定頒之學校用之科目先公生當喪亂之後經籍非書坊刋行者不易得當是時學者所習惟輯録纂注而已乃假㑹選官本采其說之異於蔡傳者録于輯録纂注之上下䦨已見于纂注者則但云取某氏說其圈㸃批抹皆先公之手筆先公既以是經登進士第而書藏于家無少損也及四書五經大全既頒而㑹選又廢矣喬新少讀是經弆藏惟謹比者旴水泛溢頗有損壞乃命從孫豐重加裝褫間有殘缺者不復補存古之意也既完韜以綾帕而藏之嗚呼此書先公手澤所存也凡我後人知祖宗得書之艱嗜學之勤尚思所以寶之哉書進士登科録後國朝故事進士釋褐之後禮部録讀卷執事之臣氏名與諸進士家狀并及第三人之對䇿刻之為登科録既進御乃攽在朝羣臣及諸進士以布于天下先公以永樂戊戌登進士第所受登科録藏干弟喬夀之書樓久矣不幸燬于火豫極力訪求不可得近乃得此卷於同邑陳氏家而首尾頗殘缺亟命從孫豐補綴裝褫藏于家嗚呼昔人於平泉樹石猶切切焉戒子孫以保之况此録國家之令典先世家狀存焉子孫覽之可以知先世交遊之多賢家學相傳之有自也豈平泉樹石之比哉以平泉樹石與人者猶曰非吾子孫則以此録與人者真豚犬耳嗚呼凡吾子孫尚念之哉𢎞治壬子秋七月丁丑不肖孤喬新識題江西鄉闈録後永樂甲午科江西鄉闈録一册蓋先公登科之年也程文凡草四篇而先公所作說命義在焉是歲蕭山魏先生仲方考書而它經之去留多取决于先生故所取多知名士如少保泰和陳公循學士吉水周公叙侍講安福劉忠愍公球刑部侍郎丁公鉉監察御史吉水孫公鼎憲副永豐彭公朂與先公皆以學行有聲場屋及小録出士論翕然以為得人而程文純正亦非它料所及此冊先公得於江西鹿鳴宴所攽者也藏于家八十年矣頗有殘脫乃命從孫豐用録縑重裝而寶藏之𢎞治壬子夏六月庚申不肖孤喬新謹識書元豐類稿後南豐曽先生之文有元豐類稿五十卷續元豐類稿四十卷外集二十卷南渡後續稿外集散軼無傳開禧間建昌郡守趙汝礪始得其書於先生之族孫濰缺誤頗多乃與郡丞陳東合續稿外集校定而刪其僞者因舊題定注為四十卷繕寫以傳元季又亡于兵火國初惟類稿藏于祕閣士大夫鮮得見之永樂初李文毅公為庶吉士讀書祕閣日記數篇休沐日輒録之今書坊所刻南豐文粹十卷是也正統中昆夷趙司業琬始得類稿全書以畀宜興令鄒旦刻之然字多訛舛讀者病焉成化中南豐令楊參又取宜興本重刻于其縣踵訛承謬無能是正太學生趙璽訪得舊本悉力校讐而未能盡善豫取文粹文鑑諸書參校乃稍可讀文鑑載雜識二首并書魏鄭公傳後類稿無之意必續稿所載也故附録于類稿之末嗚呼先生之生當洛學未興之前而獨知致知誠意正心之說館閣諸序藹然道德之言其學粹矣至其發之賦詠平實雅健昌黎之亞也世或謂其不能詩者非妄邪校讐既完謹識于卷末跋先兄本茂書蘇秦苦學事豫初學時先兄本茂手書蘇秦讀書欲睡引錐刺股之事以示之且曰秦之刻苦讀書志在說諸侯而取貴富耳世之學者以秦之勤而從事聖賢之學何患不造其極哉喬新揭諸書齊之壁朝夕顧諟不敢忘及宦游中外吾兒道同懼其久而脫落也命工裝潢成卷藏於家近者豫謝事南歸閲家中舊書得此卷時先兄去世已三十餘年矣展誦再三恍若見先兄之面俯仰隔世泫然久之嗚呼先兄之教不肖弟者至矣弟以愚且懶而於所謂聖賢之學終莫能窺其門墻徒抱終身之恨耳乃抆淚識于下方以示子孫使有志于學者以秦之刻苦自勵而以豫之愚懶自懲恭題宣廟戒諭文武羣臣勑宣宗章皇帝嗣位紀元之初敕諭在廷文武羣臣各修職業以贊丕平之治此先臣某為監察御史時所被勑書也聖諭有曰爾文武羣臣其必有以副朕之望攄誠秉義茂乃嘉猷以輔豫德又曰治民者悉心愛民治軍者悉心愛軍用副朕子惠羣生之意又曰端乃心慎乃行務忠厚而戒刻薄務正直而戒邪枉大哉皇言蓋以帝舜命九官十二牧成王訓迪百官之㫖異世而同道也先臣受勑以來夙夜祗奉弗敢違其後出守溫州召為刑部右侍郎改吏部左侍郎升吏部尚書加太子太保歷官三十餘年奉以周旋罔敢失墜宣廟龍馭陟遐久矣先臣違世亦將三紀矣而是勑在臣家寶藏惟謹臣弟喬年懼久而磨滅乃命工裝潢成軸貯以金龍匣藏于髙閣不敢䙝也而屬臣識于下方臣竊聞先儒朱熹讀曽鞏所擬制詔稱其軼漢唐而逼典謨世不以其言為過臣伏讀聖諭雄渾灝噩真可嫓美典謨而無愧矣異時望氣者見龍光燭天煜然斗牛之分必聖諭所在歟時𢎞治六年九月一日刑部尚書臣喬新拜手稽首謹識跋胡氏大雅堂卷君君臣臣夫夫婦婦天下之正道也不幸而遇禍變焉臣效其忠蹈白刃而不悔婦秉其節歷艱險而不渝可不謂大正矣乎然忠臣節婦同出于一郡一縣者蓋寡矣同出于一家者蓋絶無而僅有也若鄱陽胡氏萃忠節於一門殆曠世而一見者歟當元之季羣盜蜂起胡君振祖舉義兵克復城邑行省録其功授饒州府判轉戰至浮梁矢盡糧竭以身死之君子稱其忠君之配趙氏聞變擕其孤叔儀避于鄰境踐荆棘冒雪霜紡績自給卒全其孤以不隕其祀君子稱其節及天下既定叔儀奉母歸復舊業作堂以居之中書左丞周公伯琦為題其扁曰大雅而學士宋公景濓為之記蓋雅之云者正也為臣而盡其忠為婦而盡其節非所謂大雅乎叔儀五世孫韶舉進士纍官刑部員外郎乃取周公之篆宋公之記與董蔡二先生之傳名公碩儒之歌詩萃為一卷屬豫識其後豫三復而有感焉當宋之末疊山先生以秉節不辱死而其夫人李氏亦自經于獄中君子以為忠節萃于一家及元之末又有如府判夫婦焉饒信相望三百餘里而忠臣節婦兩見於其間豈非吾江右山川正氣之所鍾歟豫既感府判夫婦之忠節而左丞之篆潜溪之文又素所向慕者遂識而歸于韶嗚呼韶為忠臣之後尚思趾美踐猷以不忝大雅哉跋晦庵真蹟晦庵先生潜心聖賢之學探索至道其於詞章字畫蓋有不暇留意者今觀先生自書所和張宣公城南雜詠二十首其詞渾厚和平有盛唐風致其字如孤松老柏晉宋間以書名家者未易及也是雖大賢多能所到其所以然者亦本於心耳先生之學以正心為本夫詩心聲也字心畫也心得所養則發之於詩形之於字卓乎絶俗豈世之憊精疲神以學詩學字者所可倣佛哉善學先生者詠其心聲玩其心畫則放心自復鄙吝自消固可得其心法於詞句㸃畫之表矣方伯沈公時暘得此卷寶之不啻懸藜照乘之珍間出示豫拜觀之餘肅然起敬謹識其後而歸之跋蘇潁濵帖右潁濵先生答司法廬陵曽君安强書一通先生歸自嶺表道廬陵而北司法君兄弟見之且致書求教此先生之書所為答也書中稱溫夫之清髙并及移忠之禾譜溫夫諱肅嘗舉進士不第歸而讀書教子不復仕司法君之父也移忠諱安止登進士第為彭澤令嘗著禾譜東坡先生讀而喜之司法君之兄也父兄之賢如此司法君之賢蓋有自矣然而三復此書而有感焉先生見忌於時宰臺諌乘風排擊逺竄瘴癘必死之鄉當是時門生故吏皆畏黨禍無敢通音問者而司法君乃能欵接無所顧誠哉所謂賢者也世之為士者勤學好問為利祿計耳一登第則視故所業若敝屣然其習至今猶然也司法君登第且有官矣而知王氏新學之非猶欲求益於先生不賢而能如是乎即是二事可見其卓乎不可及也司法君之裔孫望宏為刑部主事寶藏此書不啻崇磬離鼎然間持以示豫請識之豫既感曽氏先世之多賢又喜其後裔趾美承休不墜其家聲也因識而歸之椒邱文集卷十八
