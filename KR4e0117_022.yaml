body:
  text: 椒邱文集卷二十二明何喬新撰詩五言律詩挽徐僉憲父母二首澄潭嘉遁處雲樹藹幽居嵗歉頻捐粟鄰爭每赴閭春歸雲榻冷月落夜臺虛竁刻中郎筆文光照故墟靜莊鍾懿質窈窕播徽音象揥無嬌習熊丸見苦心斷機蛛綴密荒砌蘚痕深繡豸焚黃日愁聽陟屺吟夜坐感懷獨坐無誰語寒燈伴寂寥敝衾愁夜卧疲馬怯晨朝往事嗟何及新憂鬱未消何當解塵鞅泉石自逍遙挽張貢士紀新會人之子南州彥觀光到日邉未承黃屋問遽作赤城仙塵暗呈親卷雲寒坐客氊阿咸扶旅櫬歸路淚澘然挽會稽陶懷祖父母合葬鳯效山偕老世應少偕賢古亦稀鹿門方共隱鳳效忽同歸忩月窺殘帙庭螿泣斷機孝孫今令伯清淚不勝揮挽大理卿王公宇二首正氣鍾河嶽芳聲藹搢紳民歌清白吏國重老成人素藴嗟方展清標悵永淪寒颸吹畫翣行道共沾巾相閥槐堂逺儒宗洛學優文宜摛睿藻材足贊皇猷舊舍甘棠老新塋宿草秋清名知不朽髙碣照林丘遊鼓山次主一僉憲韻二首鷲嶺幾千仭登臨眺八方瞻天拱北極望海見東洋嵐藹晴浮碧天花曉雨香莫愁歸路暝明月在山陽花梵鐘聲逺莓臯石徑微山花晴墮几泉沫冷沾衣香閣僧眠穩懸嵓客到稀來遊愜清賞日暮未言歸谷洋公館次尹亞參韻石徑煙蕪緑行行思轉迷雲深田蛤吠雨歇竹雞啼流水聲鏘玉橫橋影卧霓欲窮登覽興殘照墮林西獅峰寺次景澄韻象宇臨幽境猊峰竦異形松雲侵榻冷竹露墮衣青唳鶴驚晨鼓啼鶯亂晝鈴停車問民瘼凄楚不堪聽挽髙時旭蚤負青雲器才華衆所憐終童徒有志賈傅却無年宿草迷孤壠浮埃掩素絃鳳雛今已長振羽五雲邊夢中詠珍珠李成化戊戌秋豫行部至荆門夢人贈豫以嘉樹髙可尺五素花碧實葉光澤如沐植以瓷盆豫問此何樹答曰珍珠李也豫因賦五言近體一章既覺忘其第七句因推上下文意足之時八月草六日夜也天上三珠樹移栽傍玉墀素花晴䔩䔩翠實暖離離不受風埃汚偏承雨露滋江梅同氣味調鼎豈終遺安陸道中見老馬僵卧為之慨然賦二律紀之龍媒天廄種老去力何衰霜重銀蹄裂天寒玉筯垂華陽懷茂草汧隴想青池千里心猶在駑駘莫浪欺壯嵗從飛將橫馳北戍邉暮營嗚咽水曉飲鸊鵜泉曾逐烏騅死仍驅赭汗旋風霜筋力憊僵卧楚山前宿普門寺次都憲副韻四首畫壁丹青古祗園竹樹深花香來别澗松翠墮危岑雲暝龍歸鉢天空鶴度林老懷清似洗不愧古禪心鳴騶過谷口遙望梵宫深弭節穿金澗看雲度碧岑鐘聲晨出壑錫影暮歸林坐覺諸塵寂悠悠水月心寶剎新營日賢藩寵佑增沉檀攽內帑衣鉢屬名僧清梵和天籟禪心映佛燈虎丘推勝境空有塔層層一宿空王宇悽然百感增素餐慚省職髙卧羡山僧問俗晨紆轡觀書夜對燈故園何處是夢繞碧雲層商王河亶甲廟書有河亶甲篇今亡遷國啓雄圖遺靈食舊墟明禋來郡邑禱賽走樵漁德業三宗後丹青百祀餘樂天嗟已矣誰為補亡書白樂天嘗補湯征篇書天寧寺壁聽訟來彰德星軺駐上方蒲團花雨潤石竈芋煙香古塔棲秋鶻空階咽暮螿雙槐行坐處人説似甘棠魯山曉發曉發魯陽城城頭月正明花驄衝宿霧玉莭映疏星茅店客猶睡荒村雞未鳴褰帷將問俗不為看山行江燕二首江燕何微眇飛飛到汴城間情同野鶴巧語愧林鶯掠水臨瓊澗營巢託彩楹夜來風雨惡歸夢繞南榮日麗芹泥軟風清杏雨收烏衣辭故國紫閣結新儔棲傍麟臺穩飛穿鵲觀幽羣梟休側目無意競橫秋宫詞繡閣香風暖珠簾曙景遲倦吹青玉管愁詠白華詩清漏驚宵夢流鶯動夕思羊車幸何處鹽竹謾紛披武寧關書事四首奉詔逺行邉雙旌拂錦韉陳依魚麗法謀用豹韜篇草滿蜚狐塞沙填飲馬泉功成何所願遺像畫凌煙曉度黃花嶺輕裘冒薄寒笳聲驚宿鳥旗影走長蚖孤戍烽初暝陰崖雪未乾何當擒頡利奏凱拜金鑾羣峰環拱處嶻􅑖峙關城北近戎王壘南連漢騎營風髙懸斾裂雪暗凍鼙鳴試數防邉將誰如李北平鳥道縈孤嶂潼函未足多馬肥秋出獵士飽夜聞歌殺氣浮朱戟寒光晃玉珂先聲聞漠北塞騎自投戈歸田述懷謝病離天仗山田自墾荒蛙聲占水旱雞骨卜災祥春釀黃柑美晨羮紫蕨香間居多樂事洗硯寫新章次二守陳一夔韻歸來旴水上花竹有餘歡種秫堪為酒無愁勝作官知心元不易經世亦良難風雨蕭蕭夜茅廬卧正安長門四時詞四首茝石鶯聲滑玄墀栁色新枯梢皆轉緑寒谷盡回春對酒承和景鳴筝拂素塵自憐衰陋質不得待芳辰髙樹陰雲散深宫暮景涼波添鸂鶒浴風送芰荷香復道知天近重城覺漏長祗愁新浴處誰與試蘭湯鴛瓦霜華重龍樓月影圓自嗟妾命薄敢嘆主恩偏擁髻悲前事含嚬數昔愆沉思紈扇句得似緑衣篇天冷肌生粟風清玉散花含情歌白雪適意薦流霞展轉翠衣薄低徊玊筯斜君王求故劒何日遣皇華謁先壠在桃竹坑先塋西澗曲宰樹菀椮椮每值澆松候長懷薦藻心江山涵秀色桃竹起清音為語諸兒輩當知世德深六言絶句漢川分司偶成二首天外凄迷急雨江頭漭沆奔流盡日無人喚渡濟川間却扁舟吾道將行有命斯文未喪由天休信竇家喜鵲試聽蜀嶺啼鵑郵亭偶書古渡平蕪細雨長亭垂栁輕煙詩景滿前堪畫客懷何事悽然椒邱文集卷二十二
