body:
  text: 椒邱文集卷三十三明何喬新撰奏議集略題為霸占蘆洲等事廣東清吏司案呈奉本部送該南京通政使司連狀送據王智剛周興莫圯趙清等連名告係應天府江浦縣軍民籍成化十七年被豪軍王貴奸民韋玘等將智剛等景泰等年間奏奉戶部勘合委官勘明撥補坍江田土等項納糧沙洲投獻已故守備太監黃賜等處占管今又令權豪舍人陳聰違例朦朧告佃糧纍民陪等情又據髙英告係應天府六合縣瓜埠巡檢司砍蘆弓兵本司原額蘆場六處自洪武年間額徴錢糧運送南京工部交納成化二十一年奸民張梅鼎糾合鄰場餘丁林野詭名李鸞强將原額洲場三處包占蘆柴盡被砍賣肥已該徴柴銀鈔貫負纍各兵棄賣子女房屋償官等情到司行文勘斷往往稱係先年奏對之數不肯退還節該伏覩成化二十三年九月初六日詔書內一欵各處地土山場湖蕩軍民開懇管業已久近年以來多被權豪勢要之家及奸詐無藉之徒侵占投獻雖有禁約事例多不遵守以致小民受害無伸詔書到日限一月以內退還敢有不遵並今後仍前侵占投獻者許被害之人告理照例治以重罪欽此欽遵查得成化二十一年該南京吏部等衙門尚書等官陳俊等為應詔陳言共圖治安等事內一件開稱南京楊子江一帶蘆洲俱是軍民承佃及巡司弓兵採打輸官納糧近被豪滑之徒妄作新主無主之洲投獻勢要占管稱要賣錢買辦利歸勢要纍及貧難合無南京戶工二部委官踏勘除成化十一年以前原管不動外近年以來受人投獻但係有主洲場俱各給還本主管業再不許勢要之人受獻亦不許見在官員之家承佃再有妄行投獻者追問明白發遣充軍等因㑹奏節該奉憲宗皇帝聖㫖是准擬欽此欽遵今王智剛髙瑛等各告前因訪得各項洲場先年多係軍民用力開墾及撥佃起科年久欲照欽奉詔書並陳言事例踏勘明白將有主洲場斷還軍民管業緣中間有係近年勢要之家朦朧奏討之數有礙斷給呈乞定奪等因案呈到部續據山東清吏司呈為投獻湖地事據宋名等告係南京瀋陽左等衛餘丁有各祖父先於永樂年間用工開墾營基湖蕩等地成化十八年被軍人靳通等將前項地土投獻屈認租錢今被奸詐之徒張慶等不遵詔書事理仍前妄報投獻以圖收租等因到司行提張慶等前來不服斷理亦呈到部參照前項蘆洲湖地先年俱係軍兵開墾承佃及弓兵採納輸官利及細民事亦歸一近年豪猾之徒投獻勢要之家就行承佃受獻者懼人告爭輒便朦朧奏討或稱係無主荒地或稱係新生沙洲兼指買辦進貢為詞得請之後無復忌憚或以毗連而混占他洲或名起科而欺隱數倍多者萬餘畝少者數千畝遞年花利奏討者十得二三投獻者十得七八業主節次告理難會委官踏勘因有奏討明文只得遷就以致貧難之家業去稅存豪橫之徒地連阡陌幸䝉陛下洞察下情首頒恩詔不許額外進貢仍將地土山場湖蕩退還原主軍民歡忭如獲更生臣等尤宜竭心奉將德音但中間有被勢要之家朦朧奏准管業難擅斷給欲行南京都察院委有風力御史一員本部及南京工部各委公正官一員將成化十二年以後一應投獻洲場地土從公審勘原係軍民用力開墾及先年撥佃起科者照例給主欺隱畝數撥與無田小民承佃果係朦朧奏討曽經起科者一體清出給還原主仍將起科稅糧除豁其侵占投獻及有怙勢不服斷理之人應提問者許令就便提問應奏請者徑自參奏照例治以重罪敢有揑詞妄奏托拾原委官員者聽該科並法司參奏治罪情詞立案不行原委官員亦要秉公循理不許偏執如此則聖澤流行人免被害緣係委官清理洲場地土事理未敢擅便具本専差辦事官齎捧謹具奏聞伏候勑㫖題為修省事該刑部題前事節該太監韋闕傳奉聖㫖近日京城雨水為災南又奏大雨雷雨之異朕當檢身飭行祗謹天戒爾文武百官尤當各加修省勉圖報稱毋事因循各衙門政事有缺失當舉行改正的斟酌停當來說欽此欽遵臣等備員法司所掌者刑所講者律不敢泛及他事竊惟刑律之制肇自虞之象刑其後夏有政典商有官刑周有三典及漢唐宋而律書日繁我太祖髙皇帝肇造區夏本諸欽恤之心旁採漢唐之制定大明律以為輔治之具輕重適中度越前代矣列聖相承因時制宜又有事例以輔律之不及內外法司遵守惟謹逮今百有二十餘年罔敢違越然律文深奧百司官吏講解未明或以一字之文而害一條之義及其引律斷罪往往有乖律意承訛踵謬不知其非此乃有司因襲之弊非聖祖制律之本意也夫律意不明則刑罰不當刑罰不當則民有不得其死者矣臣等謹條今之擬罪有當改正者於後伏乞聖明裁處參酌輕重著於典章頒行天下永為遵守臣民幸甚等因具本奉聖㫖這本恁還㑹都察院大理寺詳議停當來說欽此欽遵㑹同都察院右都御史屠闕等大理寺卿馮闕等詳議得凡告子孫及子孫之婦不孝并監臨官因公毆人至死及因事威逼人致死律例甚明近來有司遇有告子孫及婦不孝者不問虛實即坐重罪因公毆人至死者雖不曽用慘酷刑具俱作酷刑官員起送吏部奏請降調愚民或因忿爭小故致令自盡者俱坐以威逼致死此皆有司因襲之弊殊失律意合依本部所擬改正通行內外法司永為遵守庶幾不失聖祖制律之意其邊逺充軍江南等處發西北衛分江北等處發東南衛分律有坐定地方但近年兵部奏稱內外法司問該充軍人犯俱要就近編發以便勾取合無照依見行事例發遣中間有係苗蠻種類者或發兩廣雲貴衛分充軍以防意外之虞其言國初定律之時鈔重而物輕經今百有餘年鈔輕而物重要將鋃每一兩銅錢每一千文各估鈔四十貫揆之時估固為有理但銀錢估鈔行之已久合仍依原佑其他一應貸物委有估計失當臣等再行斟酌估計務在輕重得中另行具奏定奪緣節該奉欽依還㑹都察院大理寺詳議停當來說事理未敢擅便今將㑹議過緣由開坐謹題請㫖計開一節該伏覩大明律內一欵凡罵祖父母父母及妻妾罵夫之祖父母父母者並絞注云須親告乃坐又一欵其祖父母父母誣告子孫子孫之婦者各勿論欽此竊詳律意蓋謂祖父母之於孫父母之於子天性之至親也子婦悖戻至於毁罵其親故坐以絞然恐人誣告致罪故云須親告乃坐謂之親告乃坐者以見他人雖告不坐也近見問刑衙門遇有祖父母父母告子孫及子孫之婦罵者不問虛實輒坐以絞是乃親告即坐非親告乃坐矣使凡親告即坐何以有誣告子孫之律乎凡人之誣告子孫及子孫之婦者多出於愛憎之偏有因後妻之譖而憎前妻之子者有溺愛少子而惡其長子者有欲奪孫之資産以歸其子者有憎其孫遂及其婦者使親告即坐則雖恭順如薛包孝友如王祥者父母一有誣告將不免於死况於其他乎合無通行內外問刑衙門今後若祖父母父母告子孫及子孫婦不孝者必須追究得實然後坐罪如律若祖父母父母偏私誣告仍依誣告子孫律擬斷庶無乖聖朝制律之意而克全天性之恩矣前件㑹議得合依所擬一節該伏覩大明律內一欵凡官司决人不如法者笞四十因而致死者杖一百均徴埋葬銀一十兩若監臨官因公事於人虛怯去處非法毆打及自以大杖或金刃手足毆人至折傷以上者減凡鬪傷罪二等至死者杖一百徒三年追埋葬銀一十兩若於人臀腿受刑去處依法决打邂逅致死及自盡者各勿論欽此查得見行事例各處有司及問刑官有用腦篐夾棍烙鐡闌馬棍等項酷刑官員問罪起送吏部奏請定奪㦯降雜職㦯革為民蓋所以懲戒殘忍之徒也近見內外官司或因督理公事或因考訊獄囚依法决打致死人命者問刑衙門一槩擬作酷刑黜罷殊與律例不合且鞭作官刑朴作教刑自古有之但不當肆為殘忍以毒其民耳若因公事决打致死輒出為民非律例之意也合無通行內外問刑衙門今後有犯除用腦篐夾棍烙鐡闌馬棍等項慘酷刑具及於虛怯去處毆打致死者照例問罪為民其餘如因公事或笞或杖於臀腿去處决打致死者各依本律科斷不在起送降調之例庶於情法得中前件㑹議得合依所擬一節該伏覩大明律內一欵凡因事威逼人致死者杖一百追埋葬銀一十兩欽此竊詳律意蓋謂諸色人等或逼取田園或強索財物或見其愚弱而恐之以罪或因其卑賤而脅之以威其人畏威懾勢以至自殺者坐以前罪仍追埋葬之資給與死者之家近見街市愚夫愚婦或一時語言忿爭㦯偶因酒醉戲罵本無用勢挾威凌逼情由而愚民輕生輒便自盡者官司往往問擬威逼罪名追給銀兩殊非律意其罪雖止於杖然監追銀兩有力者隨即送官貧窘者淹禁連月甚至於鬻子女典房屋而後完納深為可憫合無通行內外問刑衙門今後遇有此等囚犯研審明白果係因事威逼人致死者依本律科斷若因一時忿爭或因醉戲謔互鬪等項致人輕生自盡别無逼追之情者止依不應并毆罵人等項律條科斷不必追銀庶幾情法相當而死生無憾前件㑹議得合依所擬一伏覩大明律邊逺充軍條內開江南並浙江江西等布政司府分發定遼山西等都司所轄衛分充軍江北並山西陜西等布政司府分發廣東廣西等都司所轄衛分充軍竊見近來編發充軍囚犯不分南北多發西北邊衛充軍蓋以地方遼廓故欲填實邊衛也然此等囚犯多是原問斬絞罪名饒死及一應姦頑梗化輕於犯法之徒往往隨到隨逃仍復為惡雖有仍問死罪處决之例然逃者接踵終不知警况中間又有原係苗蠻種類諳知邊情慣習夷語恐其乘隙逃出邊外為之謀主啓釁擾邊不可不防漢之衛律宋之張元可為永鑑合無今後編發充軍囚徒仍照律內所定地方原係北人者編發江南衛分原係南人者編發江北衛分庶可革其屢逃之弊亦可免意外之虞前件㑹議得充軍囚犯就近編發照兵部見行事例中間係有北人發兩廣雲貴充軍一伏覩大明律凡四百六十條其間計贓科罪者居多至於計贓又須估鈔方可定罪然計贓科罪者律也律一定而不可易以贓估鈔者例也例所以輔律可隨時損益之但國初制律之時每銀一兩值鈔一貫今則值鈔八十貫是國初常人盜銀八十兩方得絞罪監守盜銀四十兩方得斬罪今常人盜銀一兩監守盜銀五錢即坐絞斬罪名雖曰民俗澆漓恐人易犯故重以繩之然非祖宗制律之本意查得正統成化年間都御史陳智監察御史李志剛等各有論奏或欲照依國初估鈔常人盜銀八十兩方坐絞罪或欲照今時估常人盜銀一兩即坐絞罪合而論之贓輕罪重者似過於刻贓重罪輕者似失於縱况陳智等擬奏時估止稱銀兩銅錢而貨物固未之及其後估計貨物雖有定規一向遵行就中輕重失倫者亦多如綿被一件值銀不過七八錢乃估以一百貫金一兩值銀不下五六兩止估以一百六十貫大車一兩值銀十餘兩而以七十貫估之柴草一大車值銀五六錢而以一百貫估之其他估計失當者不可枚舉依此論罪刑罰豈䏻得中合無今後估計鈔貫銀每一兩銅錢每一千文各值鈔四十貫其餘馬騾等畜並諸般貨物本部㑹同都察院大理寺從公斟酌估計務在合乎人情宜於時俗定擬停當通行內外問刑衙門遵依折錢擬罪庶幾得輕重之中而不失制律之意矣前件㑹議得銀錢估鈔照舊其餘貨物另行估計𢎞治二年九月十八日刑部尚書何闕等具題本月二十一日奉聖㫖這本內罵祖父母父母一條係干倫理還著吏部㑹同戶禮兵工四部及通政司六科再將律意講明來說其餘准擬欽此題為陳言愼刑以弭災變事竊見今年六月以來淫雨連綿潦水泛溢京城內外官員軍民之家牆壁傾頽房屋倒塌通州張家灣河西務等處水勢悍猛臨河居人廬舍漂流人畜溺死者衆糧船客船沉沒損壞者不知其幾父老傳言數十年來水患未有甚於此日者也陛下惻然矜憫即命巡城御史督五城兵馬司查勘京師軍民被災者量加賑恤此實畏天愛民之盛心也臣等仰惟陛下嗣位以來勵精圖治約已裕人召用老成貶斥邪佞臺諫有言常舍己以從之刑獄有疑每屈法以宥之宜夫和氣召祥雨暘時若星緯順度山川咸寧矣然雨雹風霆天鳴地震迭見於四方之奏報今京師畿甸又有此水災良由臣等任職無狀不䏻奉宣德意之所致耳俯躬省咎罪不容誅竊伏思之水隂類也以地言之則中國為陽外國為隂以人言之則君子為陽小人為陰以政事言之則德為陽刑為陰洪範庶徴皆由人事所感今雨水為災意者外國之謀侵邊與小人之或干政與皆非愚臣之所䏻知臣等亦不敢越職而言獨以臣職掌言之恐天下刑罰未盡當此亦致災之一端也夫民情狡詐百端而隱慝未易遽察問囚者止據原詞審録者多拘成案至於人命强盜情尤難明人命或因鬭殺誤殺而檢勘者輒以為謀故盜賊或係搶奪拒捕而巡捕者輒以為强劫茍非的有證佐誰敢輕與辨明縱欲辨之衆口譁然或以為受屬或以為納賄以故好名畏謗者寧失入而不敢輕出誠以公道之難明而謗議之易騰此天下之通患也以在京法司尚且顧忌如此則在外可知矣昔臯陶稱舜曰與其殺不辜寧失不經聖人之仁蓋如此伏望陛下因雨水之災廣好生之德特勑兩京法司將見監重囚再行詳審凡情有可矜法有可疑及人命無尸可檢强盜追無贓仗者備開矜疑緣由具奏取自聖裁在外各布政司及直𨽻府衛州縣有巡撫者勑巡撫都御史㑹同巡按並布都按三司官審録無巡撫者勑巡按御史㑹同三司並直𨽻府衛正官審録中間有可矜疑者具實以聞仍下法司參詳取㫖定奪其各處該决重囚亦令决囚官員照奉欽依事理情真罪當者就行處决若有稱寃異詞及情可矜疑者即與辨理具奏處治庶幾刑獄不寃災變可弭矣臣等又聞正統四年六月京師大水為災英宗睿皇帝勑戶部侍郎吳璽順天府尹姜濤存問軍民被水之家具奏賑恤又條示合行事宜勑五府六部都察院等衙門各修其職今陛下率由祖宗令典已命巡城御史查勘京城內外被水軍民給糧賑恤矣其通州一帶水患尤甚乞勑該部委官查勘一體賑恤係官錢糧果被漂流者量為分豁俾聖澤沾被無間逺邇其各衙門合行事宜亦乞遵聖祖勑諭斟酌而行之萬機之暇召問內閣及文武大臣詢訪致災之由同加修省至於修德以凝天命正心以端治原勤聖學以講求治道法祖宗以輯寧邦家此又敬天勤民之大本也尤乞聖心加之意焉臣等昧死陳言不勝戰栗之至𢎞治二年七月初五日具題次日奉聖㫖兩京及在外刑獄寫敕去審録通州扺張家灣一帶並蘆溝橋上下水患户部便差官同順天府官查勘被災之家一體賑恤欽此椒邱文集卷三十三
