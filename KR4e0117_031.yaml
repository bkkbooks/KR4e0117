body:
  text: 椒邱文集卷三十一明何喬新撰墓表節婦劉氏墓表嗚呼女教之隳久矣江漢汝墳之風不復見於世矣有若節婦劉氏者生於教弛風頽之餘孀居三十餘年貞潔之行如一日可不謂賢矣乎節婦諱除維吉其父易氏其母也世為廣昌望族節婦幼有淑質組絍縫製不煩姆傅而工既笄為處士吳公世昌之妻事舅姑撫媵侍罔不中度居數歲處士君有疾纏綿袵席垂二載節婦蚤夜侍湯藥備殫勤瘁無少怠處士君自度不支謂節婦曰吾纍汝多矣吾死汝無壯子將若何節婦泣曰婦之從夫有死無二君茍不諱妾敢有他志耶己而處士君卒節婦時年二十有八一子尚呱呱節婦哀毁幾不能生斂之日拔髮納棺中誓靡他俄而子又死節婦痛之甚嚙其臂既葬處士君穿穴墓傍欲自縊相從於地下舅姑知其必死慰勉之曰汝自為謀則善矣其如舅姑老何節婦感悟乃强自寬躬自節約以養舅姑鄉閭稱其節孝舅姑憐其無子命以處士君弟世旺之子仁傑為嗣初仁傑方在娠處士君降於巫語節婦曰吾弟之子即汝子也其臂猶有汝之齒痕及生視其臂果然節婦撫育仁傑不啻已出仁傑亦孝養備至如實生已景泰元年冬節婦年已六十矣知廣昌縣事新安江侯浩具奏節婦志行無玷請加旌表以勵風俗事下禮部移文核實未報明年三月十四日節婦以疾卒又明年六月禮部請旌表如式詔旌其門曰吳世昌妻劉氏貞節之門且復其家又明年十二月草四日仁傑奉節婦之柩葬於郭頭嵊孫男六曰德曰徵曰某曰循曰衛曰徽孫女三長適黃璿次適李祥次適李成仁傑致隆所後買附郭田二十畝俾其子孫歲收其租以供處士君與節婦寒食祭掃之費且盟於族曰後世子孫有侵此田而怠其祀者宗族共斥之又礱石置墓前請豫表之嗚呼先王盛時所以教於閨閫者備矣居有姆出有傅養其德有樂歌其行而導其志有詩然猶有凱風不安其室者出於其間况於後世乎而節婦卓然如此既全其節又延其嗣生也鄉閭稱之殁也朝廷旌之真可謂賢也已嗚呼彼錦衣象揥者孰非人婦哉孰非人婦哉豫故表之以勸為人婦者明故中順大夫福建按察司副使辛公墓表成化九年冬十月三日福建按察司副使襄城辛公以疾卒於家是歲十二月四日其孤耕與其壻髙瑁葬公龜山先塋之次葬後五年豫遷湖廣布政使道襄城過其家弔焉耕奉公行狀泣而請曰先君葬已久而墓石無文懼無以昭德垂逺惟先生圖之噫公豫之畏友也其奚辭按狀公諱訪字咨道其先本魏侍中毗之後世家真定之陽曲曽祖友敬避亂徙許之襄陽城遂占籍焉祖諱達以子貴贈承德郎户部主事考諱謙以公貴封文林郎四川道監察御史母蔚氏贈太孺人公自少端重不妄語笑年七歲父兄授之書不數過輒成誦巡按河南監察御史趙公遇諸途奇之召補邑庠弟子員公篤志問學文詞典贍邑之耆宿皆器重之正統丁卯以詩經中河南鄉試第三名景泰辛未登進士第觀政吏部益務進學公退未嘗釋手時豫先公為吏部尚書好誘掖後進一日召諸進士試之命題以光武賜隗囂書唐人送李願歸盤谷序公所作詞理淵永先公亟稱之㑹都察院御史員缺詔吏部選進士勤慎者補之先公曰勤慎莫如辛進士者遂擢廣東道監察御史糾慝繩違克振憲度康定皇帝念西北邊兵戍守良苦敕公賫金帛往勞之先時使者憚臨邊不親致賜故將校多侵尅賜物者公馳至延綏榆林召集戍卒稱詔慰勞而賜之人人皆霑上恩丁孺人憂解官居喪足不踐公門服闋赴京同儕多願居輦轂下以便進取公自言親老願官南臺以便養冢宰王公賢之改南京四川道益以廉慎自持風裁凛然都御史蕭公深重之獄之疑者多以屬公都憲軒公督南京糧儲持法甚嚴御史鮮當其意者獨賢公且曰吾老矣堪代我者惟子而已天順己卯秋應天府開科取士蕭公命公監試主司欲取其所親衆以主司官翰林不敢言公厲色曰大比興賢顧可徇私耶主司赧然而止遷浙江按察司僉事抵任錢塘仁和二縣循故事具供張什物送官舍公悉却之或以故事為言公曰辭受惟其當而已何必拘故事也處州頑民聚徒千餘盜採銀礦衆議發兵討之公曰兵刃既接必有死於無辜者乃揭榜諭以禍福衆皆歡呼而散公暇輒詣學宫進諸生講論經史金華舊有麗澤書院以祀吕成公歲久寖圮公命有司新其祠宇又以何文定公基王文憲公柏金文安公履祥許文懿公謙承朱文公之正傳奏請立祠鄉邦春秋致祭以風厲學者桐廬大姓連姻權貴怙勢恣橫部使者莫敢誰何公獨捕治之當道交屬且脅以危言公竟抵之法由是忤權貴意有薦公者輒沮之刑部侍郎曽公訪察浙江諸司以不職黜者甚衆獨稱公廉能力薦於朝升福建按察司副使奉敕巡視海道瀕海大姓私造海艦歲出諸番市易因相剽殺公捕其渠黨而置諸法沒入其艦事連達官窮治甚急其家訟於御史誣公激變良民或勸公稍緩其獄公奮然曰吾寧執法而死不忍賣法而生也自是奸民屏息海道肅清未幾文林公卒公聞訃號慟幾絶即解官北歸寮友致賻皆不受既襄事負土築墳手種松柏有助之者輒辭曰人子所當盡也嗚呼公之行治如此然官終四品年僅四十有八不獲大用以究其志此君子所為痛悼也公先娶王氏封孺人繼娶邢氏男五長即耕次曰耘曰耒曰植曰溉女五長適髙瑁次適許某王恬吳溥田􅀈公恬淡寡欲官南臺時未有子或勸之買妾公謝曰吾妻已産女矣安知終無男耶居官二十餘年常祿外一芥不取於人其自閩奔喪也延平太守與公同年知公貧厚資幣將賻焉公知之過延平稱疾卧舟中不起太守不能見而去平居癯然言若不能出口至其據法守正毅然不顧慮雖萬夫莫回也昔孔子謂未見剛者或曰申棖孔子曰棖也欲焉得剛嗚呼剛者不可多見久矣若公非所謂剛者歟其所以剛者非以其無欲歟豫嘗與公同官於閩故表諸其墓庶幾有聞其風而興起者雯峰先生饒公墓表嗚呼此雯峯先生饒公之墓公嘗仕為郡守惠澤流於人聲績焯於時矣豫不稱其官而表其墓曰先生者蓋先生有德之稱為士而有德功名富貴不足道也公諱秉鑑字憲章世家廣昌之麟昌里曽祖仲實祖文逺父希明纍世不仕而以長厚稱母揭氏公生長巨室思以文學顯其身以及其親初從監察御史聶公宗尹受春秋又從教諭羅子濬受尚書發為文章詞采爛然見者驚異弱冠逰京師先冢宰一見許以國器且作文贈之曰他日竦壑昻霄必此子也正統甲子領江右鄉薦兩試禮部名俱在乙榜例授教職辭不就卒業太學時李忠文公為祭酒士之明睿者多在館下公獨與彭文憲公友朝夕相切磋學益進景泰三年除廣東肇慶府同知肇慶地險俗獷號難治公疏瀹宿弊均徭賦繩豪猾惠貧弱境內以安鄰郡有羣盜侵掠至境上公督民兵敗之斬獲甚衆屬邑有奸氓聚羣不逞欲為亂公單騎入其地曉以逆順衆歡然羅拜而散右都御史馬公昻征瀧水猺公獻平蠻䇿馬公善之委公督兵餉暨蠻寇平又委公城瀧水上其功於朝升四品俸僉都御史葉公盛巡撫兩廣召公詢以時事公具言盜賊所由起與平寇安民之䇿葉公深然之用其言羣盜稍戢僉都御史李公秉巡撫南畿聞公名薦於朝欲以為太平府太守不果用尋以葉公薦遷知廉州府廉與交址接壤連年用兵重以中貴採珠邊民不勝其困公規畫有方民以不勞又什伍其民教以騎射有寇至輒擊敗之葉公上其功特賜寶鈔綵段公痛兩廣賊勢日張民日凋瘵具奏監軍及諸將無平賊方略所至惟事刻剝戰小勝則張虛聲以邀賞大䘐則匿不以聞臣恐數年之間兩廣盡為盜區矣章上權貴大怒思有以中之㑹公督兵餉逺出寇乘虛襲城陷之衆因以失守為公罪坐褫職廉民千餘人詣當道訟寃且言知府文吏非守城者况以公事逺出城陷非其罪也乞還知府以活吾民時當道多忌之者莫肯上聞公歸家優游泉石以書史自娛又作義倉以賙貧乏立義學以教宗族建雯峰書院與翰林修撰羅應魁講學其間成化二十二年十月十七日以疾殁於家享年七十有四初娶黃氏繼娶王氏無子以弟秉綱子弼為嗣一女適同邑何慶同弼以卒之年十二月十一日葬公於里之南應山所著有雯峯集春秋提要春秋㑹傳傳於世葬後八年弼録公行實求豫表諸墓豫讀秦漢以下史疑命之有無久矣及論次公行事首末乃知事之窮通信乎有命也公少以博學自負鋭意取進士所交多一時豪傑然以議論不合於主司不克如其志及既出仕政聲日聞慨然欲以功名自見於世然官僅止二千石竟以非罪黜當公黜時李公為冢宰馬公為大司馬葉公為少宗伯皆素知公者然不一引手救豈非命耶嗚呼世之為太守者多矣然殁而使人稱為先生者則不多見也夫使人稱為良二千石曷若使後世稱為先生以昭其有德哉嗚呼雯峯峩峩雯溪溶溶先生之名與世無窮桂林太守衡公墓表皇明有廉吏曰桂林太守衡公汝寧西平人也其歷官三十餘年清白之操若冰玉然其謝事家居貧不自存其殁也身無以為斂子孫無以為喪真為吏者之師表也公殁草餘年豫為河南按察使移檄汝寧訪求公後得公之子平召而詢之道公之履歷甚詳且丐文表諸墓公之守桂林也先公實薦之豫於公有世舊誼不可辭乃為叙之公諱嶽字世瞻其先世家隨州父通元季以武功纍官至百夫長典屯香山國初棄官歸過西平道梗不通遂留家焉母周氏慈惠喜施豫公少以俊茂補郡學弟子員中河南鄉試遂升太學洪武三十年詔國子監選諸生通理道者赴詹事府議事六館之士咸推公往公敷陳時政切而不迂所司以聞擢廣東潮州府同知公酌已惠民自常祿外餽遺一無取布衣蔬食不異寒士嶺海間翕然稱其廉三十五年遷陜西西安府知府其清操善政如在潮時丁內艱去職服闋改知慶陽益以清白自勵民愛之如父母僚友諸婦嘗㑹飲公之內子與焉在席者金鈿綺繡爛然而公內子荆叉布裙而已既罷頗不樂公曰汝坐於何處曰首席公曰既坐首席又要服飾華好富貴可兼得耶慶陽人至今以為口實永樂十年朝覲至京以言事忤旨謫戍交址慶陽西安二郡民千餘人詣闕請貰公以終其惠不報仁宗皇帝嗣位下詔求賢監察御史袁錠鹽運使何士英指揮范智交章薦公起為南城令以舊官復任改南豐令其為令祿薄不足用常於官舍種蔬以自給家人或有慍色輒曰不猶愈於充軍時耶無不意滿正統四年夏五月公秩滿至京欲告歸時先公為刑部侍郎薦公於朝遂擢桂林守在郡五年廉慎之操愷悌之政始終如一以年踰七十致其政而歸景泰三年三月三日終於家享年八十有四葬於縣大堰灣之原配王氏有淑德子七曰友民曰忠曰用曰平曰直曰美曰慶孫八曰世隆曰鏞曰世雄曰林曰海曰鉞曰鎧曰錠今都御史江浦張公巡撫河南過西平聞公之賢令有司恤其家且補世隆鏞邑弟子員俾紹素業嗚呼廉吏之不聞於世久矣碩鼠之刺城烏之謠在古且然况後世乎世所謂貪者固不足道其矯而為廉者垢衣敝屨以欺人而後房姬媵極珠翠之麗亦豈真廉者哉若公者乃真廉吏也豫故表其墓以為世勸故承事郎趙君孺人華氏墓表承事郎無錫趙君汝明之配曰孺人華氏以𢎞治元年春三月十有九日卒其子濴沔卜以卒之明年冬十有一月六日葬於邑嵩山先塋啓承事君之兆合而窆焉先期以江西布政使秦君廷韶所述孺人行狀託其父友吏部員外郎馬君宗勉屬豫表諸墓豫亟辭不獲乃托狀所述叙而表之曰孺人諱淑清無錫之名家子在元初有諱子勉者纍官江浙財賦都總管府同知其五世祖也曽祖德逺祖仲安父以常皆隱居不仕而以資産雄於鄉母虞民自幼溫嬺靜莊稍長習蠶績紉縫之事暇則誦詩書習圖史足跡不出閨閣父母愛之曰賢女也擇所從以歸承事君時舅姑在堂孺人入門孝養篤志姑嘗盛夏遘疾孺人左右扶持晝夜無少懈疾亟刺股血和羮以進姑啜之頓愈自舅姑以及六親又皆曰孝婦也趙系出天潢族大資厚而承事君無他兄弟恆執役於官孺人綜理家政僮使千指凛凛趨命凡歲時羔豚之祭宗戚慶弔餽遺之禮咸中儀則田園之籍日增承事君歎曰吾家業所以益充者以有賢嫓焉耳承事君三男子其一孽也孺人教字如一及諸子就學督勵甚嚴閲史見古人善惡成敗輒舉以語諸子曰汝當為此不得為彼故諸子皆嶷然有立鄉之人又皆曰趙氏諸子秀出者非獨承事君之教蓋有內訓焉承事君卒孺人傳內政於其婦日誦佛書安恬自適而已及得疾諸子涕泣進藥孺人曰吾年踰八十得從汝父供養舅姑於地下足矣何以藥為不食數日而卒距其生永樂六年八月二十有四日享年八十有一子男三長潚次濴次沔俱以輸粟授承事郎潚後孺人一年卒女四華春顧瑜蔡祚蔣堂其壻也孫男二長楠以餉邊功授蘇州衛指揮僉事次桓孫女三曽孫男一其子孫繩蟄又如此豫讀劉向列女傳見其所叙多者人二三事少者一事而已若孺人者生名家嬪名士女德婦道母儀皆可紀而又享夀考多子孫視向所傳奚愧焉顧豫不腆之詞不足昭孺人之懿行姑撮其大者以遺其子俾琢石墓上庶幾有如向者採而傳焉通議大夫雲南按察使劉公墓表成化十有四年春雲南按察使劉公仗和帥其屬入覲懇求謝事吏部以聞憲宗皇帝特允其請公歸徜徉林泉者七年以疾卒於家享年六十有四時二十一年五月草有四日也其子縝等以是年九月庚午葬於邑黃土尾之原依先壠也葬後五年公之子絢㑹試來京詣豫拜且泣曰知先君之行詳且實者莫先生若乞為文表諸墓嗚呼公實忠愍公之仲子惟忠愍公與先冢宰同領鄉薦而公又與豫同舉於鄉同登進士第世契之厚非他人比誼不可辭乃為叙次其事俾刻之墓上公諱釪仗和其字也其先本長沙定王之裔王之子蒼别封安城侯安城即今吉之安福也至其孫夀光以罪國除因家於邑之茨溪祚𦙍蕃衍歷唐及宋以至於元代有顯者曽祖諱子定别號新齊始自茨溪徙家邑之葛溪祖諱伯文别號文園贈禮部儀制主事考諱球由進士纍官翰林院侍講上疏牾權奸殁於制獄贈翰林院學士諡忠愍母鄧氏纍贈太宜人公自幼頴敏過人忠愍躬教之時姚文敏公學於忠愍公之門公與之上下議論文敏每嘆服之稍長從學於禮部侍郎李公克述學益大進㑹忠愍以忠諌受禍公哀痛毁瘠幾不能生服闋讀書養母無復仕進意景皇帝即位臺諫言忠愍之寃詔贈官賜諡且祀於郡之忠節祠刑部侍郎楊公彥謐巡撫江西召公語之曰而翁忠節已獲昭雪子可以仕矣公乃赴江右省試以春秋魁多士登甲戌進士第改翰林庶吉士預修寰宇通志書成賜楮幣文綺擢廣東道監察御史未幾出巡福建畿郡遼東於時同官者務擊搏以峙聲威公獨慎憲度理寃獄察吏治巡歷所至訪民利病而興除之不求赫赫名人皆以為得憲體真定有嫠婦不安其室其族長恥之合羣從毆殺之有司坐以謀殺當死者七人公曰此羞惡之心所發也何可深罪具以上請遂皆免死福建都指揮僉事錢輅與其長劉姓者有隙劉密白鎮守中官誣以罪乘夜以兵圍其第輅覺而逃中官遽以輅反聞廷議遣官㑹公核其事輅亦詣公自首公具奏輅懼罪而逃非反也輅得釋每語人曰微劉御史吾族夷矣汀州豪民欲奪鄰之墳地以葬其親鄰不與豪怒言於朝云其地當出帝王英宗遣中貴人㑹公驗之公曰七閩遐且僻寧有帝王地耶置妄言者以法既還臺同官以私忿欲劾大臣且誣以閨門之私以章示公公曰言事當顧大體奈何以曖昧之事汙衊大臣其人慚而削之天順甲申升浙江按察司副使奉璽書提督學校公至則明教條嚴考校進茂良黜惰窳由是兩浙文風丕振擢倫魁登膴仕者彬彬焉成化辛卯遷按察使或疑公優於文學法律非所長及見公聽辭决獄曲當其情乃大服尋丁太宜人憂去服闋改雲南按察使雲南荒服之地外與哀牢交趾接公因俗為治寬其禁令馴以恩信蠻僰畏而懷之及公歸羣夷皆太息曰是善撫我者何遽去耶公娶伍氏封宜人子男三縝舉進士為南京禮部主事徽以餉邊功授承事郎絢鄉貢進士女二適袁州醫學正術歐陽淮次適廬陵庠生曽洪孫男七祚祺禧祠禠䄡祩公性孝友忠愍公殁事太宜人以孝稱與兄參政仗德友愛尤篤接人一以誠意而世所謂機變之巧若無聞者居官盡其職分所當為未嘗衒能矜名以求人知而當道亦無能知之者故其官止於此昔司馬溫公論才德之辨以為聰察强毅之謂才正直中和之謂德且謂察者多蔽於才而遺於德若公非所謂正直中和者耶然官止三品而未極其用抑察者有所遺耶雖然諸子翼翼諸孫蟄蟄天之報公庶幾在此而無斁豫故表諸其墓以為樹德者之式云故中奉大夫廣東布政司右布政使左公墓表𢎞治二年冬十有二月壬子廣東布政使旴江左公以疾卒於家時其子慧游學京師聞訃號慟詣豫泣且拜曰慧不孝禍延先君方有疾不獲躬湯藥及殮又不獲視衣衾之厚薄兹將匍匐歸襄事大懼先君善行無傳以重不孝之罪敢求先生之文表諸墓用垂永久嗚呼公豫畏友也年雖少長於豫而素强無疾豫方期謝事南歸得從公徜徉紅泉碧澗之間孰意遽止於此耶表阡之文奚忍為之然念公與豫有世契重以慧之請又不忍不為也公諱贊字時翊世家旴之南城曽祖諱友文仕元為平樂州學正署南城縣尉事祖諱彥彰以能詩名贈文林郎監察御史考諱瑺别號訥菴登進士第纍官山東布政司左參政以公仕於朝贈大中大夫資治少尹妣白氏纍贈淑人公初有至性方五六歲母淑人患乳癰甚危公日跪膝前吮之癰尋愈稍長就學日記數千言作詩語出驚人字畫遒徑可喜少宰同邑鄭公文實見之謂訥菴曰此兒頴悟過人當使從碩師必克有成訥菴乃命公學春秋於太宰姚公大章學書於太常卿程公南雲由是以詞翰名於時公天分既髙加以篤學未冠博極羣書於經史疑義制度沿革罔不窮探而謹識之名儒宿學皆折輩行與之友寧獻王聞其名召見使賦玉界尺詩援筆立就王覽之亟加稱賀且曰秀才詞翰兼美不易得也以所作草書賜之天順丁丑登進士第擢吏部稽勳司主事丁訥菴憂去服闋復舊任未幾丁淑人憂去服闋改司封主事尋升稽勳司員外郎又升郎中政務之暇搜覽百氏作為文章未嘗少廢嘗同考禮部㑹試取舍各當士論稱之遷浙江布政司右參政巡歷列郡所至勸農興學理寃獄謫奸豪兩浙荒歉之餘露胔遍野公檄所司殮而瘞之吏部纍薦公材堪典大藩不果用成化二十二年秋升廣東右布政使未赴以老謝事優游泉石先世有别墅在麻源三谷每風日清美輒與鄉之耆舊登覽觴詠或連日忘歸家素充裕鄉人有假貸不能償者即焚其劵家食時嘗宿逆旅旁舍有自經者衆救之而蘇公問其故曰負官租不能辦耳公如數豫之不問其姓名其好施多此類與人接無賢愚皆盡其歡然其所推以為賢者不過數人君子是以知公非泛交者初公學於姚文敏公又受知李文達公二公秉鈞衡人謂公且大用然公外和內剛議論是非不肻少假借以是為當道所忌在浙藩九年吏部薦章屢上皆為同進者所先公恬然無毫髮見顏面晚乃登用而公無意於世矣娶胡氏有賢行纍封宜人側室林氏劉氏毛氏子男二長即慧次曰愷女六適同邑鄧升陶祿上官偉黃某張某孫男一曰俌孫女三所著有桂坡遇録一卷桂坡文集三十卷梅花百詠一卷深衣考正一卷厯解易覽一卷皆傳於世桂坡公少時讀書處因以自號公為人豪邁不羈至其為文謹繩尺崇理致讀之溫然可愛其書兼善諸體而尤精於𨽻端重奇古得二蔡筆意憲宗皇帝嘗訪求善𨽻書者或以公所書進上覽之稱善諸子卜以某年月日葬公於某山之原蓋公生前所擇吉壤也豫嘗論先王盛時名卿大夫之胄多能世其家自漢以來若汝南袁氏河東柳氏東萊吕氏蓋亦庶幾焉其子若孫雖隱顯不一德業不齊然風流文雅終異乎崛起者旴江左氏望臨一鄉訥菴以謙恭惠和之德作於前而公以宏博俊瑋之材振於後信乎其家之多賢也視世祿之家不以一善聞者何如哉訥菴與先冢宰為同年友而豫與公有通家之好故撮其行已為政之槩表諸墓非徒著公之行以示其子孫以告吾邦世家俾有所感奮焉祮古余先生墓表先生諱倫字公理姓余氏其先有諱澄者家蜀之眉山仕唐官至諫議大夫卒諡曰襄諫議之子諱慶為臨安太守廣明之亂避地下邳其後再遷於新安至梁開平間又遷南豐之沙溪今所居是也曽祖諱平甫隱居求志祖諱文德歲凶減價以糶鄉人德之父諱應祖憫鄉之子弟無師設義學以教之母某氏婦道母儀宗姻稱焉先生自幼頴敏好學而不樂仕進構一室以為講學之所積書數萬卷法書古器充牣其中日與名人賢士講論聖賢之學扁之曰袺古士大夫皆有賦詠學者因稱為袺古先生鄉鄰有競者請先生質之辨其曲直無所徇罔不心服或恥以是非溷先生中途胥命而返平居儼然端坐雖族子孫過門不衣冠不見既見誨以古人為已之學間及經史疑義皆充然有得而退有司欲以賢良舉固辭不就凶歲鄉鄰飢窘先生竭囷倉以賑焉不足則貸於巨室以益之憲宗皇帝嘗詔民年八十以上為鄉里推服者賜以冠帶先生與焉居鄉益恂恂謙慎不以受寵誇里閈每歲有司舉行鄉飲請為正賔亦謝不往不敢以齒德先人也先生雖老素無疾一日體中微覺不佳遽就枕家人欲召醫搖手止之溘然而逝時𢎞治六年二月七日也娶宜黃樂氏宋名臣史之裔有賢行子男二曰瑑曰球女一嫁豫子道同孫男三長淳次汳季學孫女二瑑等卜某年月日奉柩葬於某山之原且述先生之行為狀屬余表諸墓豫讀兩漢以下史見士之隱居不仕德義著聞者代有其人雖五代亂世亦有可紀如鄭遨李自倫者求諸近世蓋不多見先生以文學行誼師範一鄉有戚同文之風發粟賑窮惠其州里有連舜賔之賢至於鄉人爭訟直於其家又如古之王彥方嗚呼孰謂今之人果不及古人哉豫故表諸其墓使過者知吾鄉有行誼如古君子者異時太史氏傳逸民獨行者或有采焉承事郎黃君廷瑞墓表銀溪黃君愈敬以書告豫曰吾兒琮殁且葬於兹十有四年矣每念及之淚輒澘然下蓋是兒也生而淑吾不能永其年思所以永其名嘗礱石置其墓前子能為吾表而識之以紓吾哀乎因授豫以行狀豫不獲辭則叙次而歸之曰琮字廷瑞愈敬第三子也自其曽祖仲名祖希古世以善聞而愈敬溫恭惠和克紹先儀母賴氏邑名士伯淵之女廷瑞幼時姿儀端潔容止言辭溫溫可愛自宗戚以及里閭皆嗟異之稍長朝夕怡愈以共子職與兄璋琳弟琬琰璨友愛尤篤家雖充裕而服食有常度無豪靡之習鄰邑寧都令羅圭以歲歉走書勸廷瑞出粟賑飢廷瑞曰此義事也白其父出米二百五十石以賑不能自食者事聞朝廷授廷瑞承事郎以寵之一日得疾慮貽父母憂戒家人勿言疾既亟父母問之乃泫然曰兒弗克終養矣又屬其兄延素與往還者至私室從容道故舊與訣且曰修短命也顧恐吾親不自堪耳客退沐浴正衣冠溘然而逝時成化辛卯八月草一日也距其生正統癸亥正月十一日得年二十有九以沒之年十有二月六日葬邑之古原山前坳之陽娶寧都蕭氏義民大韶之女生二子男曰極女旺廷瑞既殁蕭自誓守節以事老字幼為已責今極已授室而旺嫁豫子永孚鄉里皆嗟歎其難嗟夫人之有賢子孰不願其壽考哉然夀夭有命焉韓子有言生而不淑孰謂其夀死而不朽孰謂之夭觀愈敬過時而哀可以知廷瑞順乎親觀蕭氏不二其操可以知廷瑞刑於家是所謂殁有令名夀莫永乎此也嗚呼廷瑞其行也良其名也光年雖不延其存者長百世之下過其墓者讀豫之文庶幾勿伐其樹勿啓其藏耶椒邱文集卷三十一
