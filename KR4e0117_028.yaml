body:
  text: 椒邱文集卷二十八明何喬新撰廟碑廣昌縣重修廟學碑皇帝嗣統改元之三年夏四月同知建昌府事麻城蕭侯允恭行部至廣昌爰詣學宫祇謁先聖先師顧杗桷摧朽圖繪䵝昧慨然太息謂廣昌名邑耆俊多此出焉而廟學不修殆非我國家崇聖道育俊材之意吾為郡佐與有責焉敢不以修飭為己任乃告太守三山謝公仲仁用圖改作議既克合侯首捐俸金四百八十銖為倡於是縣令莆陽葉君茂髙丞晉陽李君拳暨學之師生縣之義民祇若侯意或輸之財或助之役奔走奉承以後為羞乃僦良匠市美材斫石為礎埏埴為瓴煉蜃為灰筮日奏功始事於大成殿黼坐朱几廟貌孔嚴旁及兩廡拓而大之自羣弟子以及從祀諸儒圖像惟肖前為正門列以畫戟外惟三門上應靈臺又作先賢祠以祀鄉之先正至於齊舍庖庾之屬欹側者正之陊剝者修之丹雘漫漶者飾之侯往來涖縣躬自督勸衆歡趨之不煩執撲經始於是歲夏六月越明年戊子春三月始考成焉殿廡靚深門闥宏麗多士聚觀以為他邑所未有也侯帥令佐師儒舍菜於新宫告成事焉教諭桐廬邵君忠訓導英山段君俌湖南王君涣暨學之諸生謂侯嘉惠此邦聿新廟學不可無辭以揚休聞相與伐石置廡下而屬喬新書之喬新竊惟魯僖公作頖宫史克頌焉吳仲庶新潭學王臨川歌之今蕭侯修學養士之勤殆無異於魯公潭守所建立而聲歌不作非闕典歟乃具書其成績於碑而系之以詩以繼頖宫潭學之聲以昭示於來世侯字某以儒發身佐郡有威惠其善政可繼者甚多以非廟學所係故不書其詩曰盱水之曲奕奕新宫孰經孰營蕭侯之功於惟蕭侯民之父母蘇枯齦强惠澤孔厚華幡彭彭戾於我邦念兹庳陋顧瞻倣徨乃究乃圖乃戒工徒乃卜乃諏爰兹暨塗有伉惟門有翬惟殿丹楹藻梲罔愆彜憲我材孔良我役惟時閲歲乃成匪亟匪遲新宫告成祀事孔明毛牷斯疈黍稷惟馨侯升講堂襟佩濟濟或誦或絃亦文亦史侯曰朂哉敬明乃德厥德靡修我心有戚諸生拜手侯訓惟休勉焉祇服敢遺侯羞麗牲有碑方趺圓首侯之嘉聞百世不朽建昌府重修城隍廟碑天下郡邑通得祀者惟城隍之神為然蓋築土為城鑿土為隍凡以為民之衛焉髙城浚隍固風氣扞寇攘必有司之者察民淑慝而禍福之非妙萬物而神者與建昌城隍旴江志謂其神乃漢頴陰侯灌嬰考之於史侯起布衣佐髙皇定天下垓下之戰䠞項羽東城而誅之遂渡江平吳定豫章諸郡凡大江之西皆侯提戈斬級所立功處生為元功殁為明神其理必有然者則司此城隍而廟食無窮者非侯其誰哉廟舊在郡之西北宋紹定四年回祿煽孽郡人聶衛公子述始遷於城南通㑹門內太平寺之故基元至正壬辰為羣寇所燬國朝洪武十年知府王稱復建自堂徂門罔不畢備永樂二年知府潘榮仲因其舊而修之逮今八十餘年棟楹楶棁漸以腐折瓴甓丹堊日滋刓泐成化二年春郡守三山謝侯仲仁謂廟宇傾陊不足以妥靈將事爰咨羣僚下暨有衆相與捐金楮市木石鳩工徒撤而新之易腐折為堅良革刓泐為端潔若堂若廡以及三門凡為屋二十間崇廣有宜文質中度左右司則仍其舊而加圬塓焉又搏土以肖神像琢石以為神座别創雲崖道院俾本廟道士居之肇事於是歲夏四月至冬十二月乃訖功焉侯刲羊豕帥寮屬告成於神闔境民庶聚觀讚頌凡旱潦之變癘疫之興必祈焉報焉禬焉禳焉將事益安靈貺斯勞物不疵癘歲屢豐登侯乃具廟之本末遣耆民胡以榮屬豫紀之豫惟守土之職神人具依侯自下車以來勤心庶政民既太和又飭神宇用安其靈所謂惠於神人罔怨罔恫其諸豈弟君子者與乃作迎享送神之詩遺之使并刻於麗牲之碑歲時薦獻工祝歌之以侑牲醴焉是役也贊其成者同知麻城蕭侯允恭通判某推官某董其役者耆民某也其詩曰神之來兮冷然以風絳旍旖旎兮駐斯宫眷威靈兮有赫敷佑我民兮無窮牲腯兮酒馨鼓坎坎兮瑶瑟和鳴神之所享兮在寅清我之將事兮在齊明明神既享兮遲迡風馬雲車兮倐何之姑山之顛兮盱水之湄儼神馭兮娛嬉神不我顧兮我心悲家有雞豚兮野有粳稌神惠我民兮俾蕃以庶驅癘鬼兮錫我純嘏春祈兮秋報歲復歲兮敢忘神祜東平王廟碑廣昌之東園有祠曰東平王者宋咸淳中縣令朱汝賢所立以祀唐忠臣張睢陽也按史王諱巡舉進士纍官真源令祿山之亂起兵討賊與賊將令狐潮尹子奇等大小四百餘戰屢挫賊鋒後以孤城援絶力不敵以身死之當是時逆胡起河朔蹂躪河華兵禍蔓延幾遍天下而王以區區睢陽扼其衝賊死咋終不敢越而南江淮之間晏然不識兵革者王之功也王之將死也西向再拜曰臣生無以報陛下死當為厲鬼以殺賊道家者流遂謂王受命上帝為瘟部帥察民善惡而賞罰焉其說窈𡨕蓋不可信然江淮之民慕王之忠烈且信道流之說故所在立廟水旱癘疫必禱焉其應如響東園之祠其一也永樂甲申廟圮於水正統庚申邑民始修復之時先公為刑部侍郎記之甚詳歲久滋敝天順八年冬十一月豫從兄本堅弟喬福暨耆民吳大成居士揭仲雍大覺寺僧道霖等始合衆力而新之中為正殿後為寢室前為飲福之亭越明年夏六月廟成簷楹翬騫金碧絢麗梐枑嚴整劍佩葳蕤耆稚聳觀以為有廟以來未覩兹盛道霖因豫弟喬年求紀其成績夫王之忠烈無以贊為矣論者或謂王生鄧州死節睢陽其平生足跡未嘗履江南廟而祀之恐非先王制祀之意是不然宇宙間屈伸變化不可測度者神也神之所以然者氣也得其氣之剛大靈著者則為偉人發為忠義之業炳然巍然不幸而死其精爽耿耿者不為異物澌盡復為明神無所不之焄蒿悽愴隨所在而著見焉若王是已廟食於兹夫何疑哉初王著神南土號封纍加其曰東平威烈昭濟顯慶靈佑王者宋景定元年十一月所封也乃作歌遺之使邦人歌以祀王庶幾飈游來格降福於民焉其歌曰桂醑湛兮瑶觴簫鼓鍧兮中庭靈連眷兮未來渺豫思兮睢之陽靈之來兮旗纛繽紛駕赤虬兮驂蒼麟霽雲先驅兮殿以萬春歆我蒸嘗兮穆且欣嗟天寶兮多盤胡騎鬨兮關河昏長蛇在闕兮龍在野悵孰掃兮妖氛靈哀憤兮援戈起彎烏號兮射妖豕北風競兮西日蒼凉力既竭兮繼之以死身雖死兮精爽不亡陟降帝廷兮乘陰陽察民善惡兮下殃祥龍岡之下兮盱之滸松筠蕭槮兮緑陰承宇朝出逰兮暮來歸越千歲兮毋逺兹土屏蟊賊兮驅癘鬼錫我百福兮夀且祉靈之降福兮不那我民報祀兮終古無已漳州重建道原堂碑漳州治城之西北有臺屹然曰臨漳實據溪山之勝宋紹熙庚戌紫陽朱夫子守是邦登兹臺而愛之欲築讀書之室不果寶慶乙酉郡守危楨始倣白鹿洞規築龍江書院於臺之下成夫子之志也淳佑丙午郡守方來復於書院之東偏構堂三楹肖夫子之像于其中配以髙弟北溪陳安卿每歲春秋率庶僚暨邦之羣彥祀焉而顏其堂曰道原蓋取夫子與北溪授受之語也其後邦人復以勉齊黃直卿侑食於堂蓋勉齊亦閩人且嘗講道夫子之門者也逮宋社既屋書院燬於兵遺址歸浮屠氏惟堂巋然故處歷歲既久屢圯屢葺然規制隘陋杗棟欹摧有識者憫焉成化四年春正月福建按察司僉事臨江周君守謨行部至漳祇謁遺像周覽慨然顧謂知府英山王文同知舒城胡珉推官南城江白曰昔之思召伯者不忍拔其所茇之棠思萊公者不忍傷其所植之柏兹堂實朱子之明靈攸棲非植物比也傾圮若是是固為政者之過豫司憲諸君守臣也弗亟圖之安所諉其責皆應曰諾相與捐俸以圖新之於是僦良匠斬美材礲堅礎卜日而興役焉君又為度其面勢之宜且節縮廪餐以助其費為堂五間其崇三尋有奇旁為兩齊以處游學者前為三門以謹啓閉肇役於是月丙戌至三月朔乃訖功焉像設有嚴繪飾惟煥郡之長二率諸生暨鄉之薦紳用少牢於堂以告成事焉君屬豫書其事於石豫惟道之大原出於天神聖繼之至孔子而後集羣聖之大成孟軻氏沒斯道之傳殆絶周子倡之程子和之至吾朱夫子而後紹孔氏之世嫡若黃若陳實羽翼夫子以共振斯道於衰絶之中者也夫功被一時惠洽一邑且尸而祝之夫子與二子有功斯道甚大而漳又夫子過化之地兹堂之建禮實宜之繼自今以往凡登兹堂者瞻梁山之崇秀俯清潭之泓渟而致髙山仰止之思興逝者如斯之歎蓋將有默契神㑹於千載之下者乎君由進士歷刑部副郎遂擢今職所至有冰蘖聲其在漳首新兹堂蓋欲風厲漳人向道也繫之以詩以告志於道者詩曰大哉斯道實原於天敦克任之惟聖若賢孟氏既殂吾道日斁紫陽崛興式纘厥緒乃攬其粹乃㑹其全若黃若陳與有聞焉道學載明於今為烈質諸洙泗若合符節清漳之濵梁山之下揭䖍妥靈有堂有廡邦人具瞻胡兹摧圮顯允周君載振而起惟堂翼翼惟門將將時時薦祼牲腯醴芳嗟嗟斯道靡古靡今有志於斯盍明厥心咨爾多士來游來歌匪察匪由爾心式訛福寧節孝祠碑古之忠臣孝子烈婦遭時不幸死於所天者代有其人而出於一家者蓋鮮父子同死者古有之矣晉卞壼是也夫婦同死者古有之矣宋趙昴發是也至若忠孝貞節萃於一門若元福寧州尹王公者曠百世不數人焉公諱巴延字伯敬濵之霑化人也起家宣使為祁陽令調烏程以循良稱遷信州推官數辨寃獄所全活者甚衆至正九年以大臣論薦擢朝列大夫福寧州尹至之日黜奸吏誅元豪核賦籍均徭役修學宫以教諸生建禮殿以祀先聖福寧翕然稱治尋升福建轉運副使㑹盜起徐蔡蔓延及閩羣凶相煽為變漸逼州境民留公不得行公乃築壘門募民兵守之嚴候望謹熢燧賊不敢犯十二年秋賊陷寧德掠羅源勢益張冬十一月賊與建寇合兵來寇公遣巡檢諤勒哲率兵出禦之而命千户嚴巴延布哈主簿陳文積守西門諤勒哲遇賊於古縣戰敗死之嚴陳懼不敵開門先遁賊突入公聞之亟帥親兵迎戰連鬬數合不利遂被執賊帥坐州治召公詰之公掀髯歷階而升賊叱曰强盜猶作態耶公罵曰汝本販鹽盜縣官何負於汝而反顧謂我為盜耶賊怒叱之跪公兩手據地不為動賊益怒令撻之公詬曰吾為天子吏頭可斷身不可撻遂死於東門之外立而受刃血出白如乳民哀之哭聲連巷明日賊執公仲子相及其婦潘至相罵曰吾父已死吾豈茍生者何不速殺我當為鬼以滅賊耳賊忿其言引出斬之潘有殊色賊欲汚之時潘産未彌月不可近乃閉之空室不食數日而死寇退民斂公權厝於郭東之佛宇明年公長子楨負公遺骸歸葬行臺御史余公闕以其事聞命立祠學宫之右而以相與潘侑食焉元末祠燬於火成化壬辰秋八月豫行部至福寧耆民林慈等相率請復公祠豫因出西門觀公與賊戰處古木櫹槮寒烟蒼然溪流㶁㶁有悲咽聲慨然太息想見公之為人乃以廢佛宇曰般若菴者為公祠命縣丞劉福介葺其弊陋加之圬塓前為三門旁為兩廡繞以髙墉塑公之像於中以相配之而置潘之像於東廡懼瀆也經始於是月甲戌落成於是歲冬十月辛未扁其祠曰節孝邦人請豫書其事嗚呼公死於忠而使子死於孝婦死於貞視卞壼趙昴發蓋似過之是宜祠也乃作歌以遺邦人使歲時歌以祀焉其祠曰靈宇沕穆兮烟冥𡨕簫鼓奏兮華鐙明神馭招搖兮何許慘將降兮風泠泠公之來兮駕蒼螭佩吳鉤兮曵絳旗俯故宫兮太息城郭是兮人民非松醪清兮海錯香巫屢舞兮升公堂子來歆兮婦亦嘗公雖死兮嗟何傷一世之短兮萬世之長龍山之顛兮長溪之湄倐而去兮忽而來眷我民兮降繁釐民之承祀兮終古無隳新城縣重修廟學碑新城為縣肇自宋紹興八年割南城之東境置縣治於黎川鎮後四年乃置學於縣之巽隅由宋歷元以及皇朝學宫敝而載新者屢矣𢎞治壬子冬十月金壇段侯敏以進士出宰兹邑祇謁先聖周覽廟堂兩廡齊舍暨門棟宇欹傾粉繪摧剝慨然欲新之顧歲方艱民方病未暇有作越二年歲豐民樂政舉化流乃謀與縣丞黎君某主簿祝君某及里居之賢者曰縣令民之師帥兼治教之責焉今學宫頽圮若是殆無以養士而淑民盍思所以新之乎丞簿皆曰是誠不可後也方圖興事邑之富而好禮者胥告語曰吾侯此舉將以納吾民於禮義之域吾曹衣食幸有餘盍助侯成之乎於是義民凃汝謙建櫺星門砌泮池耆民朱時寧甃學前通衢俾行者無泄汚之患里民楊嵩塑先聖像改造龕座鄧廷璋陶甓甃戟門暨兩廡前陰陽訓術凃汝校建鄉賢祠他若講堂露臺從祀羣賢之像庖廪之房藏書之庫師儒之廨諸生肄業之齊則侯與丞簿二君節縮冗費規畫羡財以成之工善材良並手偕作始事於某年某月某日迄工於某年某月某日既成像設孔嚴規制宏麗他邑學宫未能或之先也侯卜日用少牢於文廟告成事焉教諭葉君鳳靈訓導陳君某范君某相謂曰昔魯侯作泮宫詩人頌焉文翁興學於蜀漢史美之今段侯修理學宫而寮佐協贊邑之耆彥亦丕應以相其成是不可無紀也乃具其事屬蒙陰丞凃達請豫書之豫素知段侯康惠明果凡有興作民不勞而事集而達又豫族甥也乃詳書其事而系以詩曰黎川之隩學宫渠渠孰作新之惟邑大夫於惟大夫涖兹百里永惟治本斆學惟始乃咨乃詢乃計徒庸爰新學宫以牖民衷自堂徂門自殿徂廡修廣質文罔浮于度長衢如砥髙門有伉泮水汪汪蘋藻其芳侯曰髦士其聽豫言修學匪艱懋學為艱士曰朂哉是訓是履敢有怠荒貽侯之恥日峯蒼山黎水湯湯侯之德音百世有光贈太子少保彭惠安公祠堂碑𢎞治八年正月十有三日刑部尚書彭公以疾卒於家訃聞天子嗟悼特贈太子少保諡惠安命官諭祭者再有司治墳塋以葬郡學舊有鄉賢祠大夫君子既為公作主祀之其中而國子監丞林君大猷太僕寺丞吳君世騰暨莆人之在朝者相謂曰惠安公一代之偉人宜有專祠俾後學有所矜式乃與其里居之賢作祠堂若干楹於所居之里中奉公像左右廂藏祭器遺書而以書屬豫紀其事豫與公嘗同官且同志者也不敢辭公諱韶字鳳儀世家莆田之涵口自少莊重好學稍長學問該洽議論醇正一時學者皆推重之登天順丁丑進士除刑部山西司主事丁內艱服闋改廣東司遷員外郎大臣有自他途進者公上書言之坐是下制獄朝臣多救之者得釋久之遷郎中成化庚寅升四川按察司副使尋升按察使又升廣東布政使中官有家在廣東者公言其恣橫坐是調貴州甲辰擢右副都御史巡撫南畿召為大理寺卿未至坐論鎮守內外官貢獻非宜道改右副都御史巡撫畿內兼理邊務今天子嗣位召為刑部右侍郎屬浙西不靖奉敕往平之尋以本官兼僉都御史整飭鹽法既還㑹朝廷以水灾求言公請厚根本減役錢正近侍慎官爵上皆嘉納改吏部左侍郎壬子夏升刑部尚書明年以疾連章乞罷遂得命致仕初公為郎官論囚嘗求生之然元奸宿豪雖權貴交囑不少貸及居外臺凡大吏貪縱者治之甚嚴而小官誤犯者多所開釋巡撫南畿議者謂周文襄公後惟公可繼之而律己之嚴出納之慎文襄不及也畿內多皇莊其中官典守者往往怙勢病民聞公至憚其嚴肅皆自戢其臨邊督耕戰嚴守備敵不敢窺塞垣為大司寇有犯罪者參錯訊鞫多所平反嗚呼公以節行文章著聲於時其行已為政務以古人自期待士君子識與不識皆企慕之然亦不勝憸壬之媢嫉也故屢中以奇禍或下獄或改官雅知公者猶以為好名賴列聖仁明卒保全之致位六卿至其殁也贈諡之典祭葬之禮視當時大臣有過無不及焉嗟夫古今忠賢能得此者幾人哉公有二子長濬鄉貢進士次瀚嘉興縣丞皆先公卒一孫曰輔尚幼公之世系履歷之詳具載隧道之碑𤣥堂之銘豫可略也特紀其志節之大者以昭諸君子尊賢尚德之心又系以楚聲俾莆人歲時祭祀歌以招之其詞曰吁嗟夫子兮端潔而好修日孜孜而忘倦兮惟道是求上泝淵源於洙泗兮下潔矩矱於韓歐何厭世之太蚤兮駕𤣥鷖而逺遊層城髙寒兮曷足久留盍歸來兮徜徉故丘壺山之巔兮有蘭有芷涵江之涯兮有魴有鯉丹荔黃蕉兮甘且美素馨黃菊兮香旖旎夫子歸來兮其樂無已撫汝孫曽兮慰我朋友騎箕尾而上下兮稅駕於此采溪毛以薦芳兮酌甘露以當醴夫子不我顧兮我淚如洗歸來歸來兮毋逺桑梓范氏先塋碑洛陽之萬安山下宋資政殿學士贈太師魏國范文正公之墳在焉其子將作監簿純佑丞相忠宣公純仁右丞恭獻公純禮龍圖閣學士純粹皆祔葬其間公葬距今三百餘䙫塋域榛蕪樵牧不禁石麟僵卧宿草中而氓𨽻或墾其隧户過者傷之成化乙未夏四月公之十二世孫家吳中者曰從規詣巡撫南圻都憲洛陽畢公陳其狀畢公移書巡撫河南都憲江浦張公屬修之公曰噫文正公一代偉人也凡所憩之樹尚當愛護而封植之况體魄所藏乎亟下令正其塋域禁其樵牧且命參政孫君伯大參議蔡君克存副使王君廷秀僉事馮君景陽督守令治其墳因其幽竁甃以堅甓刜其奧草樹以嘉木繚以峻垣表以綽楔又為祠三間以為公子孫歲時拜掃之所於是公之體魄永有攸寧矣從規偕其族兄希紳自吳走洛展省先塋用少牢於祠下以告成事周覽壤樹愴然興感因相語曰先塋榛蕪殆百年圮而復完繄二都憲暨藩臬諸君子是賴不可無識也乃琢石置祠下請豫書其事夫公之盛德駿烈史有傳隧有碑名儒畯賢有論述奚取豫不腆之辭哉然嘗論之宋有天下三百年賢相視漢唐為多而紫陽朱夫子獨稱公為第一流人物何耶蓋昔之賢相或功業焯焯而學術無聞焉或文章名世而相業不滿人意若公者可謂兼之矣自漢以來諸儒未有知中庸之義者公當洛學未興首勸橫渠張子讀中庸是蓋灼然知其為傳道之書所學固已絶出千古矣至其推之於用也居諌垣以謇諤著為郡守以惠政稱臨邊圉而威震於戎狄晚登政府又欲堯舜其君民以成其先憂後樂之志彼蕭曹房杜以及王寇諸公所建立有是哉宜朱夫子以人物第一流許公也瀧岡之阡以其子之賢至於今毋敢壞况公之塋耶豫既書其事并作迎享送神之歌以遺范氏子孫俾拜掃者歌之以侑牲醪焉其辭曰樊之里兮洛之滸松楸櫹槮兮有封若斧靈之來兮駐雲軿鼓坎坎兮巫屢舞靈宇沕穆兮風泠泠蕙肴香兮松醪清覽故邱兮增欷菉葹多兮蘭杜零左忠宣兮右恭獻父子一堂兮飫以宴願遲迡兮毋遽旋愴豫懷兮淚如霰右迎神靈之旋兮杳何方飈馭翩翩兮雲路長衮衣爛兮赤舄几几陟且降兮帝之傍天下之山兮白雲泉怨夜鶴兮啼春鵑乘蒼虬兮駕𤣥鷖朝出遊兮暮來還靈之在天兮儼若存錫多祉兮啓我後昆曽若𤣥兮永承祐春秋拜掃兮奠蘋蘩右送神椒邱文集卷二十八
