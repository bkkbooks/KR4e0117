body:
  text: 椒邱文集卷二十四明何喬新撰詩七言律詩附集句賔筵留詠謝內翰楊先生鑾坡退直共論文華館從容日又曛碧甕酒分仙掌露紫檀香裊博山雲黃柑錦荔皆珍味玉麈緗編總異聞鄙劣每慚知遇厚但歌既醉頌夫君送徐夏官省親畢姻珊珊清珮出彤墀共羡仙郎荷寵私鶴髮想應占逺信雀屏更喜協佳期綵衣絢日春光好繡幕凝香曉漏遲莫向枌榆久留滯趨朝須及鴈來時迂齋次夏提學韻長佩髙冠氣浩然從教人笑腹便便欲持鑿枘同先哲肯競周容逐少年每歎終南多捷徑豈知涑水有名賢庭前磊磈長松老恥共羣葩較醜妍無題和李商隱韻宫怨五首仙興五首唐李商隱賦無題五首蓋託宫怨之情以寓思君之意其引物託興有國風楚騷之旨焉自元以來和者甚衆而憲副郁君又託之以寫其憂深思逺繾綣之情豫讀而愛之每韻和二首前五首宫怨子建洛神之意也後五首仙興屈子逺逰之意也第恨詞氣萎弱不足追步昔人耳風軟耶溪蕩綵舟蘭橈桂楫漫夷猶鵲橋露冷來何暮鳳吹雲深逝莫留瓊島碧桃偏向暖瑶臺琪樹不禁秋相如莫奏長門賦且聽閨人詠白頭户外羊車久絶蹤繡衾輾轉聽晨鐘心知栁絮飛無定愁似香雲淡後濃春水洲邉吟杜若秋風江上采芙蓉夢魂不怕湘江逺飛繞巫山紫翠重綺忩香透桂花風夢繞披香别殿東仙島不容嬴使到天河寧許漢槎通長蛾鎖恨微顰翠嬌靨傷春淺暈紅怊悵别來憔悴甚鏡中己見鬢如蓬緩步西廂待月來笑聲何處殷春雷樓中盼盼啼偏苦畫裏真真唤不回鼓罷氷絃添别恨織成錦字惜多才妾身渾似庭前草幾度東風幾度灰薄命情知終愛難更堪弱質易摧殘雲凝楚岫魂應斷雨灑湘筠淚未乾午睡最憐鴛被暖夜吟漏覺魫忩寒新愁舊恨憑誰訴自展回文擁髻看右宫怨碧海浟浟樣桂舟瀛洲咫尺且夷猶龍膏每共方平宴鶴駕曾為子晉留若木雲消蓬闕曉榆花露冷蕊宫秋醯雞起滅氛埃裏惆悵浮生浪白頭弭節方壺訪舊蹤雲璈迭奏和華鐘赤城春曉霞光薄玄圃秋陰露氣濃剪剪緑衣紉薜荔翛翛清珮製芙蓉滄波不阻三山路浪説三山隔萬重獨跨雲鵬遡曉風扶搖直渡弱流東采鸞去後音容杳青鳥來時信息通瑶草蔥茸春雨緑丹光隱映曉霞紅浮沉欲海知多少俯視真如一斷蓬絳莭蓉旌縹眇來靈鼗靈鼓響如雷飈輪低拂扶桑度羽駕髙凌桂樹回肉食未傳餐玉訣蓬心豈是馭風才誰能久視層霄上還向昆明認劫灰蓬嶠迢迢去路難東風又見碧桃殘雲生瑶圃春常潤露墮金莖晝未乾瓊宇凝神香霧暖石壇禮斗玉聲寒殷勤寄語求仙侣河上靈筌仔細看右仙興挽徐編修父玄洲别却向壺洲祗住人間六十秋塵滿小忩飛脈望雲深舊隱噭鉤輈墨花零落來禽帖煙樹凄迷放鶴樓餘慶綿綿知不已鳳毛今在鳳池頭元日早朝作前一日聞兩廣捷音乳鴉啼散夜將闌庭燎煌煌啓九關劍戟霜明環虎旅衣冠雲擁簉鴛班彤闈風定聞天樂黼座香消識聖顔更喜捷書來粵徼大廷行見格羣蠻和髙居正秋臺齋宿韻親承聖語下瑶臺齋閣同携襆被來茶瀹龍團間嘯詠香凝燕寢喜追陪起看紫極璿杓轉坐待彤庭玉鑰開欲寫蕪詞賡絶唱愧非汝士軼羣才陸君孟昭以元宵會客同寅髙君居正即席賦詩和者相屬豫適以事不及往乃用居正韻以謝玄露香浮白玉巵共拚一醉對芳時銀河夜轉斗橫柄火樹春回花滿枝繡户月明歌韻杳麗譙風細漏聲遲慚豫未得陪清賞吟對寒忩緑幕垂送憲副王公赴山西花驄躞蹀出神京追飢都門酒謾傾蘭省當年同戰藝柏臺此日獨蜚英霜飛絶塞秋橫鶚花滿新田曉弄鶯明日相思限南北暮雲春樹總關情挽盧都御史睿玉帳牙旗鎮北陲功成歸老榖川湄崇勛曾沐當朝眷清節還令後世思緑野堂空雲黯黯青門瓜老草離離墳前石馬嘶風雨猶似榆關破敵時紫薇精舍為陸孟昭賦其父别號怡晚四首丹霞塢裏草堂開移得薇花繞舍栽紫艷半含春露濕清芬輕逐午風來百年相業知重振二妙文風喜載回怪底虹光射牛斗五花鸞誥閟泉臺行春橋畔石湖邊精舍陰陰近墓田花發紫薇思往事氣騰白虎卧新阡青楓月冷歸遼鶴緑樹煙深怨蜀鵑怡晚仙人飛珮逺倚闌無語淚澘然文穆遺墟草樹荒仙郎重此卜玄堂一盂麥飯澆寒食幾勺椒漿酹夕陽山勢猶存前古勝薇花還發舊時香檀弓讀罷憑軒望宿草芊芊思感傷吳山深處是先塋更傍先塋構草亭啼月慈烏晨繞樹銜花白鹿晝依屏石湖水碧涵忩潤文筆峰髙入座青相國勛名今不泯薇垣遺種振芳馨挽太保金公淮陽人二首台星夜隕哲人萎哀動朝紳淚暗垂補衮每聞禆聖治安邉頻見董王師堂堂遺像歸圖畫赫赫元勛照鼎彛千載芳名知不朽何須更索説之碑憶昔先公秉國鈞與公情誼最相親子明舉相惟平仲君實論交重景仁遼鶴不歸淮浦月蜀鵑又怨楚山春不才為勒碑陰記哀些歌殘淚滿巾金山曉鐘送陳巨源父南歸浮玉山前曉駐舟鯨音隱隱吼林丘驚回幽壑潛蛟夢喚醒孤舟倦客愁逺逐角聲聞鐵甕清兼漁唱落滄洲分明夜半楓橋泊月色江聲滿目秋虎丘夜泊千里歸帆下玉京夕陽暫艤闔閭城沉沉梵宇疏鐘吼渺渺漁村逺火眀芳草空餘藏劍處折楊猶聽踏歌聲明朝又鼓吳江棹遙想家山只數程浙冦敗走詩以識喜幽壑鼪鼯晝嘯號騑騑駟牡敢辭勞霜凝玉斧妖氛豁雲擁牙旗殺氣髙荒壘羈魂飛夜磷長溪戰血漲春濤歸來不用歌鐃曲皎月當臺詠載櫜廷珍憲副以詩賀豫平冦次韻答之緑林妖祲喜初收畫轂歸來得自由野戍花深無戰戟平田草緑有耕牛成功自愧非彬甫憂國誰憐似子牟多謝故人傳秀句瓊瑶乏報祗增羞將之福清過南臺偶成宿雨初收絶點埃煌煌鳳節出南臺長林怪鳥啼猶急孤嶼妖氛鬱未開減竈謾懷虞詡策運籌誰是子房才薇垣諸老方盤樂肯念嗷嗷鴻雁來擬唐人送宫人入道詩三首金屋蹉跎雪滿顛官家有詔許求仙夜眠不作湘雲夢曉諷應忘璧月篇好共采鸞遊漭沆休教飛燕妬嬋姢碧桃花底吹笙處猶似承恩侍御筵仙袂飄飄出漢宫從今罷聽景陽鐘肯題紅葉傳幽怨祗煉黃芽駐舊容上苑昔年春鬬草空壇此際夜依松白頭阿監遙相憶知在蓬山第幾重霞裾草載侍昭陽喜逐飛瓊事紫皇塵夢已知殊鶴夢道粧應覺勝宫粧朝真曉步瑶池月搗藥宵分玉杵霜料得未忘恩顧厚丹成還擬獻君王擬送狀元歸畢姻恩榮醉罷曲江春又詠桃夭出紫宸奠鴈正當鳴雁候乘龍元是化龍人金蓮影晃銀屏曉御酒香浮翠杓新莫戀洞房鴛夢好早歸鳳閣掌絲綸元日藩省祝壽謾成口號銀河星淡漏聲遲畫省宵陳祝壽儀庭燎春回紅霧合爐香風細翠煙垂輿圖萬里歸堯統厯數千年紀夏時最喜太平今有象新年民物共熙熙送韓行人使琉球星槎五月泛滄溟路指扶桑霽景清諭粵才華推陸賈乘風氣概羡宗生彭湖浪靜牙檣穩髙嶼煙消畫鷁明遙想畨王承寵命幾回膜拜望神京小軒夕坐歸思浩然閲盡人間是與非鄉心戀戀北山薇坐憐黃菊霜前老笑指間雲雨後歸已學莊生齊得喪懶從詹尹卜從違歸歟袖却屠龍手重向江頭訪釣磯題黃君愈宣江山一覽亭危亭翼翼倚晴空百里江山入望中俯檻銀溪紆素練開軒金嶂聳屏風波光㵿㵿搖文几嵐靄霏霏撲綺櫳我欲携琴亭上醉夕陽影裏數歸鴻酬羅內翰贈别用原韻滿篷煙月發盱源又共先生醉别樽百嵗可憐猶旦暮一腔元自有乾坤文如班馬身何益學到關閩道乃尊此夜且論千古事不須切切問寒溫分題得玄鶴壽程郎中父母緱嶺歸來骨已仙雪衣蛻盡漸成玄舞隨蒼鹿應難辨色比青烏似更妍髙頂蒙茸含墨暈踈翎黯黮帶茶煙華堂此日稱觴處好奏南飛薦壽筵挽李諫議奈詞以冢宰王公薦入官其致仕也貧無以歸秦府特賜歸􅏻贊政薇垣際盛時蕭蕭短髮欲成絲歸􅋔偏沐賢藩寵薦剡曾蒙太宰知夜月槐柯俄入夢秋風薤露忽興悲翠珉誰與銘遺德千古無慚有道碑壽楊內翰母作以初度之日受封華屋笙歌曉漏遲露香庭戺爛金芝正當北闕推恩日又是南山祝壽時慈竹影涵瑶席潤靈萱花映翠冠垂陽岡采鳳方髙翥分得黃封薦玉巵送余僉憲致仕歸南城桂嶺驅馳雪滿顛乞身深荷聖情憐晚香采采籬邉菊歸思飄飄江上船醉裏呼童歌白紵間來振策濯紅泉不須更覔瀛洲路老得間居即是仙送羅應奎左遷提舉三首內翰羅先生以進士大魁擢居侍從抗疏陳國家大計坐是出提舉福建市舶先生起自疏逺立朝未百日乃能言人所不敢言吾曹終嵗默默不能有所建白聞先生之風愧死矣故於先生之行也賦詩三章以贈之龍飛二載狀元郎三策才陳又抗章忠孝不孤明主望迂疏任笑老生狂同遊愧我非田晝當道知誰惜子方千古髙名何所擬七閩山色鬱蒼蒼曉捧函書叩帝廷宸旒垂聽具臣驚丹心耿耿明秋日徑氣稜稜薄太清鄒浩犯顔非賣直陽城伏閣豈要名此行不比湘潭謫莫賦騷辭弔屈平閩山迢遞是天涯去路荒涼倍可嗟林晚飢烏啼刷羽潭春妖鱷怒磨牙氷銜敢愛當時寵鐵漢從交後世誇畢竟皇恩深似海肯令賈傅老長沙張先生升謫後復職垂老窮邊衆所悲賜環何幸沐恩私受㕓已脫新編籍振鐸還為後學師座隱青氊朝結課香凝絳帳晝哦詩不須更續投湘賦好詠菁莪樂盛時挽鮑黃門輝詞二首萬里從龍狩北荒塵沙獵獵塞雲黃自揮寶劍長驅虎忍向穹廬學射麞清血凄凄成碧草精忠耿耿凛秋霜九原若遇馮長樂應愧當年拜德光落日風吹戰血腥黑雲慘淡壓邉城祗知大義千鈞重直視微軀一羽輕死去無慚周富子生還不似漢蘇卿英魂不共陰飈散願化欃槍墮敵營送任丘胡教諭寒雲釀雪正沉沉尊酒離亭思不禁西蜀久鳴芹泮鐸北河又鼓杏壇琴家聲好闡蘇湖教道學須探濓洛心去去莫嗟官况冷三鱣會見集堂陰謁嶽武穆王廟用趙子昻韻兩都兵後黍離離誰念天潢國勢危鐵騎正謀探虎穴金牌連召仆牙旗黃龍痛飲空遺恨赤縣分崩竟莫支欲弔忠魂何處是淡煙衰草總含悲秋日行臺書懷涼透疏櫺暑氣微倚闌無語對斜暉嵗華冉冉嗟將老心事悠悠悵屢違自道退之偏致謗誰憐伯玉漸知非行臺袖却屠龍手坐看羣鳶競鼠飛紀夢成化十二年冬十月朔豫奉臺檄招撫流民於汝川是夜夢遊一洞洞左右石壁黝然榜曰紫雲洞府中有殿宇如道家所謂三清殿者侍衛頗嚴中左設虛座其右有一塑像幞頭白衣金帶白衣之下有一人紗帽青衣金帶端坐若假寐者諦視之則豫亡友福建憲副遊公大升也豫歷階而上徑至後殿見其蕪穢不治遽出至前殿連呼曰大升在此乎大升在此乎大升趨而就豫豫憶其已死勞其良苦大升無言微笑拱手而已豫詢以前程事大升答云云豫又問此是何處子今為何職大升欲言傍有一老翁目之而止豫遂出大升送至洞門而别俄而覺則麗譙已三鼓矣念大升儀容宛然在目揮淚久之大升清慎有學其官於閩十餘年閩之士子愛之如父母其殁也諸生肖其像以配常衮今豫所夢若此豈其死而為仙耶賦一律以紀之云故人化去幾經年宵寐相逢倍愴然翠柏臺中曾作使紫雲洞裏又為仙生前每感交情厚身後還將吉語傳惆悵冥交那再得澘澘清淚滴重泉淮瀆祠詩祠有漢碑及御香亭二首桐柏靈源何處尋涓涓一脈發胎簮東歸大海奔流壯南匯山陽借潤深金薤晶熒遺刻在寶沉馥郁御香臨年年禳禬陳牲璧願祝繁釐答聖心碧殿玲瓏切絳霄飛甍時見瑞煙飄疏封舊沐長源寵濟旱今看霈澤饒奠璧靈官宵秉簡函香天使曉乘軺時豐民樂邉無警好展神功翊聖朝憲副郁公回速追飢不及詩以寄之故人應怕醉離亭五鼓驅車出鄧城茅店雞聲霜氣重荒途馬色月華明開尊寂寞孤吟倦隱几蕭條百感生遙想行臺宵弭節嶺雲江樹不勝情襄陽懷古旬宣南駐楚江湄登眺悽然淚欲垂秋雨蒹葭文煥壘春風蘋藻壽亭祠峴山不改當年色漢水應無舊勒碑日暮平原春燒起恍疑吳晉合兵時謁李潭州祠作二首玄雲慘淡壓孤城城外蕭蕭鐵馬鳴一室甘心俱就死三軍效節忍偷生英魂不共寒蕪沒精爽猶隨夜磷明采采溪毛酌清泚臨風三酹不勝情賈相當年秉國鈞賢臣逺斥任諛臣豈知末路攄忠士不是平原獻諂人吕氏諸郎甘納士李公一族競捐身新祠翼翼湘江上一讀穹碑一愴神登嶽陽樓作四首城上翬飛百尺樓憑髙一眺散離憂九江渺渺天邉逝萬象森森鏡裏浮晴靄曉迷蛟女室涼飈晝送估人舟文章誰似髙平老燁燁虹光映斗牛闌干十二碧玲瓏千里湖山入望中雲影凄迷涵逺岫波光滉漾浴晴空登臨誰識希文意俯仰深懷大禹功江草江花紛在目憑軒脈脈看冥鴻雲忩月牖俯清流滿目山川快壯遊誰在江湖懷北闕謾誇樓閣冠南州朱絃夜鼓湘靈瑟錦纜春回楚客舟欲起靈均歌九辨澧蘭阮芷正颼颼危樓髙與白雲連吟倚朱闌思浩然七澤搖光浮几上三山飛翠墮樽前老龍應識懷襄日遺刻猶題慶厯年欲駕蒼虬朝帝闕長安祗在夕陽邉沅州潭陽逺在夜郎西石徑縈紆路轉迷俗獷猶存盤瓠舊樹深惟聽鷓鴣啼茅簷雕弊哀三户嵐靄氤氲接五溪欲弔靈均何處是江頭蘭芷正凄凄過劉大有先生故居大有諱有年其先本廬陵人元季徙家沅州洪武中以明經起家擢監察御史學行焯焯有稱尋以辭官養母忤旨謫通州擺站間於州故家得儀禮逸經十八篇上之詔藏祕閣復起太平知府文廟入正大統以不肯迎駕謫雲南黔寧昭靖王知其賢遣諸子從學且薦於朝及交址平起為交址按察司僉事其卒也黃忠宣公誄之曰江湖胸次洙泗規模文宗韓栁學本程朱其為名流所推如此豫過沅州訪其後有二孫一為别駕一為縣尹皆致仕家居而二曾孫為州庠生庶幾不墜其家聲問其儀禮逸經已亡矣出其遺像遺稿并學士解公所作環璧軒銘覽之益興髙山景行之歎因賦詩以致豫意焉五畝荒涼古道邊追思風範重凄然雄詞直躡元和後妙道還探太極先環璧遺堂猶有託曲臺逸禮已無傳諸孫濟濟承家學却喜名家不乏賢題徐氏貞節卷次羅應魁韻梧桐秋老負心期况復霜摧碧玊枝弱草棲塵空自悼狂瀾倒海詎能移髙風不愧曹家婦浮藻堪羞蔡氏兒繐帳凄凄寒漏永挑燈朗詠柏舟詩過嘉禾懷南豐先生嘉禾驛下暫維舟追感先賢淚欲流學術自應超董賈文章元不讓韓歐讀書岩圯蒼苔滿洗硯池荒暮雨愁故里只今多俊彥不知誰解繼前修發建昌别會同智同二猶子汝輩應憐濟叔癡相携追送楚江湄離歌莫慰離愁惡别酒那禁别淚垂疲馬欲歸還戀戀孤舟將發更遲遲臨岐不盡丁寧囑好讀斯干棣萼詩病中述懷兩鬢飄蕭覺始衰疏狂猶似壯年時氷山不願依楊相鐵漢從來慕器之肯棄膏粱羞堇喙忍携琬琰易羊皮試看衛霍燕然勒得似當年有道碑過鴈門關作二首征騎蕭蕭度鴈關危巒絶巘力躋攀東瞻帝闕祥雲裏北望戎庭落照間李牧壘荒煙樹老晉王碑在雨苔斑臨風慷慨懷前烈撫劍長歌一愴顔雄關樓閣勢翬飛獨倚危闌送夕暉萬里山河歸管鑰三邉將校屬旌麾鸊鵜泉竭邊兵困苜蓿煙消塞馬肥薄暮轅門笳鼓競前驅擒得薁鞬歸甘肅元旦次朱都憲韻玉關雪霽絶狼煙殊勝呼韓欵塞年萬竈貔貅森列衛兩班冠劒儼羣仙明珠翡翠來重譯卉服氊裘共一天羽檄不飛刁斗靜蚤看嘉績勒燕然過長城作在武寧關北其東九十里為狼牙村宋楊業戰死處斷垣迤邐亘􅓱坪云是秦人舊築城折戟每因耕後出斜蒿時向雨餘生甕門草滿鼪鼯嘯雉堞雲消鸛鶴鳴東望狼村三舍近凄凄煙樹倍傷情挽王都憲漢口當年醉别巵豈知嘉會更無期玉關已喜生前入汗簡空垂沒後思夜月栁營笳吹斷秋風蒿里鐸聲悲白茅藉飯無由致南望章江淚滿頤送朱都憲巡撫兩廣兼總督軍務紫袍香拂御爐煙出鎮仍兼將相權鐵騎千羣嘶去路繡旗五色照離筵榕城霜重炎氛淨桂嶺雲消黛色鮮文武兼資能有幾蚤看勛業繼名賢挽德安張都憲瓚黃鶴磯頭醉别筵别來雲樹兩茫然才聞奏對趨三殿忽訝音容隔九泉衰草晚煙平冦壘長隄春水餉兵船欲尋斧屋溳川曲鼓子花殘落照邉送李黃門孟暘使占城金函頒詔出彤墀特命儒臣撫島夷龍節逺稽周典禮雞林重覩漢官儀海雲斂色迎丹仗水怪潛形避絳旗路過越裳煩告諭皇家威德邁周時過暢村作在河津縣行行匹馬過孤村土屋荒涼晝掩門豪客用人如楚子羣盜殺人祭旗而食之名家裸葬似王孫巨室厚葬者盜剖棺裸其尸怪梟磔磔煙光暮寃鬼啾啾月色昏太息生靈餘幾許空原一眺黯消魂絳陽道中謾成城郭蕭條村落空澘然清淚墮西風萑蒲有盜如朱粲朱粲好食人肉郡邑何人似鄭公富鄭公知青州活流民五十萬雲暗荒郊啼餒鬼日斜古道泣衰翁獨慚未有匡時策翹首蒼冥祝嵗豐山西大飢人相食哀歎之餘謾成一律春風不入野人家白骨如丘事可嗟小甕滿儲彭越醢輕車穩載德光豝頭顱無復歸黃壤腥腐猶能飽暮鴉立馬郵亭倍惆悵幾行老淚灑煙霞喜雨詩三首翩翩鴻鴈正哀鳴誰把天瓢此夕傾稻畎青回春意足蘋池水長曉波清殘民已有生成望委巷初聞笑語聲愧我西來無寸補載歌周雅頌皇明屏翳驅雲晝不開龍瓢滴滴自天來才看白練垂簷隙忽報銀河落澗隈嫠婦從今收滯穗田家無復嘆汙菜朝來默聽民歌頌盡道皇仁被九垓天心允協帝心仁一雨祁祁慰我民潤洽枯荄含秀色涼生逺樹絶熇塵汙池喜聽蛙聲閙荒圃驚看菜甲新只恐户曹徴稅急遺黎依舊走逡逡和安道憲副潁陽元日述懷是日雨雪二首行臺吏散晝無譁此處停驂即是家古柏每憐含晚翠枯荄漸覺换春華壽觴香泛金莖露瑞雪寒凝玉樹花却笑病軀偏冗迫晨興不待玉衡斜病起那堪燕雀譁式微歌罷苦思家梁公尚不知師德介甫惟聞薦子華世事悠悠蕉下鹿人情淡漠霧中花鄱湖西去先廬在歸夢時穿竹徑斜𢎞治三年春三月望上御奉天殿親策天下貢士命公卿及文學之臣赴東閣讀卷都憲屠公賦詩以紀盛事諸公相屬和之僕忝同事謹步嚴韻不自知狗尾續貂之不可也御栁低垂禁苑春臨軒又覩縟儀新羣英獻策陳王道諸老賡歌頌帝仁待漏金門晨整珮論文玉署晝垂紳連宵襆被容臺宿遙望奎光映紫宸天子龍飛海宇春盛時典禮喜重新文華讀卷瞻天表楮幣頒恩荷聖仁光溢金巵分御醴香浮寶鼎散朝紳得賢深為皇家喜曳履從容出禁宸傳臚之明日賜宴禮部凡供事者皆與焉都憲屠公又賦一律僕再和之恩榮曾醉杏園春垂老重霑寵命新餅剪紅綾思舊製酒分黃縹荷深仁雲隨舞羽來庭戺風送天香到珮紳聖德如天慚未報載歌魚藻拜楓宸文華殿讀卷次司馬馬公韻彤樓日轉漏頻催獻策咸推賈董才吾道喜同文運泰聖顔還為直言開儒臣捧卷來深殿常侍濡毫近上台日晏傳宣催賜宴五雲髙處醉金杯謹身殿開卷出聽傳臚次學士李公韻霽月當空八牖明履聲晨並殿廊行上卿開卷初題榜宣贊當階迭唱名天際慶雲昭瑞應御前大樂奏和聲金明路上人相語天與吾皇産俊英恩榮宴又次學士李公韻籥翟當庭奏樂頻瓊林錫宴際芳辰槐陰緑映伶官服花氣香飄舞佾巾淳酎潤含仙掌露歡聲散作帝臺春英聲感激爭相勉誓秉忠貞敢愛身東閣讀卷次少司空謝公韻金鑾策士詔羣卿禮樂縱橫細與評黼黻舜衣期補衮鹽梅商鼎用和羮喜聞瑞靄空中見肯羡青雲足下生記得蚤年登第日藍袍濟濟看題名談都督祠鐵騎憑陵壓北門將軍擁卒戰平原秋風孤戍邉聲急落日重圍殺氣昏帳下健兒爭效死陳前強敵暗消魂至今溪水含餘怒夜半填然萬鼓喧九日登鷂子崖秋風吹我上層崖周覽茫茫亦快哉對菊始知佳節到看山却喜壯懷開浮雲變態元無定逝水奔流不復回北望帝城才咫尺金觚玉闕是蓬萊送張啓昭勸講文華沐寵優欲將直道贊皇猷金人何用三緘口鐵漢從教一斫頭臺諫交章良可笑儒紳咋舌亦堪羞聖恩眷注元無替肯使南都久滯留鄉邦交誼最相親忍向離筵勸酒頻抗疏但求禆聖治論思端不忝詞臣自憐石介非狂士任詆西山是小人暫别鑾坡非逺謫莫將辭賦弔靈均東河驛寄京師諸友北山歌罷淚浪浪承命西來鳥道長使節晝衝秦嶺雪征驂曉踏渭橋霜愁腸暗逐鵑聲斷歸夢常隨鴈影翔京國同袍應笑我馬蹄連嵗為誰忙白瀑寺用壁間韻書懷宦轍馳驅志已慵無心更覔徹侯封但令氣節垂青簡不羡勛名勒景鐘官况天邉雲淡淡客愁雨後葉重重呼童汲取山頭瀑一洗秋來憔悴容播州行臺偶書萬里馳驅到夜郎親承紫詔諭殊方欲持清白光先訓敢毁亷隅負聖皇琴鶴不教隨使騎金珠况肯入行􅋔賔朋試解慳囊看祗有新詩十數章早朝聽誓戒彤樓鐘動萬鴉飛玉珮珊珊向禁闈銀燭影搖溫室樹寶爐香拂侍臣衣鴻臚傳制依黃道禁旅鳴鞘拱紫微朝罷從容歸陋院喜看旭日散晴輝駕出南郊羽林清蹕出都城聖主南郊展敬誠紫極氛消春日麗黃壇塵靜曉風輕雞翹影逐龍輿動鼉鼓聲隨象輦鳴歡溢臣民咸抃舞此生何幸覩升平齋居賜蜜餌金盤蜜餌出彤庭天語丁寧賜列卿宋室鳳團寧擅美楚宫椒糈浪馳名香甘方士青精飯潤滑仙家紫石英衰朽自慚無補報載歌天保祝皇明南郊陪祭聖朝奠璧禮圜丘萬炬飛光映冕旒齋殿雲深清漏逈燎壇風暖瑞煙浮靈祗分獻多儒碩輦路羣趨盡徹侯湖海愚臣忝陪祀愧無詞賦頌鴻休憲副郁公惠青布及詩酬以白紵並賦詩答之湘川别後幾星霜青布殷勤逺寄將展玩尚涵江氣潤裁成長帶澱花香詩人莫刺蜉蝣羽騷客空誇薜荔裳白紵愧非瓊玖報池亭聊用納新涼秋夜齋宿懷仲深宗伯耿耿星河映户明齋居徙倚不勝情啼蛩石砌秋聲早落葉銀牀夜景清歸計未成心轉急炎威漸退氣初平知公亦有幽栖志何日聯鑣出鳳城出京偶成九重命下許歸休便向江頭買去舟客夢未離金闕樹鄉心已逐楚江鷗身同裴相投間樂事異靈均去郢憂聖德如天慚未報回瞻紫禁思悠悠太宰介庵先生以詩飢别用原韻奉答四首曉拜彤墀出帝城寒江歸去結鷗盟秋蘭蕭艾何香臭蟬翼黃鐘孰重輕滕甫未應為惡黨休文非必是狂生於今誰秉春秋筆忠佞亷貪好細評謝病連年叩紫宸挂冠今喜作間人思蓴正值新秋候種豆還期故里春憂國獨憐君實切論交誰似景仁真炎風朔雪煩調燮珍重當朝社稷臣曉納牙牌别禁城竹梅擬結嵗寒盟君恩何啻萬鈞重行旅從來一葉輕誓保忠貞全晚節肯求溫飽負平生鶴山未必非君子成大如何敢妄評冠蓋追隨出拱宸知幾已後鱠鱸人黃花爛熳東籬晚紫蕨離披别墅春誰識張湯多變詐自憐汲黯任天真歸與且飽魚羹飯休論忠臣與佞臣歸田後連得二子秋官郁君以詩相賀次韻答之垂老煢煢每自憐雙雛初乳却歡然竇家驥鳳雖難比白傅文章幸有傳稍喜階前瑶草秀敢誇掌上寶珠圓山間湯餅無兼味聊和新詩侑慶筵靜倚松忩感物華平生蹤迹半天涯蜀秦鳥道頻馳傳楚粵鯨波幾泛槎有口耻嘗樓護膳無廬肯主瘠環家悠悠往事休重道且向青門學種瓜秋夜不寐卧誦郁秋官詩用韻述懷南北驅馳嘆獨賢歸來林下喜陶然幸多圓史留兒讀詎有勳名與世傳抱甕雖勞甘守拙方知欲鑿耻為圓茆簷飽喫魚羮飯似勝侯家玳瑁筵宦遊幾載厭紛華乞得間身釣水涯騎馬懶從聽禁漏問津直欲泛仙槎雖無食客堪延譽幸有癡兒可保家負郭何須田二頃數畦祗種邵平瓜子弟廷祺園中紫牡丹盛開邀豫賞之醉後賦二律以識其事時𢎞治八年二月草二日也看花幾見洛陽春魏紫嫣然逈絶倫玉板每慚攀逸駕鶴翎無計避芳塵香同荀令擕來好色似韓湘染未勻今日對花須盡醉黃荃畫裏本非真前身應是紫薇郎化作名花擅國香初訝曉煙籠翠幄忽疑甘露沁霞觴靈根淺映蘭芽嫩穠艷微涵歙硯光世代祗今憐間色誰修花譜續歐陽讀康齋集作吳徵士與弼所著濓洛關閩迹久湮斯文何幸得斯人朱絃一曲聲偏淡玄酒千觚味獨醇竹色花香元自樂藝編緗帙不為貧紛紛黃小休輕訕見道誰如此老真間居述懷萬里歸來已白頭溪風山月思悠悠黃河鐵騎成春夢錦水牙檣憶舊逰病後更添元凱癖間中還抱杞人憂桃花流水知何處願與漁郎共放舟都憲韓公貫道惠詩次韻答之二首疏庸久荷聖明知却恨非才貿盛時三晉雲山應識我兩京議論竟歸誰間尋平子歸田賦懶誦靈均問卜辭渭樹江雲嗟契闊何當一醉習家池老得懸車古亦難桔橰春雨靜中看昔年曾叱王尊馭此日休彈貢禹冠春草池塘詩思逸午橋樽爼酒腸寬蕭蕭風雨雞鳴夜菊枕蘆衾睡正安癸已嵗藩省祝夀和自立韻文武班聯玉笋行紫袍赤舄爛成章共推寶厯承三統更喜皇風被八方香影暗隨雲影動恩波元共海波長炎荒未許淹𢎞識佇見鳴璫侍聖王兩階劍珮儼成行縹眇登歌奏大章萬國衣冠環北極九天雨露洽南方香飄仙仗微風度星轉銀河曉漏長最喜三邉氛祲息征西諸將縳戎王宋玊宅即安陸州學舊宅蕭條泮水隅騷人曾此托幽居荒臺日暮無行雨廢圃春深有揭車茂樹櫹槮搖落後姱辭曭朗變風餘巫陽歌罷秋天逈應有遺魂返故墟樊城懷古仲山甫所封之地斷垣衰草古樊城勝國當年此戰爭往事已隨流水逝空山猶倚暮雲平幡􅓚隱隱仁王寺葭菼蕭蕭虜將營登覽悵然懷往哲蒸民歌罷不勝情謁賈太傳祠作二首漢殿從容席屢前得君何事遽南遷孝文猶自疏賢佐絳灌能無妬少年寂寂荒祠啼鵩鳥沉沉遺甃洌寒泉從來材大難為用惜誓歌殘一泫然經國材猷逈絶倫春秋以後見斯人誰知一代興王佐遽作三湘放逐臣斜日坐隅來怪鳥寒煙江上弔靈均須知窮達皆由命何用悲傷自殞身題徐氏貞節卷孤篁徑柏翠交加靜處幽閨閲嵗華誓保貞骸歸北壟忍移芳屣到東家梁間愁見春巢燕庭際羞栽夜合花青簡已書中壘傳昭昭姱節世爭誇舟中感懷集句短棹吳歌花滿川鄧文原客心何事轉悽然髙適平生自笑王夷甫子昻少日真期魯仲連杜本獨對青燈燈思往事張翥忍將離恨托哀絃龍仁夫故園尚有平生約鄧文原落日孤雲望眼穿元好問題桃源小隱集句桃源面面少風塵王維獨構茅堂養道真薛玄義萬葉秋聲孤館夢汪水雲一庭草色自家春復見心祗從暮醉兼朝醉子昻却恐間人是責人李羣玉借問路傍名利客崔皓朱門雖富不如貧陳希夷椒邱文集卷二十四
