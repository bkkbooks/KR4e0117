body:
  text: 椒邱文集卷五明何喬新撰史論宋帝深以澶淵城下之盟為辱王欽若進曰惟封禪泰山可以鎮服四海誇示外國然自古封禪當得天瑞希世絶倫之事然後可爾天瑞安可必得前代蓋有以人力為之者帝曰王旦得無不可乎欽若乘間為旦言旦黽勉從之帝召旦歡飲賜以尊酒曰此酒極佳歸與妻孥共之既歸發封則皆美珠也旦悟帝㫖自是不敢有異議王旦宋之賢相也其居位最久受知最深非冦畢諸將相所及然天書之事既不能諫又從而附㑹之則可謂不忠之甚者也真宗仁厚之君羣臣未聞以諌得罪者而况於旦乎使旦諫而見忤不過以使相均逸外藩爾况未必忤乎觀欽若之進邪說也帝曰王旦得無不可是帝猶有憚於旦也而旦竟無一語沮之顧黽勉從之則是逢君之惡非徒長君之惡而已其罪豈在欽若下哉當欽若乘間有言旦正色語之曰王者德合於天而天瑞應若以人力為之是誣天也四夷可以德化而不可以僞欺若以僞為之瑞誇示之是欺人也誣天欺人匹夫所恥旦不敢聞命如此則欽若必將羞沮而退矣美珠之賜旦當封而上之曰臣昨侍宴荷陛下過寵賜以尊酒命與妻孥共之臣歸而發封則皆美珠蓋帑人之誤也臣不敢貪天之貺謹歸之天府惟陛下裁察如此則真宗知旦不可以利動而事必中止矣今也欽若之請既從之美珠之賜又受之至於封岱祀汾皆兼大禮使乃始愧悔而追思李文靖之先見嗟何及矣論者以旦比馮道豈過貶哉上封事者言兩漢賢良多因災變以詢訪闕政今國家受瑞建封不可復設遂詔罷制舉古之聖王設諌鼓立謗木惟恐一德之未修一政之或闕也帝舜之世以言其治則庶政惟和矣以言其民則四方風動矣以言其瑞應則鳳凰來儀矣然帝之命禹曰豫違汝弼曰汝亦昌言曷嘗以治化已隆而忘求諫之誠哉真宗之世僅可謂小康耳一旦以受瑞建封遽罷直言極諌之科何其不思也且所謂瑞者何瑞乎以聖祖之降為瑞耶則出於黥卒所言以天書之降為瑞耶則出於憸人所造以紫芝白鹿嘉禾瑞木為瑞耶則出於諛臣所上求所謂庶政惟和四方風動鳯凰來儀者無有也當是時蝗飛翳空非災變乎嵗旱民饑非災變乎帝雖詢於芻蕘未足以消沴致和也顧乃罷制舉以自塗其耳目是猶尫瘠之人黜和扁屏藥石而語人曰吾身康强耳嗚呼為此說者何人歟殆孔子所謂一言可以喪邦也歟內侍江守恩有罪伏誅太常博士俞獻卿抗章論救坐貶守恩怙勢作威强取民麥杖殺軍士其罪大矣幸而敗露伏法受誅亦足以昭王法之公獻卿官為太常博士必以文學進身者也其抗章論救豈惜朝廷用刑之頗哉不過逆探君心隂黨閹豎以為己進身之地此正漢法所謂附下罔上者也免於誅戮幸矣自古閹豎竊弄威權非獨人君之過也士大夫之不肖者亦隂為之助焉石顯之擅權則五鹿充宗為之羽翼黃皓之専政則陳祗與之表裏童貫之開邊則蔡京王黼從而附㑹之此皆奸人之尤者也不知其平日讀聖賢書所學何事哉原其所以為此者欲比用以求富貴耳浮雲飛電其久幾何黨附奸閹遺臭千古茍有人心者可以自省矣上聖祖尊號曰聖祖上靈髙道九天司命保生大帝匹夫而為天子必受命于天矣天之命之也或以功或以德夫豈偶然哉受天之命為天之子乘六龍而撫萬邦其尊且貴孰加焉世之崛起者顧恥其先名位不昭牽引附㑹自托於神明之胄加以徽號祀于郊丘以炫耀天下不知適所以欺天而誣祖矣曹氏出於閹豎而曰虞舜之後拓跋氏出於鮮卑而曰黃帝之後有識者固已竊笑唐祖老𣆀故尊𣆀為𤣥元皇帝宋祖趙𤣥朗故尊𤣥朗為上靈髙道九天司命保生大帝又何其誕之甚邪夫老𣆀之書具在毁薄仁義者也𤣥朗之名氏則九經十七史所不載也髙帝舉晉陽之兵芟隋季之亂遂成帝業足以嫓美炎劉矣唐髙祖豈不賢於虛無之𣆀耶太祖東征西伐除五季之亂啓三百年之丕業足以比隆漢唐矣宋祖太祖豈不賢於荒唐之𤣥朗耶奈何近捨昭昭而逺取冥冥也當時忠良之佐博洽之儒迄無一言以陷其君於過舉亦獨何心哉立德妃劉氏為皇后先王之立后非神明之胄則公侯之裔也其幽閒如關雎其躬儉如葛覃其不妬忌如螽斯夫然後可以配至尊而為天下母自秦以降人主漁色而不暇顧其族逞欲而不知求其德所與共承宗廟者或出於亡國之賤俘或出於主家之歌妓或出於奸閹之養女不亦瀆姓矣乎真宗欲建中宫當妙選令族簡求淑德可也顧以鍛家之媵而當軒龍之尊族姓不昭播鼗是業豈足昭壼範于六宫表母儀於天下者當時兩府大臣如王旦冦準者亦寂無一言將焉用彼相矣帝久欲相王欽若王旦曰臣見祖宗朝未嘗有南人當國者雖古稱立賢無方然須賢士乃可王旦碩德雅度宋之賢相也然其論置相謂南人不可當國一何謬哉天之生賢不以南北而有間也金日磾休屠王之子為漢忠臣李光弼契丹王之胄為唐元勛彼生於遐陬之外且然况同出于文明之域者耶前乎旦以南人登相位者有矣謝安張九齡陸贄是也安之德量九齡之忠直贄之嘉猷讜論果何愧於賢相乎後乎旦以南人登相位者有矣杜衍范仲淹文天祥是也衍之清慎仲淹之𢎞毅天祥之秉義挺忠抑何忝於賢相乎雖有奸諂如欽若者出於其間然不可舉一而廢百也彼李義甫之狡險元載之貪黷果産於南耶抑産於北耶自旦之說行世之嫉賢忌才者率以是藉口雖有如謝如張如陸如杜如范如文之儔一切抑而不用是旦之說啓之也推其極言之殆所謂一言而喪邦歟判永興軍冦準得天書于乾佑山大臣欲格君心之非者必先自正其心吾心正矣猶有不能成正君之功者况吾心之不正乎冦準慷慨有大略一代之偉人也惜其溺於功名富貴而不能正其心方其罷政私請王旦求為使相君子已非之矣及在永興欲圖再相遂以天書迎合上意則其心不正甚矣其如正君何夫天書朱能所造中外咸識其詐豈以準之明而不知哉功名之心勝富貴之念深而正議有不暇顧耳再入政府曾幾何時用於讒口逺斥炎烟瘴癘之鄉是豈獨丁謂錢惟演之罪哉準固有以自取之也豫故表而出之以為大臣溺於功名富貴之戒曹利用以從子汭逆謀貶隨州又坐私貸景靈宫公用錢房州安置內臣楊懷敏逼使自縊死曹利用附丁謂而排冦準不得在君子之列然夷考其行有後世所不及者二焉一曰忠藎有守始終不屈二曰裁抑僥幸凡內降恩力持不與是二者凛然有大臣之節非世之具臣所及也夫士君子一善而不克終者多矣始而直終而佞始而亷終而貪利用終始不二其操可不謂賢乎張堯佐宣徽之命文彥博不敢違張說僉樞之命虞允文不敢諫况其下者耶而利用力裁恩幸怨怒不恤是尤難能也靜女之三章取彤管焉如利用者取其一節之善可也夫以丁謂之回遹猶獲老死牖下利用有是二善而死不以罪嗚呼寃哉賜龍虎道士張乾曜號澄素先生天師之號昉于冦謙之晉以前無有也自宋以來龍虎山張氏始専其號若乾曜是已歷元以迄于今國家崇寵俾之世襲或範金為印刻玉為簡以賜之典禮優異視曲阜宣聖之裔有過無不及焉史謂乾曜漢張道陵之後而張氏自云道陵留侯之裔也以豫考之留侯卒于惠帝之世豈真凌虛御氣以從赤松子游耶道陵者魯之祖當漢末以妖術惑衆竊據漢中與黃巾張角等耳豈有道之士哉而歷代崇寵如此其至何歟謂其有長生久世之術耶則所謂天師者皆死且葬未有至今猶存者也謂其建醮祝釐可以消沴致福耶則宋之疆場日蹙元之豪傑並爭天師末如之何也謂其清靜之行有可嘉耶則妾媵姬姜之奉與俗不異也然則何取于斯而崇寵之歟有天下者黜其號散其徒而焚其所謂符籙者亦足以祛千古之惑矣莊獻太后稱制三司使程琳獻武后臨朝圖后擲于地曰吾不作此負祖宗事甚哉程琳之不忠也夫琳以詞學發身豈不知母后當陽非朝廷美事耶抑豈不知武后唐之罪人幾危社稷耶今也莊獻稱制而琳以武后臨朝圖為獻是導之以易姓受命也幸而莊獻材質僝弱非武曌之比其宗族寒微非承嗣三思之儔故擲其圖于地而不納使不幸因琳有獻而萌覬覦之心則置嗣君何地哉若琳者國之賊也其免於誅夷幸矣然琳之獻此規入政府耳抑不知富貴有時而消歇惡名終古而不磨奈何欲得志於一時而遺臭於萬世耶嗟夫三代以下義利不明偭義以干進如琳者多矣讀史至此尚亦掩卷深省哉皇后郭氏誤批上頸上怒謀廢后以告吕夷簡夷簡有憾于后遂主廢黜之議且曰光武漢之明主也郭后以怨懟坐廢况傷陛下頸乎帝意遂决中丞孔道輔諌官范仲淹等伏閣請對夷簡奏言伏閣請對非太平美事詔黜道輔等皆知逺州臣之於帝后猶子之於父母也子雖失愛於母不可以勸父而黜母臣雖有忤於后詎可勸帝而廢后哉夷簡所以憾郭后者因其一語而罷相耳然嘗考之莊獻臨朝外戚干政內豎用事夷簡奉承惟謹非附太后而何及莊獻上賔夷簡乃擠張耆等以自解真所謂多機巧善應變者也后之言豈過歟夷簡以己私憾陷君於惡致后不以考終其不忠之罪大矣且伏閣請對固非太平美事也廢黜嫡后豈太平美事哉夷簡既引故事勸其君以廢天下之母又進邪說激其君以出直諌之臣其大行已虧矣世或謂夷簡為宋之賢相吾不知其何說也廢后郭氏薨竄內侍閻文應於嶺南仁宗宋之賢君也其寬仁恭儉後世無異議焉獨郭后之事何其思之不熟處之不審耶后之廢也文應實主其謀時移事往帝稍悔悟樂府之賜密使之召黠奴瞷之久矣后之存文應安得晏然而已乎其設謀措慮欲除其所忌顧未有間耳一旦后有小疾挾醫診視尚有人也顧以命文應而黠奴得乘間進毒以殞之可哀也已豫嘗見野史云后既崩文應遽殮之而後聞則后以弒殞明矣帝盍思之前日主廢后之謀者誰歟挾醫診視者誰歟后胡為而暴崩文應胡為而遽殮歟考問侍姬啓棺診驗則罪人立得矣而帝念不及此雖深悼之顧亦何益哉夫黠奴弒主母天下之大惡也帝不之察僅以仲淹之奏竄于嶺南而不肆諸市朝豈足以泄神人之憤哉嗟夫匹婦不獲其死古之人猶曰時豫之辜况天下母耶其為帝盛德之纍大矣讀史者安得不掩卷而三嘆詔梁唐晉漢周朝三品以上官子孫依律叙䕃皋陶稱帝舜之德曰賞延于世孟子論文王之政曰仕者世祿蓋追念勛德而報其子孫此聖王之懿典也然舜文之賞與祿亦惟施於當代之臣而已耳仁宗推及於前代則過矣夫前代元勛碩德果如漢之張良鄧禹諸葛亮晉之王導卞壼謝安唐之魏徵宋璟郭子儀李晟裴度諸君子者録其子孫俾享其祿亦豈為過乎五代運祚既促用舍乖宜其隨世以就功名而稍有可稱者惟王彥章王朴李榖數人而已李振敬翔豆盧革盧文紀李嵩王章史𢎞肇之屬則皆庸人而茍富貴也果何功於國何德於民哉今也不論其賢否不考其功業凡官三品以上者一切叙䕃則是庸人而茍富貴者其子孫幸沾恩澤賢俊而淪於下位者其子孫不獲録用豈所以眧勸懲而激臣下乎宋之恩典於是乎濫矣貶權知開封府范仲淹及集賢檢理余靖館閣校勘尹洙歐陽修于外戒羣臣越職言事者古之所謂名相者以其顧公議而有所不為也為國不顧公議是小人而無忌憚者也雖有髙世之智經國之材豈足以為名相哉若吕夷簡是也夫仲淹與修一代之偉人靖洙一時之賢者也仲淹上書譏切時政使其言是固當欣然納之使其言非亦當從容辨其所以然安可以為恨乎今也仲淹以言事貶靖洙以救仲淹貶修又以誚髙若訥不能諫而貶奮然不顧公議而貶四賢以自快其私狠愎而弄權與元載盧杞丁謂之徒奚擇哉昔之奸臣欲壅蔽主聽者必指直言為離間欲誅鋤善類者必斥君子為朋黨夷簡之訴仲淹謂其離間君臣引用朋黨是所謂一言喪邦者也雖有他善又何足取者史稱夷簡為世名相蓋以其子晦叔之相業其孫伯恭學術而寬假之耳豈至當之論耶章得象為翰林學士時莊獻太后臨朝每遣內侍至學士院得象必正色待之㦯不交一言仁宗聞而器之及帝親政以得象平章事孔子曰不知命無以為君子也豫讀秦漢以下史而嘆士鮮全節者正以其不知命耳夫窮通禍福有命存焉避之不可免求之不可得也郭崇韜請立劉后懼讒人也然竟坐之而身死禍豈可避乎趙犨附朱全忠圖富貴者也然竟因之而族滅福豈可求乎君子知其有命而修身以俟之則見義必為見利不惑而窮通禍福不足纍其心矣莊獻臨朝之時羣閹用事勢焰烜赫曹利用以忤內侍貶死襄陽章得象正色以待內侍終位台鼎二人之正直同而其禍福異者是蓋有命焉非內侍之所能為也世之君子畏利用之禍而獻諂以阿之非知命者也覬得象之福而危言以鬬之亦非知命者也惟盡其在我者而順其天則節全而名立斯謂之君子以夏竦為涇原秦鳳路安撫使知永興軍范雍為鄜延環慶路安撫使知延州備趙元昊也兵不可好好兵者士民愁怨有內潰之憂亦不可去去兵者甲兵朽鈍啓外侮之患故司馬法曰國雖大好戰必亡天下雖安忘戰必危誠哉是言也宋有天下文治雖優武事不競至真宗之世契丹講和德明納欵遂置武事而不講為將者皆膏粱之胄為兵者皆惰窳之夫車乘不搜戎器不簡魚麗鵝鸛漫不知為何物一旦元昊竊發西陲攻一寨則一寨破圍一城則一城陷是豈元昊之材且智哉蓋宋去兵忘戰而致然也夫元昊之倔强難制有自來矣狀貌異常曺瑋預䇿其必為邉患嗣位之初避父諱而改明道為顯道其不臣之意已可見矣既而冦環慶侵吐蕃取瓜沙廟堂安然不以為怪及其僣居大號抗表以聞乃以傾險之夏竦畏懦之范雍以禦之是何異於驅鴄雛以當鷙鳥哉古之有國家者講武於四方無虞之日儲將於百蠻咸賔之時其為慮也逺矣契丹遣使來求關南地帝命吕夷簡擇報聘者夷簡素不悅富弼因薦之歐陽修引顔真卿使李希烈事上疏乞留之不報三代而下剛直之士何其厄哉剛者其氣浩然小人患其不可屈直者其色毅然小人惡其不可凌是以譖之毁之排之擠之㦯假手以害之所謂盜憎主人其勢然耳嗚呼厄哉唐之顔真卿宋之富弼皆剛直之士也盧杞惡真卿則遣之使反亂無狀之臣吕夷簡惡富弼則遣之使强悍不測之邊其設心措慮正相類耳真卿不幸而死弼幸而生還是則有命焉非杞與夷簡所能為也今去唐宋數百年矣杞與夷簡死有餘臭聞其名者猶蠅蛆糞穢也真卿與弼歿有餘馨聞其名者猶椒蘭蕙茝也然則小人欲害君子亦何益之有哉以富弼為翰林學士固辭不拜富弼可謂忠矣有難不辭勞亦可謂謙矣有功不言賞當契丹求地人心洶洶弼毅然入對曰主憂臣辱臣不敢愛其死杖節出疆雖女死男生有不暇顧焉及敵再結好疆場無虞以為翰林學士又懇辭曰增嵗幣非臣本意敢受賞乎蓋未嘗自以為功也在易蹇之六二曰王臣謇謇匪躬之故謙之九三曰勞謙君子有終吉若弼者有之矣世之賤丈夫委以艱大則悲哀怊悵有可矜之色稍著微勞則侈然自負雖酬以髙爵厚祿猶有所未厭也彼獨何人哉嗚呼若弼者真萬世人臣之則歟元昊更名曩霄上書講和宋之所以不競者以怯於用兵而急於講和爾澶淵之後僕姑一發達蘭殪焉彼軍奪氣雖不與和彼將自退矣而真宗遽與之和捐金幣三十萬以成契丹之强元昊之叛和市不通國人愁怨有十不如之謡雖不與和彼將自困矣而仁宗遽與之和捐金幣三十五萬以成靈夏之勢蓋宋之諸帝仁厚有餘剛斷不足譬若富室之僝子强梁者侵之健訟者侮之則蒼黃失措惟卑辭厚幣以茍求無事而已遑恤其他哉當是時非無善謀也寇準欲邀契丹稱臣獻地而真宗不從富弼蔡襄言元昊不可許和而仁宗不聽甚者儂智髙移書行營求雍桂節度亦將許之甚哉宋之不競也夫貢賦之入有限溪壑之欲無窮一嵗之中北邊三十萬西邊二十五萬財力惡得而不屈國勢惡得而不削哉范仲淹富弼杜衍韓琦相繼罷歐陽修上疏論之羣邪益忌修傅致其罪左遷知滁洲有國家者得賢非難任賢惟難天下未嘗無賢也伊傅周召雖不世出蕭曹丙魏房杜姚宋之儔世蓋不乏也顧人君任之專與否耳韓琦杜衍范仲淹富弼歐陽修皆間世之英其經濟其德量蕭曺丙魏房杜姚宋豈足多哉仁宗鋭意於治而諸賢並列于朝可謂千載之逢也使仁宗推心而委任之如昭烈之於諸葛亮如苻堅之於王猛如武宗之於李德裕持之以堅期之以久則慶厯之治豈止於慶厯而已哉曾幾何時仲淹與弼以夏竦飛語罷衍以丁度置書罷琦以是尹洙罷而修又以上疏救四賢左遷是猶病者甫得良醫未盡其術遽以庸醫之毁而黜之又何望其療膏盲而起沉疴也哉嗟夫得君如仁宗而諸賢猶不獲盡其用豈天未欲太平耶抑諸賢之命耶有志於濟世者安得不為之深慨王安石自以楚士寡援中朝因結韓吕二族以取重於是韓維吕公著兄弟更稱揚之王安石以學行髙一世不汲汲於富貴不戚戚於貧賤非惟安石以是自信而天下士大夫亦莫不信之惡有結貴族而取重哉自其始仕也命以館職則辭薦為諌官則辭改修起居注又固辭至居相位議稍不合輒稱疾求去曷嘗以富貴纍其心哉史臣顧謂安石自以楚士寡援因結韓吕二族以取重可謂誣矣當是時歐陽修重之文彥博重之天下士大夫恨不識其面其見重於世久矣又奚藉韓吕二族為重哉夫結貴族以養虛名鄉黨自好者不為曾謂安石之賢而為之耶韓維吕公著世之所謂賢者也肯以安石私交而稱揚之耶陋哉史氏之說也种諤襲取夏嵬名山以歸遂城綏州綏州之役論者謂种諤襲取名山為非計愚以為不然夫銀宥綏延中國之故地也其土沃饒其民驍健自拓跋竊據奄逾百年膏腴化為沙漠華族淪于異俗此有識者所宜痛心也又况元昊俶擾鄜延諒祚荐蹂秦渭中國旰食之日久矣茍有可乘之隙豈可安常守固而不為圖之哉夫復我之疆土不可謂之生事報敵之冦暴不可謂之侵小彼陸詵謂諤擅興而啓釁者書生之論耳豈足以語權哉惜夫諤能取之而不善守之故不旋踵而失使諤既城綏州厚集其勢撫納屬羌使自為守以固我之藩籬以斷敵之肘臂則近悅逺懷而河湟之地可復賀蘭之境可入矣帝以災變避殿減膳徹樂王安石言于帝曰災異皆天數非人事得失所致天人相與之際未易言也然洪範著休咎之徵春秋書災異之變蓋欲君天下者覩災而思咎耳古之英君誼辟一祲祥之見輒惕然曰豈吾德之或愆乎一草木之妖輒矍然曰豈吾政之或缺乎曷嘗諉諸天數而不知省哉王安石以通經學古自負其於洪範春秋之㫖考之熟矣災變之來君未知警猶當胥誨胥告使畏天威以保天命可也今也君有警懼之心而安石反進邪諂之說是逢君之惡也是婦寺之忠也豈古之大臣格主正事之道哉嗚呼安石背經叛道如此真聖門之罪人哉以王安石參知政事議行新法王安石之行新法天下後世攻之不少恕至或詆為奸邪豫謂安石徇其學術之偏以成悮國之禍信有罪矣然謂之奸邪則過矣安石之意蓋以欲行王政當先致富强而宋之中葉帑藏耗竭兵衛寡弱不足以有為也於是以其所學於古者而施於政凡可以富國强兵者無不為其青苗法則曰先王𣙜制兼併均濟貧乏之意也其行免役法則曰先王致民財以祿庶人在官者之意也其行保甲法則曰先王寓兵於農之意也不度於時不謀於衆斷斷然自信所學而不疑及羣議譁然堅執不回於是老成者斥巧佞者進卒至羣奸肆毒禍流海內安石之罪其何辭然原其初心則欲致富強以行王政爾非欲殘民生如商鞅桑𢎞羊宇文融之所為也議者比而同之豈萬世之公論哉若曰周禮周公所作也凡安石所建立皆本於周禮而其禍若此然則周禮果不可行乎曰不然周公之法無不善所以因時制宜者存乎人譬之和扁之方無不良所以診脉用藥者存乎醫先王知法之不可獨恃也故敷求哲人以守其法焉庸醫用藥以致殺人不可歸罪於和扁之方庸人用法以亂天下又豈可歸罪於聖人之法乎況青苗之法李參行之陕西而民便王廣廉行之陕西而民亦便使奉法者皆參皆廣亷安知其終不可行哉安石不知求人而徒欲恃法以為治是知良方可以療病而不知非良醫不能用方也監察御史程皓乞罷許之書曰惇德允元而難壬人詩曰謀之其臧則具是違謀之不臧則具是依古之有天下者未有不以任仁德用善謀而興亦未有不以任憸壬違善謀而敗也王安石嘗訓書而釋詩矣然韓琦富弼程皓有德而仁厚者也吕惠卿李定鄧綰包藏凶惡者也琦等論諌謀之臧者也惠卿等所言謀之不臧者也安石用事琦等以忠謀而見斥惠卿等以邪說而獲進口誦詩書之言而身履危亡之迹果何取於學古哉世之論安石者多罪其變法豫謂變法之罪小擯諸賢而任羣奸其罪為大也募民鬻坊場河渡先王之政關市不征澤梁無禁所以與民同利也戰國諸侯始錮山澤之利至漢武帝始有舟車之算及唐德宗又有間架之稅其言利析秋毫矣然鬻坊場河渡則猶未聞也而王安石始為之當是時非有方數千里之旱無以恤之亦非有百萬之師無以餽之也富有四海何求不得何至鬻坊場河渡以收其利哉謀之拙計之謬辱國家而羞後世莫此為甚焉昔裴匪舒請鬻苑中馬糞其事遂止嗚呼安石平居自許欲興堯舜之治而以皋䕫稷契自期待然其言利也戰國漢唐衰季之政所未有顧與匪舒所請等爾不亦可羞哉置京城邏卒察謗時政者古先哲王之有天下設謗木置諌鼓采歌謠以省其愆察怨詈以考其政所以來善言而通下情也昏暴之君惡聞其過於是乎有誹謗之律有腹誹之誅有非所宜言之禁蓋將以掩其惡也而惡亦不可掩人心是非之公豈嚴刑峻罰所能遏哉王安石變舊章立新法士大夫相與謗於朝商賈相與謗於市農工相與謗於野為安石者可以自省矣它山之石可以攻玉聞其謗而改之所得多矣既不能然方且置邏卒以察謗當時又以宦者石得一典之飛書朝上暮入犴獄道路以目殆將十年宜其能弭謗矣然吕誨之彈文范鎮之奏疏唐坰吕惠卿之章具載簡冊至今猶以為謗也安石將如之何哉安石嘗訓釋詩書矣詩不云乎人之多言亦可畏也書不云乎小人怨汝詈汝則皇自敬德厥愆曰朕之愆安石舍聖人之經而襲用秦漢之法欲保令名其可得乎吕嘉問提舉市易恃勢凌三司使薛向出其上曾布代向懷不能平具上嘉問多收息干賞挾官府而為兼併之事吕惠卿執政劾布沮新法出知饒州君子之交以義合小人之交以利合以義合者禍變之際顧義而相恤以利合者禍變之際徇利而相傾此自然之理也王安石之門下羣小雜沓皆以利合者也章惇鄧綰曾布蔡京邢恕林希吕惠卿李清臣張商英吕嘉問左右安石建立新法或贊翊於立法之初或紹述於罷政之後雖謂之王門十哲可也宜其協心并力有膠漆之固矣然轉盼之間互相傾擠不能相容布與嘉問共事者也因恃勢凌使之忿遂劾嘉問綰與惠卿同惡者也欲彌縫阿附之迹遂排惠卿清臣首發紹述之說惇由之以拜相及不得為相乃與立異恕矯誣定䇿之功惇藉之以報復及不得大用乃白其短布草惇制極其稱美矣處于樞府則與之乖異商英草京制極其褒美矣議政不合則斥其逢君至於布始則阿惇醜詆羣賢終則恨惇遂成怨隙朝為金蘭暮為矛盾正歐陽子所謂小人之朋見利而相爭或利盡而交疏則反相賊害是也此數子者真可謂傾危之士哉而安石托之以腹心寄之以耳目欲與之共興堯舜之治不亦謬乎初吕惠卿迎合王安石建立新法故安石力援引驟致執政惠卿既得志忌安石復用乃起李士寧獄以傾安石知人之難自古病之然公以處心明以燭物則知之亦非難也君子如孤松徑柏望之蒼然不可狎玩雖風霜搖落不改其舊焉小人如細栁柔蔓婀娜纒綿令人喜悅然𤣥冬沍寒摧落無餘矣以此驗之何患人之難知哉世之為大臣者以其不可狎玩也而憚之以其可喜悅也而愛之於是好惡橫生而君子日疏小人日親矣李德裕忌白居易而薦白敏中然德裕得罪之後出力以傾之者敏中為多王安石忌司馬光而薦吕惠卿然安石罷相之餘逆距其再用者出於惠卿之謀夫敏中惠卿小人也嗜利忘義不足深責德裕安石處心不公好同惡異實有罪焉豫故表而出之以為後世大臣之戒詔韓縝如河東割地以畀遼東西凡失地七百里有國家者據險厄設關城守之以徑卒鎮之以虎臣蓋以慎保祖宗之土宇而已疆域之內尺寸不可捐以與人以其受之祖宗也況數百里乎漢成帝遣夏侯藩求地于胸奴單于謝曰先父地不敢失也彼夷狄之長且然况華夏之君哉宋與契丹結好以來殆將百載彼疆此界分畫已定一旦遣使以地界為言得非窺吾兵疲民困有所侮而動耶為宋計者質之以地圖諭之以文告彼必欲得地則是志在敗盟有戰而已兵出有名師直為壯況彼中葉將驕卒惰非安巴堅之比倘不得已而用兵豈遽出彼下哉而神宗舍韓琦之謀用王安石之䇿割祖宗之土宇歸異域之版圖是契丹不費斗糧不折一矢而坐取七百里之地也宋之削弱亦甚矣安石之言曰將欲取之必姑與之終安石之世曷嘗取償其尺寸哉此蓋內不能辦而外為大言以罔其君而已昔梁惠王以喪地於秦七百里為恥夫秦以攻戰取之而惠王以為恥遼以虛聲取之神宗之恥為何如哉罷手實法王安石之為相凡斂財富國之法斷然行之而不疑雖元老如韓富不能沮也雖雅所敬重如程皓司馬光不能回也今以鄧綰一言遂罷手實之法何其易哉蓋手實之法吕惠卿所建非出於安石也安石怨惠卿叛已故用綰言以罷其法耳然綰非能為國家忠計者欲彌縫其附麗之跡耳安石亦非有悔悟之意者欲彰惠卿之罪耳其事雖公其心亦出於私也況當時病民之法非特手實而已助役之法徵及女户單丁市易之法鬻及果實氷炭其為民病不甚於手實乎吳居厚行鐵冶于京東蹇周輔行鹽法于江西陸師閔行茶法于西川人情怨嗟比屋思亂其當釐革豈在手實之後乎罷其一而存其五是猶拘縶平民鎖其項拲其手械其足而姑緩其一焉其能使之舒暢耶帝嘗有意於燕薊詣太后白其事后曰事體至大得之不過南面受賀而已萬一不諧則生靈所係未易以言茍可取之太祖太宗收復久矣何待今日兵之為用所以禁暴戢亂聖人不得已而用之也得已而不已使生靈不終其天年豈為民父母之道哉神宗承富庶之後慨然有鞭笞四夷之志故其在位也王韶用兵於熙河熊本用兵於渝瀘章惇用兵於湖北李憲用兵於洮西方其勝也帝御紫宸殿將臣奏凱獻俘百官奉表稱賀鐃吹穿雲旌甲耀日赫然耳目之觀誠可快矣至其敗也靈州之役死者三十餘萬永樂之役死者二十餘萬交趾之亂連陷三州死者不可勝計良將徑卒橫身草野以飫烏鳶其禍為何如也自古論用兵之利害者多矣然未有若曹太后之言明且盡者也其言曰茍可取之太祖太宗收復久矣尤可謂善審彼己者也使神宗䖍奉慈訓深戒用兵豈有環榻至旦臨朝哀慟之悔哉傳之後嗣豈至收復燕雲遂并中原而失之哉嗚呼太后可謂有先見之明矣為君者知此不必用人之命以為耳目之觀為臣者知此遽肯用人之命以易封侯之賞哉蘇軾以事不便民者不敢言以詩托諷庶有益於國李定舒亶摘其語以為怨謗欲置之死帝憐之但貶黃州團練副使本州安置古之君子君有過則諌政有失則言諫不行言不聽則去未始託諸文詞以自表著也放臣屏子情不能已有形諸詩歌以道其不幸者矣然怨而不怒憂而不傷有溫柔敦厚之風無怨尤切蹙之病故言之者無罪而聞之者有感焉烏有怒號怨刺如詬鄰罵坐之為哉蘇軾在宋雄文直氣冠冕一時羣憸側目久矣為軾者緘其口卷其舌猶懼不免顧乃輕出所有以揚已長而昭人過寧免於禍乎軾之意蓋謂以詩托諷庶其君之一悟亦可謂不思矣新法之行舉朝爭之而不肯從寂寥短章遽能使其君感悟耶當是時李定舒亶王圭之徒極力鍛鍊軾幾不能自脫幸而神宗不以言語罪人薄示貶謫而已使遇漢宣帝殆不免種豆南山之禍遇隋煬帝安能逭燕泥庭草之誅彼定舒與圭隂險小人何足責哉所可惜者軾不能沉默以自全耳王安石卒王安石以文章節行自負其志直欲追蹤孔孟而於近世大儒若韓愈歐陽修皆不滿其意至其為相也慨然欲興道致治以攀伊周之逸駕而視當時賢相如韓琦富弼者皆薄之而不為其志如此宜其所就有大過人者矣然考其學術訓三經著字說往往以佛老之似亂孔孟之真而於聖人所筆削之春秋則詆為斷爛而不列于學官其視韓歐距邪說以衛聖道孰為優劣耶考其相業任吕惠卿以興財利任曽布以更役法任王韶章惇以構怨於四夷放棄忠直引用憸佞而天下日入於敝視韓富惓惓以培國本凝天命為心又孰得孰失耶安石初志未嘗不善而卒至於大謬者無他焉學未聞道故耳世或目為奸邪至於少正卯盧杞為比則豈至是哉昔臨川吳氏論之曰安石之學雖博而所未明者孔孟之學也才雖髙而所未能者伊周之才也不以所未明未能者自少而以所已明已能者自多毅然自信而不回此其所蔽也斯言得其實矣尚書左僕射兼門下侍郎司馬光卒古之賢相不世出漢之蕭曹丙魏唐之房杜姚宋以至宋之韓范富歐代不過數人而已然夷考其行或學術之未至或操履之未純雖先憂後樂如范仲淹然慶朔堂之詩不能無聲伎之娛通經學古如歐陽修然尊崇濮王之議不免於逢迎之咎君子深惜之若司馬光者三代以下一人而已光之學一出於正而其心又以誠為本至於孝友忠信恭儉正直居處有法動作有禮粹然儒者也故其居洛也天下仰以為相其入臨也百姓遮道聚觀其卒而葬也送者如哭私親是豈以聲音笑貌得之哉彼蕭曹以下諸君子亦嘗有感人之深如是耶昔太史公論晏子備致希慕之意且願為執鞭嗚呼晏子伯者之佐耳九原如可作也吾願為光執鞭吕公著當國羣賢在朝不能以類相從遂有洛黨蜀黨朔黨之說洛黨以程頤為首而朱光庭賈易為輔蜀黨以蘇軾為首而吕陶等為輔朔黨以劉摯梁燾王巖叟劉安世為首而輔之者尤衆朋黨之說自古有之然皆以君子小人以類從耳元祐三黨則皆君子也徒以好惡不同而相比耳夫頤在當時存心制事動以聖人為師動止語默一用古禮儒者當然也而軾乃肆情蔑禮每加玩侮此軾之罪也至於既慶而弔頤執哭而不歌之說以為不可則過矣夫餘哀未忘不可以歌未有餘喜未忘不可以哭也倘慶禮既行之後不幸而聞父母之喪期功之戚亦將不舉哀不成服乎此頤之過也軾知其不可據禮爭之可也乃戲以俚語頤反求諸己犯而不校可也乃輒形忿怒胥失之矣當是時熙豐邪臣退伏散地俟間投隙求逞其奸諸賢同心相益同道相濟以杜惇卞復起之萌猶懼不免顧乃各為黨比互相詆排卒之羣奸競起邪說以惑在位宣仁既崩國是遂搖軾有昌化之貶頤有涪州之行摯等亦竄逐四出國事馴致不可為嗚呼哀哉熙豐舊臣爭起邪說以惑在位吕大防劉摯患之欲稍引用以平夙怨謂之調停蘇轍面斥其非調停說遂止宰相之職其明必足以察幾微其材必足以消禍變其威必足以懾奸壬夫然故能措天下於康靖吕大防劉摯有宰相之度矣而宰相之材不足太平之時相之可也多事之秋變故紛出非所克堪矣夫熙豐舊臣包藏禍心志在報復豈引用所能平其怨哉而大防與摯不察不足於明矣邪說橫流以撼在位此周典所謂造言漢法所謂不道也明典刑以誅殛之夫豈為過而大防與摯不能則不足於威矣旁搜英賢以充朝廷逺竄憸壬以禦魑魅則羣奸殆將老死貶所何之能為而大防與摯熟視邪黨布列中外而不為之圖則其材不足稱矣夫君子小人猶薰蕕氷炭然雜薰於蕕則薰必臭置氷於炭則氷必消雜用邪正祗以速亂而已惡能弭怨哉調停之說雖以轍之言而止然趙瞻在密院許將在政府楊畏來之邵在言路皆熙豐之邪黨也異時宣仁上賔畏首請紹述先政而惇卞之徒唾掌而起矣推本而言之捨大防與摯誰咎哉椒邱文集卷五
