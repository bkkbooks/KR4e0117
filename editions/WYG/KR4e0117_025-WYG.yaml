body:
  text: 椒邱文集巻二十五明何喬新撰詩七言絶句附集句福安書事福安連嵗被冦加以洪水為災室廬蕩然水後疫氣大作死者什三四甚至家無噍類鄰里懼其相染也不敢過門故死者徃徃暴露不葬嗚呼哀哉何吾民之不幸也予行部至縣延問父老慨嘆不已雖悉心圖之然才非張養浩未能有濟也因即所見漫成十絶用貽一二同志庶㡬共圖救荒之策云海門夜半吼長鯨怒捲閭閻入巨溟惟有清霜臺上檜亭亭不改舊時青市閭白晝舞天吳無限羣生化作魚弭節行臺增慨嘆蕭條邑里似荒墟兵後蕭然甑有塵更堪癘鬼困殘民慚予不是張希孟也對斜陽淚滿巾驅車曉度碧山隈拂拂腥風逆鼻來怪得饑鳶飛舞下前村露骴卧汙萊危檣巨舶晝縱横海上時聞鼔角鳴莫怪近來征税少編氓漸入緑林兵青裙少婦抱孤兒長跪車前淚滿頤夫死銀坑生業盡日鋤野菜和糠炊去年賑濟仰官儲今嵗官儲半粒無捕得海鮮將换米可憐孤溆遇强徒兒釣青蛙母捕鰻溪邊風雨不勝寒歸來竈冷生柴濕寂寞無言掩淚看鴻雁嗷嗷可奈何桑田此日變滄波願持誠意回天意却轉悲歌作笑歌茅簷過午突無烟里正催租更索錢不遇使君親問訊此身已分入黄泉民有貧不聊生者欠糧七升不能納里正督之且索私債民急欲自縊里正執以詣道予訊而憐之笞里正使代納俟秋成取償焉民泣謝更生故録其語云山亭瑞香次宗源韻翠袖珠翹吐異香不隨羣卉競春陽名園臺榭今餘幾得似山亭晚更芳福安行臺次景澄韻軺車曉駕粤山陽苦雨蕭蕭去路長最是不堪怊悵處平原桑柘盡凋傷重過大凝寺次景澄韻三年四度過禪家兩見凋零兩見花今日畫轓重駐此緑陰彌望盡桑麻初度有感時寓寧徳行臺五年初度客中過不似今晨感最多先壠在盱身在粤蓼莪咏罷淚懸河石牛驛次南谷韻苦雨炎風促去程此心不為世間名願將㡬滴天瓢水一洗閩山萬壑清訊鞫稍暇偶閲唐人王建宫詞愛其寓興深逺頗得國風離騷之㫖因擬作四章録呈易庵兼柬南谷年兄花貌宫娃老掖庭承恩元不在傾城披香殿上開春讌閒看羣姬弄化生憔悴無心對鏡臺燕釵象揥鎖塵埃昭陽自有身輕者肯放羊車夜半來纎眉如月鬢如蟬金屋栖遲十二年别院昭容新繫臂而今已賜洗兒錢碧梧淅淅送秋聲坐倚銀牀百感生誰向御溝題落葉不知溝水最無情汀州行臺次易庵韻榕陰垂緑暗閩溪蹀躞花騘去欲迷駐節行臺心獨喜幽林無復怪禽啼玉華洞次易庵韻白雲深處是仙臺寳樹春深玉蘤開蓬島未應能勝此仙人何事不歸來洞前琪樹倚雲栽洞裏瑶華映雪開一自飛軿遊碧落月明空見鶴歸來道傍李花為風雨所殘縞袂珠襦白玊冠含悽無語怯春寒東風不為多情惜無數殘鈿趂馬鞍行部上杭道過三洲館見白花生枳棘中芳潔可愛而不知其名問之村民曰文壇花也予哀其託根非所賦詩唁之又推花意而答賦焉凡得六首雪彩氷姿傍棘叢更堪苦雨與斜風五侯亭館多閒地何事凄凉向箇中右唁花素質生來異衆葩孤根不識五侯家年年雨露隨天分肯向風前怨嵗華右代花答麗館崇臺二月時羣葩紅紫競葳蕤可憐寂寞荒山裏空抱芳心吐向誰右重唁花不誇顔色不誇香不共羣英競艶陽造化栽培知有意且隨本分過春光右花重荅沁園臺榭五雲連鈴索春來處處懸何苦甘心蕭艾裏炎風瘴雨有誰憐右再唁花碧桃紅杏炫春容嵗晚紛飛總是空縱在主家鈴索裏可能禁得五更風右花再荅渭水秋風圖剪得秦川半畝雲晴忩鳳羽翠紛紛狂飈莫苦相摧折清廟箾韶待此君行臺有花名剪春羅一夕盛開時浙㓂入境予與景澄督兵討之賊敗走因戲成詩一絶云劍倚晴空殺氣髙鼪鼯膽破抱弓嘷天公應欲行勛賞故剪春羅製絳袍坐客有談兵者縱横無窮謾成一絶以警之趙括談兵世鮮倫長平一敗血成津誰知蹙項安劉者却是當時重厚人過斜頭遇雨肩輿薄暮過斜頭風雨蕭蕭送旅愁太息人家生計盡柴扉不掩野麋逰録村氓語二首大兒前嵗死銀坑弱子而今又出征但願使君平黠冦老氓從此樂農耕行營昨夜運糧回今日還差送甲來道路奔馳何日已石田强半是蒿萊過卧龍岡有感卧看闗河起戰埃草廬數語見雄才于今未必無諸葛誰肯三迴枉駕來銅臭紛紛位顯庸豈知王佐卧隆中山林莫道無伊吕氷鑑何人似徳公孝直竒謀世鮮雙君侯共事每包荒忠勤亦有張樞宻却恨臺章詆李綱論者謂張浚忠勤似孔明然孔明能容法孝直而浚不能容李綱此其所短也題鰲溪圖滿榻松陰滿院苔書聲隱隱蕙帷開雙橈誰鼓晴川艇應是門生問字來題屏間紅梅曽餌仙人换骨丹霞裳翠舞月華寒暗香疎影終非俗莫比桃花一様看録襄鄧民言七首一檄賢於十萬兵西南赤子荷更生雄詞誰似元夫子重與磨崖頌聖明襄陽行徧到南陽勞徠寕辭去路長刁斗不驚雞犬靜村居處處樂耕桑總戎徃嵗駐荆襄黄口呱呱泣路傍今日歡然騎竹馬攔街歌舞迓都堂白茅覆屋竹編籬斫得生柴給曉炊婦子熙熙還感嘆於今始得免流移緑林兵散瘴烟清歸買山田自力耕蕎麥收來村釀熟家家歌吹頌皇明荒山寒谷停車處慰問丁寕出至情白叟黄童俱感泣不圖今日覩昇平玊節光臨漢水湄殘民喜極更成悲峴山何用銘遺愛千載斯人口是碑寒食郊行書所見破帽飄飄白髪垂日斜醉飽意施施歸家尚作驕人態不記墦間乞食時偶成氷鑑當年重徳公近來何事大冬烘人間未必無王佐却認長蛇是卧龍題梅竹巻四首棃雲漠漠楚天低縞袂相逢思欲迷斗轉參横寒漏永夢廻惟聽翠禽啼姑射仙人氷雪姿珠冠瓊珮下瑶池湘江帝子元同調翠袖相依嵗晚時鐵榦瓊英玉作魂託根不傍五侯門嵗寒惟有疎篁在共保清貞水石村霜華簌簌暗香浮萬顆明珠夜不收㡬度披圖吟興逺恍如水部在揚州次吳原明韻故人寄我錦䙀兒要識淇園烟雨姿却笑河豚誇絶品此君真味有誰知憶汳臺竹偶成汳水當年總憲時翛翛半畝雪霜枝别來久斷平安信勁節清風又屬誰題菊霜葩露葉冷香浮别是人家一種秋嵗晏羣芳揺落盡翛翛翠篠伴清幽題松為樊都運賦虬枝夭矯翠㕘天雨榦霜皮老更堅榱桷年來收拾盡豈知梁棟在山巔晉陽途次所見作六首采采槐牙不滿筐婦姑踞地且同嘗祗愁四月槐牙老從此貧家又絶糧阿母前行兒後追兒追不及哭聲悲祗知各自求生路肯復回頭一顧兒苜蓿花開松粉飄貧家生計轉蕭條平原處處無牟麥山鳥休呼婆餅焦二八了鬟泣路隅逢人但道乞為奴豈知富室都懸罄誰有餘糧養侍姝縣令傳言禁食人誰憐百姓甑生塵情知醉客非糟彘且飽饑腸度此春榆皮細擣晝丁丁野菜同烝半熟生㓜稚呱呱羸老泣不知何日見秋成平陸所見被苫藉草倚頽垣父啖兒屍祖啖孫一段民風堪入畫冩生只欠鄭監門録村嫗言芮城有村嫗坐豆畦間呼兒而哭問之則曰有女年十五换得豌豆三斗種之冀以療饑今天旱而豆槁矣徒使母子離散終不免餓死也賣却嬌兒换豆歸豈知種豆盡為萁空令骨肉東西散不得杯羮療母饑過故相第作二首門掩西風晝不開蛜蝛滿壁粉墻頽庭前乳犬休驚吠無復懐金暮夜來偃月堂空複道深薔薇零落棘成林槎槎喜鵲歸何處不到人家送好音白羊石白石離離似白羊嶄然頭角徧沙場獨慚未學初平術一任閒眠對夕陽播州夜聞子規有感命墮殊方一羽輕更憐十口住都城播江此夜聞啼鴂涙濕寒衾夢不成事竣還京將發渝城偶成口號去嵗乗軺出帝畿兹晨整珮覲彤闈擔頭訟牒兼詩草不帶川中一物歸山居觀物偶成作四首風暖空庭草色青門如市處不曾生閒中玩物窺天意始悟春風也世情雙燕應懐舊主人巡簷緝壘徃來頻却嗟老圃春光暮黄蝶紛飛過别鄰風和日麗百花香坐看逰蜂釀蜜忙擾擾營營空自苦蜜成端的是誰嘗靈烏噭噭集林端浪惹羣兒競射彈何似黄鸝逞嬌舌逰人聽罷有餘歡題泥金畫梅此花元是玉為容金粉何勞㸃染工識得和羮風味别始知來自蕋珠宫瓊姿不肯染緇塵别是西湖一種春畫裏底須論色相金丸熟處見天真别同年王繡衣集句四首我去君留可奈何李竹所青雲莫道故人多劉文房片帆今夜又何處施釣獨影翩翩逐逝波丼允從頭上花枝照酒巵千家詩鳳城依約更相期陳益稷九重正爾思梁棟子昻可向江南久别離吳全莭楊栁青青江水平劉夢得别時相顧酒如傾岑參何當共剪西忩燭李義山更與慇懃唱渭城劉夢得日暖飛花近鬢絲虞集相留一醉本無期戴㓜公明年此日知何處韋應物立在清朝白玊墀薩天錫椒邱文集巻二十五
