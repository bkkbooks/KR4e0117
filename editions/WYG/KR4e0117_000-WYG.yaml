body:
  text: 椒邱文集别集類五明提要臣等謹案椒邱文集三十四巻明何喬新撰喬新有周禮集註已著録明史喬新本傳載其厯任中外多著政績人以氣節剛方為萬安劉吉所排故迄不得大用又載江西廵撫林俊為喬新請諡時中㫖詰喬新致仕之由給事中呉世忠為訟寃以鄒魯之劾喬新比於蔣之竒劾歐陽修胡紘劾朱子是誠太過然核其立朝始末嶽嶽懐方在成化𢎞治之間不能不謂之名臣也是集前三巻為䇿略盖科舉之學次五巻為史論次十二巻為雜文次五巻為詩次六巻為碑誄次三巻為奏議外集一巻則往來贈答之文為婺源余瑩所編輯喬新不以文章名而所作詳明剴切直抒胸臆學問經濟實具見於斯史稱其博綜羣籍聞異書輒借鈔積三萬餘帙皆手自校讐著述甚富則有本之言固宜與枵腹髙談者異矣乾隆四十六年九月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:dec9bfdc199fa11bbaf85d6611e51537805b9f1860e4c8c1f1007f40115b62b1
