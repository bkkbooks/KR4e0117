body:
  text: 椒邱文集卷十二明何喬新撰序金壇段氏族譜序金壇段君敏繇進士出宰新城嘗念其家譜遺軼無以昭示來世乃因其叔父舒所録先世圖譜遺文纂次成書先以系圖次以家傳又次以先世遺文與凡儒碩詩文為段氏作者既成委豫族子棪求序其首簡按段氏有二族其一以官氏周禮所謂鳬栗段桃是也其一以王父名為氏春秋傳所謂共叔段是也金壇之段未知孰所本其先世家汴梁完顔氏蹂宋有百三公者渡江而南始家京口二子一居丹陽一居金壇日益蕃昌自百三公至縣宰君十有一世矣今觀其譜斷自始遷之祖者詳其所可知也汴梁之族不録者闕其所不可考也旁支承繼必著其所出者不敢忘天姓之親也先世善行必紀其實者不敢誣其祖也辨昭穆之戚疏敘傳承之久近甚得古人作譜慎重之意可謂賢己豫嘗考淳安汪氏之譜以魯侯為祖番陽吳氏之譜以季札為祖而承傳卒葬具焉皆自以為博矣然豫竊疑之數千年間或盛或衰或絶或續安知不有拜汾陽之墓者乎安知不有冒稱東坡出子者乎則其詳也乃所以為偽也段氏之譜於有徴者不敢遺無徴者不敢紀其賢於彼逺矣段氏自百三公以來世業醫而本於儒其利澤及人者博且深矣而縣宰君以文學發身政聲赫然方將躋華陟要以顯其親以光斯譜豫未髦尚及見之晉江莊氏族譜序陸川縣令晉江莊概世平捧其家譜詣豫請曰兹譜先君僉憲所作而槩增續之者也惟吾莊氏之先居光之固始唐龍啓中從王潮入閩始家泉之永春歷九世至諱夏者起家進士以文學風操為名法從纍官兵部侍郎兼焕章閣待制賜第泉城卒贈少師今家晉江者皆少師之雲仍也自入閩至於今凡十有九世舊有譜名蕃衍記薦經兵燹散軼先君始因蕃衍遺稿旁採先世碑志以成茲譜世經人緯倣史氏之年表而家譜復完先君殁垂四十年族之生者卒者仕者隱者日夥矣不可以不録故槩增而續之附以先世之遺事以及名公之文章總若干卷敢求先生敘之以示我後之人豫考姓氏書莊氏有二皆以諡氏者也其一魯莊公之後青兖之間多祖之其一楚莊王之後江漢之間多祖之晉江之莊或出於魯抑出於楚蓋不可考矣然魯之姓姬其先出自帝嚳楚之姓芊其先出自顓頊是二姓者又皆出於軒轅氏其源未嘗不同也莊氏自光入閩至少師始大著少師三子皆以宧業聞延及曾玄典郡縣位侍從者纍纍有焉入國朝有曰謙材者舉進士為山西參議曰巽者户科給事中曰亶者兵科給事中曰敏者亦舉進士為雷州太守曰琛者僉廣西按察司事即槩之父也簪纓蟬聯若此其盛非少師之遺澤耶嗟夫譜之作所以志吾先祖所自出孝子仁人所慎也世之作譜者豫竊惑焉或非其祖而冒之或恥其先之微而棄之可謂孝且仁乎今觀莊氏之譜斷自所可知近者詳之逺者略之不可考者闕之不敢冒而亦不敢棄也真孝子仁人之心哉繼自今莊氏子孫以學植身以禮正家以孝奉先以仁睦族以紹少師之休光而益衍其慶斯可謂賢矣不然學則不勤德則不競以至沒世無聞焉豈不有愧於前聞人哉乃序以告為少師之後者安沙遊氏族譜序福建按察副使豐城遊君取其家譜重修之凡若干卷先之圖以表其世系次之譜以紀其行實而歷朝之誥敕暨名卿峻儒之詞章附焉間屬豫序之且曰遊姬姓也而我遊氏則鄢姓也姬之别子國於鄭其小宗曰遊吉者以王父字為氏子孫世保其姓不墜焉南唐時有仕至尚書者始家吉州之蛇壠四傳至諱大托者徙崇仁之藍陂又八世至諱宰均者復徙豐城之安沙又五世為子美子輝子美之子曰覃恩府君子輝之子曰朝奉府君朝奉實鄢氏子唐湖南節度使燧武十五世孫少從其姑鞠於遊遂為遊氏後入國朝以來若富州司訓惟善則覃恩之後姬姓之遊也若吾與應山教諭邦貞壽光司訓弼進士理則朝奉之後鄢姓之遊也今吾欲仍遊氏歟念水木本源之義於心有未安欲復鄢姓歟則先世已𨽻戎籍於法有不可姑於朝奉之譜著其所自出以見吾宗為鄢姓之遊而别於姬姓之遊可乎不可乎豫曰可夫萬姓之繁其始一本耳邃古之時若風若薑若姬若嬴其初兄弟也兄弟之身其初一人也一人之身其初一氣也果孰親孰疏孰同孰異耶先王因生賜姓所以别生類慎婚姻崇本始使人知親親尊尊之道焉耳親親仁也尊尊義也厥初生民安知姬之與鄢不出於一家不同乎一氣耶惟眀其所自出而不附會焉仁義之道在是矣矧遊以氏見於春秋之世者已非一姓其在周者則遊孫伯之後也其在晉者則桓莊之族也其在宋者則公子遊之後也與姬之遊鄢之遊蓋五矣亦何患於同邪憲副君因其姓之同而推其本之異豈非仁之至義之盡而得親親尊尊之道者乎雖然所貴乎世家者非能言其祖之謂能踐修厥猷之謂也遊氏之先代有達人而憲副君又以博學清操有聲於時為之子孫者尚其祗遹乃祖仕而登朝也秉忠貞之節隱而家食也修亷慎之行斯不忝其先矣詩曰無忝爾祖聿修厥德遊氏子孫念之哉廬陵吟溪陳氏族譜序豫友秋官郎中廬陵陳君時莊出其所修家譜屬豫序按譜陳本舜後其先胡公滿以神眀之胄國於陳為楚所滅其子孫遂以國氏宋初有諱松貞者為廬陵教授因家城北之吟溪而廬陵有陳實始於兹傳數世至諱世榮者登進士第卒官宣教郎而其子元伯尚宋宗室女其雲仍日蕃其衣冠日盛而陳遂為廬陵望族國初有諱灌者佐太祖髙皇帝定天下纍官宣城太守宏謨駿烈國史紀焉宣城嘗病其家譜散軼欲修輯之未就而歿宣德癸丑其子致廣始考其可徵者倣眉山譜例為流慶圖而先世之遺文軼事附焉逮今三十餘年其族舄奕繁衍不可勝紀時莊致廣從孫也復取舊譜而增修之自七世以上則仍其舊不敢輒有損益八世以下則詳考而具録焉名卿偉人之詩文為陳氏作者各以類附録於後總題之日廬陵陳氏續修族譜夫族譜之作明吾之所自出也故君子慎之果吾所自出歟雖賤且惡焉不敢遺也遺之則黜其祖是不孝也非吾所自出歟雖貴且賢焉不敢冒也冒之則罔其祖亦不孝也然杜正倫世出本微而求合於城南諸杜則罔其祖矣近世吳興秦氏耻檜之姦而諱稱其子孫則黜其祖矣嗚呼古之譜其族也明之後之譜其族也亂之茍譜之而以亂之也曷若不譜之為愈哉今觀陳氏之譜斷自其所可知而其不可考者缺焉斤斤焉尊祖睦族之意是固孝子之用心也時莊以明經登第其為司法勤慎而文寖寖乎躋華登峻以亢其宗以昭其祖以光啓其後蓋有日矣昔唐宰相世系表以貴傳廬陵歐陽氏族譜以賢傳斯譜也安知不以時莊之貴且賢而盛傳歟吉水王氏族譜序山西按察副使王公充獻出其所修族譜屬豫序之且曰吾王氏系出琅琊琅琊之王顯於江左彯華纓鳴佩玉者纍世不絶宋紹聖間有諱恕者繇進士擢江西節度推官始遷於臨江之新淦推官之子諱琛又自新淦遷於吉水之五嘉塘實吾吉水始祖也子孫蕃衍或出典藩憲或入宧臺省為邑之著族不有譜以紀之何以昭吾先世而示吾子孫哉又曰吾宗人家吉水者數千指其初一本也源流而末益分於是乎有期功之屬焉有緦麻之屬焉有袒免無服之屬焉世之薄者於其疏屬相視如途人繇無譜以稽之也使有譜焉等而上之則出於一本旁而推之則分為羣支雖百世之逺而祖考不忘宗族不散尊祖敬宗之心將油然而興矣此吾譜之所以修也子幸為我序之豫惟族譜之作所以推其本聯其支而尊尊親親之道存焉世之譜其族者蓋多有之然誕者上推古昔以為博夸者旁援它族以為榮不幾於誣其祖乎今王氏之譜據其所可知而不失之誕缺其不可考而不失之夸推其祖之所自出有尊尊之義焉詳其族之所繇分有親親之義焉真得古人作譜之法矣雖然所貴乎世家子孫者非譜其族之為難而克紹其先之為貴王氏之先代有達者若太保祥若司徒導皆琅琊之望也為之子孫者迪厥德踐厥猷以亢厥宗斯有光是譜矣充獻出佐外臺而其從弟充實為南臺御史皆焯焯有賢聲顯庸有日矣然則繼太保司徒之烈而垂子孫無疆之休以光是譜者非充獻兄弟而誰歟詩曰無念爾祖聿修厥德充獻兄弟念之哉南豐曾氏族譜序南豐曾君仲質捧其宗譜詣豫請為之序豫謝曰子之先世以道德文章名天下天下推為名族與漢之華陰楊氏唐之河東栁氏並稱宗譜必得名世者序之不腆之文不足以辱子仲質曰吾先世道德文章寂寥久矣所以請於先生者願得一言告吾之子孫以祗遹前休耳敢固請豫乃受其譜而閲之首譜序得姓之由著矣次家訓正家之道嚴矣又次之宗圖世系昭矣又次之家傳世德詳矣附以前代與當世名賢之文所以光昭世美者備矣豫作而嘆曰懿哉曾氏之文獻萃於此矣吾旴大家世族不為不多一再傳之後子孫雖碩且茂而文獻己不足徴此正文定公所謂嚚子憸孫也求如曾氏之文獻彬彬者一何鮮哉豫為邑庠生時嘗識仲質之先君子汝愚今歸老於家又識仲質其父子之行已渾然端且厚不失其世守閲其譜又知其子孫之茂且賢信乎其為名族而無愧於華陰之楊河東之栁也雖然所貴乎名家之有譜諜者非惟使子孫知其源流所自而已正欲其知祖宗之德業而趾美承休焉曾氏之先郕國公以道德鳴於周而萊蕪實啓之文定公以文章鳴於宋而文昭實和之其立德立言皆所謂不朽者也聞其風者咸思則而效之况其子孫也哉曾氏之子孫尚思祗遹前休仕則推乃祖之道於用使膏澤洽於民居則體乃祖之道於躬使德業薰於鄉斯不沗名賢之裔胄矣嗚呼曾氏子孫尚勉之哉瑞安鍾氏族譜序福建參政瑞安鍾君景清示豫以所修族譜俾序之按譜鍾氏本微子之後春秋時宗伯之子州黎自晉奔楚仕至太宰食采鍾離子孫因以邑為氏漢有鍾皓魏有鍾繇唐有鍾紹京皆以德業光於簡册唐之季葉有諱慶禮者仕湖南馬氏始居霅川其孫成德又自霅川遷溫之瑞安又十有四世至諱源府君實參政君之八世祖也今譜斷自府君為始詳其所可知也自府君以上略而不録缺其不可考也首之譜例明作譜之法也次之系圖著承傳之序也又次之世譜紀行實之詳也亢宗鳩族必有規範故家規次之禔身正家必有儀矩故家儀次之附以列聖之誥勑昭天寵也繼以名賢之碑志表卓行也其立例嚴其考據精真得古人作譜之良法矣嗟夫人本乎祖猶木之本乎根水之本乎源也世之昧於一本之義者往往妄附於名賢華胄以為光耀殊不知自陷於二本矣松柏蒼寒而綴芙蓉於其顛君子固識其非類流水東入於河雖淆而為一其清濁固自可辨也人於其祖而可以二本乎二本者亦何益之有哉故歐陽子之譜其族中間失其世次者再蘇老泉之譜其族由一世之上失其次以二子之學識絶人猶且缺所不知而不敢誣其祖也如此而况於他人乎若參政君兹譜蓋深明一本之義而得歐蘇之遺意矣抑豫聞之根之盛者其末茂源之深者其流逺鍾氏之先其根源茂且深矣而參政君起家進士為朝名郎為省膚使政聲焯焯有聞於時豫知承休篤烈以紹相國之家聲以復鍾離之封邑者必參政君也傳曰公侯子孫必復其始豫於君有望焉南昌梓溪劉氏族譜序南昌梓溪劉氏自始遷迄於今以文獻臨一鄉者蓋餘三百年矣其先本陶唐氏之裔至漢光有天下其别子荆胙土廣陵子孫因家焉荆之七世孫琅琊內史會始徙丹陽會之四世孫隱人又徙晉陵隱人之曾孫冕為睦州刺史又家於睦冕之九世孫奭避廣平之亂又自睦徙信之玉山奭之十世孫從禮侍父允迪宧逰江右愛梓溪民俗淳厚乃卜居焉子孫舄奕繁衍遂為望族從禮之七世孫孟堅嘗譜其族其後屢修之至十一世孫福建按察司僉事子肅字敬之者與宗子子來復參考玉山諸譜而增修焉其立例甚嚴其考核甚精自允迪而上推本於陶唐氏系序不紊遡流而源也自從禮而下或居或徙備録無遺由本而支也名諱字行各從其類所以辨昭穆也生卒娶葬具著於譜所以紀終始也附以誥勑之詞昭寵貺也次以碑銘表碣之文表善行也其尊祖睦族之心藹然見於斯譜矣敬之將刻板以傳徴序於豫嗟夫宗法之廢久矣能言其祖郯子所以見稱數典而忘其祖籍父所以無後也在春秋時且然况於後世乎敬之兄弟生於宗法既廢譜諜失官之後乃能推本其祖至於百世之逺而其所譜又斷自始遷之祖而致詳焉是蓋賢於籍父而郯子不得専美於昔矣雖然所貴乎文獻故家者非世祿之謂也世德之謂也夫保姓受氏以守宗祊是之謂世祿迪德象賢克念厥紹是之謂世德劉氏神明之胄其明德逺矣為之子孫者祗厥身服厥訓順厥則以成乃顯德以宣乃令聞以纂乃前休兹可謂世濟厥美而無忝於文獻故家者矣豈真世祿而已哉詩曰貽厥孫謀劉氏之先善於貽謀矣又曰繩其祖武豫有望其後人焉劉氏之子若孫尚朂之哉臨川洪氏族譜序臨川洪生球捧其家譜一巨册托豫外孫揭瑀持詣豫請為之序豫展而閲之則知球乃宋忠宣公皓之裔也豫因嘆曰忠宣公父子在宋以文章節義著聲於時南度已後第一流人物也始豫觀球以經學教訓吾鄉俊秀學與行端且厚吾固疑其有所本也及得譜然後益信其有本非忠宣公能有是子孫乎乃為之序曰忠宣公當靖康之變出萬死一生之計使萬里外強悍侵陵之敵厯十五年南北通好然後放回其臣有慮其知國虛實為後患者遣騎追之及於淮而公與同歸者張邵等已在舟中追騎相顧無可奈何及入見髙宗慰之曰蘇武不能過也命宰相與直閣之職而公數稱張浚之賢忤秦檜意遂閣詔命出領鄉郡尋又貶嶺南檜死而後得歸朝其外厄於強敵內厄於姦臣艱難險阻靡不並嘗而公始終一節不以死生禍福纍其心然公生八子曰適曰遵曰邁皆以博學宏辭進其後適與遵皆致大用而邁亦僉書樞密院事豈非忠義之報乎忠宣公始居鄱陽其後遷新安而忠宣公之弟昢為臨川司户者遂家臨川今球之宗是也豫嘗論之為宋使金者公與宇文虛中也虛中露才現竒遂為金人所用而喪其守公則不然韓昉欲易其官爵以死拒之不從尼雅滿迫之事劉豫以死拒之不從烏珠訪以伐宋之策拒之不應其濵於死者屢矣然終免於死宇文虛中受金人之寵最多聚其族而居之然其後少為抵牾全家死於烈熖子孫無噍類焉孝宗極力訪求僅得其族人紹宗命之以官俾嗣其後而公之歸也諸子相繼登兩府而遷他郡者子孫亦皆繩繩不絶宧業昭著於時忠義之報天道故不爽也詩曰毋念爾祖聿修厥德球之子孫尚修其德哉傳曰公侯子孫必復其始忠宣以下爵位顯矣有封魏國公者封秦國公者球與其諸子孫尚思所以復之哉豫先祖文定公與忠宣公仕同朝又嘗同時固有世舊之好也遂書此以為序以為洪氏勉壽孫母太淑人詩序成化十有七年夏四月上命都察院右副都御史孫公伯大自大同移鎮河南公將赴鎮道過晉陽謂豫曰洪生五嵗而喪所恃所以保抱擕持訓誡教督俾克有立者繄吾繼母之恩及洪登進士第擢夏官郎先皇帝推恩所自封先君兵部郎中贈先妣王及封繼母劉俱宜人錫之勑命以寵嘉之今天子嗣位洪出佐汳藩尋遷布政使三轉而都內臺顧吾菲薄何足以膺之實祖考先妣之遺庥而繼母之教也念祖考先妣不可見矣繼母在堂亦已老矣乃懇請於朝以假寵於存歿於是吾祖考獲贈官階與洪同而先妣加贈淑人繼母進封太淑人今吾母年登七十而命書適下十月六日則説悅之辰也大夫君子喜吾母壽且榮相率賦詩遺吾以致頌禱之意方欲抗章歸省以展獻夀之禮而又有移鎮之命不敢顧其私將遣吾兒楷持諸君子之詩歸夀吾母子其序之俾吾兒誦之以侑壽觴庶幾一解其顔也豫嘆曰盛哉孫氏慈孝萃於一門矣世之為子者鮮克盡孝於繼母而為母者亦鮮克盡愛於前妻之子薛宣以明經致位宰相而事繼母孝養有缺君子譏之王祥事繼母朱以孝聞而朱遇祥不以道君子深憾焉太淑人愛都憲公不啻如己出而都憲公孝養誠篤不啻如己所自出慈孝之風蓋前古所鮮者玳首金葩光被天寵鳳冠霞帔燁其在躬天所以昭賢淑也豫想斯辰也宗姻畢來絲竹迭奏里婦喟然歆豔曰吾所以教子者盍如太淑人乎凡為人子者亦將感奮曰吾所以持其身而孝其親者盍如都憲公乎是豈一家之慶哉豫與公同登進士同官大梁兹又同官憲臺視公猶兄視太淑人猶母也顧縻祿於兹不獲捧觴上夀以罄同一人子之情乃為之序以寓豫意焉慶長史程公七十序韓府長史新安程公孔著生於洪武己卯四月草日逮今成化戊子年登七十而公之配宜人齊氏先公三年生至是七十又三矣其子地官郎中用元喜其父母壽且康也前期求詞林諸公詩歌寓歸以為壽既又念二親具慶而不獲躬帥婦若子捧觴上夀悵然者彌日於是秋官主事謝君德澤暨凡與用元好者相謂曰吾曹與用元或生同鄉或舉同年或仕同官視公猶父也視宜人猶母也公與宜人壽考和豫吾曹與有慶焉非獨用元之慶而已繫官於朝不獲升堂拜慶豈獨用元悵然哉乃吾曹亦有慊然者盍為文詞以道頌禱之意因用元致之以為公繁祉之祝可乎衆皆以為宜而屬筆於豫惟程氏新安之世家也自忠壯公著勛烈於梁垂光錫祚久而彌昌歷唐宋以迄今兹外典方州內贊鈞樞者代有其人公惠和允肅克紹前休以儒學起家為任邱教諭循循善誘學者歸心焉兩相親藩惟忠義是迪惟謨訓是陳用是甚見親禮年甫六十謝事而歸優遊桑梓以子恩光被命書進階朝列大夫而宜人亦被龍章之寵錦衣珠翟輝映里閭子五人諸孫十餘人蔚然梧竹之並秀韡然芝蘭之聯芳也洪範所列皇極之福公蓋兼之矣南山有臺之詩曰樂只君子遐不眉壽又曰樂只君子德音是茂説者謂德為壽之本而壽乃德之效也公之享此繁祉者非本於惠和允肅之德歟是可頌已豫亦與用元同年者也故為詩遺之初度之辰良朋蒞止俾未冠者歌之以侑壽觴亦庶幾南山有臺之遺意也其詩曰嶻彼黃山有菀厥靈鍾于君子維時之英維此君子忠壯之胄慶源孔濬延畀爾後乃秉教鐸于彼任邱青襟濟濟來歌來逰來遊伊何式觀我德爰及邦人罔不是則維皇有命俾相賢藩左右諷議諤諤讜言旅力方剛嵗月未邁休老于家其樂泄泄嫓德維媛命服斯皇嗣德維子蔥􅀈有瑲何誕之月維此孟夏宗戚具來式燕且譽考鼓逄逄笑言雍雍小大稽首祝壽於公清酒維湑酌言獻之祝公多祉俾耄而期相彼蓼蕭零露孔厚矧兹君子胡不遐夀於皇上帝作善降祥委祉于公奕世其昌慶義民黃君愈敬六十序豫為童子時侍先冡宰之側先公每稱鄉先生陳伯賢揭敬文之賢且曰惜汝不及見之不獲考德而問業也又曰吾鄉之俗將日漓矣吾見其兆矣然後生可畏安知無伯賢敬文其人可以表俗者邪汝宜擇而從之可也喬新謹識之退而求其人得富而好禮者數君子焉每敬而慕之且嘗見諸文字以為鄉里勸白水黃君愈敬豫所敬慕者之一也愈敬輕財急義如古燕趙之節士好遊佳山水如晉宋之名流讀書賦詩以自樂如宋之陸務觀居鄉恂恂不敢以富貴加於人又有萬石君之風豫私以為伯賢敬文不可作矣賢如愈敬者其殆庶幾乎自豫出仕於朝不至鄉里者幾二十年成化癸巳豫遷河南憲使便道歸省先壠訪平日所敬慕者僅存一二焉而吾鄉之俗益衰儒家之子或去而服技藝矣力田敦朴之世或變而競淫侈矣以健訟為智而敬讓之行微矣以豪敓為能而亷耻之節喪矣骨肉競錐刀而孝友之風薄矣當是時而愈敬所存所行獨不遷於俗表然為一鄉之望譬之蕭艾芁芁而覩芝蘭之旖旎蓊茸欣植而瞻松柏之蒼寒也豫乃喟然嘆曰先公之言於是驗矣豫雖不復見伯賢敬文而從之遊得見如愈敬者亦何其幸也是嵗九月草五日乃愈敬懸弧之辰姻戚將合醵壽之曾君唯學先期請豫言為壽筵之祝嗟夫豫之言豈足為君重哉而豫之行急不獲采金嶂之芝酌銀溪之泚以為君壽乃舉觴而遙祝之曰吾鄉之俗漓矣安得如君者數十人以挽漓而復淳乎又祝曰使君壽臻耄期為鄉大耋安知其無感而遷善者邪遂書之俾諸君持侑壽觴慶黃君愈明五十序豫友黃君愈明世家廣昌銀溪之上其先君子希古以資雄一邑蓋如古之宛孔蜀卓等然富而好禮進子姓於學故愈明兄弟皆雅飭溫裕無侈太之習焉豫年十五六時愈明以故人子謁於先大夫退即書室與豫講業時豫雖少已知敬愛之矣後數年愈明與豫補邑庠弟子員遂與同舍以學其出入必偕相得甚歡又十有餘年為成化乙酉再會於京師則愈明年已五十而豫亦三十餘矣始見愈明也其風度秀美論説偉辨譬諸甘泉之芝榮光燁然雖不識者亦知其為瑞世之物矣及與同舍其年益壯其學益充譬諸碧梧翠竹翹然蓊蔚之中其勢蓋將聳壑而昻霄矣及聚首於京則愈明涉世益深立志益卓譬諸岨􅺴之松風雪凌厲之餘龍虎躩拏不可得而狎玩矣蓋豫於愈明屢見如屢不同如此非所謂進德不倦者邪是秋愈明以上舍生擢蜀之灌縣宰甫閲月適其初度之辰朝之薦紳知愈明者喜其榮且壽也相率載酒肴以慶之且屬豫言以為愈明壽豫惟孔子曰仁者壽傳又曰人有壽而後能饗諸福然則壽者福之首而仁者壽之本也愈明承先世之慶澤忠厚以始其本詩禮以濬其源其德與其年俱進謂之仁者非邪今受天子命為宰於錦江玉壘之間上應列宿下子群氓立條教以宣惠澤則仁之施益廣豫知其繇艾而耄期繇令而公卿蓋猶泉涌而木升也昔之語賢宰令者或飛鳬於天際或養雞於雲中此皆荒誕而不足信若愈明之仁而壽以膺多祉蓋理之可必者何必采青城之芝餌巴穴之丹尋金馬碧雞之神而後能延年益壽也哉遂序以慶之慶周母太宜人壽七十詩序成化八年夏五月秋官郎中廣信周君宗用奉詔慮囚於閩豫實同事焉宗用周旋八郡以洗寃澤民為己責凡有疑必讞有寃必辨小大之獄必以情所全活者百有餘人事竣將致命於上間謂豫曰是行也吾有二喜吾祇若明命宣風遐裔用宏聖天子好生之德一喜也吾母太宜人年登七十嵗十二月十有一日實維誕辰吾得便道過家奉觴上壽二喜也豫以為何如豫嘆曰忠孝不兩全也久矣今子是行忠孝之道兼盡焉夫明清庶獄以推欽恤之仁可不謂忠乎升堂拜慶以致晨昏之歡可不謂孝乎是誠可喜也已乃告凡與宗用同年者又告凡與宗用同鄉者又告凡與宗用舊且親者亦皆欣然為宗用喜相率賦詩贈之俾被之絃歌以侑壽觴僉謂豫與宗用最故屬序諸首太宜人江姓廣信衣冠族也自其在室溫恭淑慎父母鍾愛之擇所宜歸以適周氏為贈刑部員外郎周君之配浙江參政府君之冡婦上承下御宗姻稱賢焉員外君蚤世太宜人自誓守節訓字諸孤俾克有立既而宗用第進士擢行又遷刑部員外郎遂進今職而太宜人拜褒封之命雕軒珠翟出入有煒里閈歆豔焉今年躋七十髮鬢皤然命服申申諸子恂恂諸孫詵詵凡世之所謂諸福者太宜人備諸一身矣昔雋不疑每録囚徒還其母輒問平反幾何即多所全活母喜笑異他時蔡君謨以忠鯁立朝仁宗嘉之曰有子如此其母之賢可知特賜冠帔以寵之宗用之歸也錦衣玉節率諸弟為壽太宜人問平反幾何縷數以對亦將喜笑為加餐矣入奏楓陛喜動天顔推賢所自安知不有冠帔之寵如仁宗於君謨之母哉宗用之喜又當何如也乃書之以辨羣玉賀南京刑部左侍郎阮公致仕序𢎞治三年夏五月南京刑部左侍郎阮公以九載考績至京上疏懇請謝事聖天子不允增俸二級俾復厥任公以先隴在長子者為水所圯乞便道歸省墓而後行上許之公抵家拜謁墓下奠祭而加封樹焉事竣戒行既而疾作乃奏疏申前請且曰臣歷官三十有七年犬馬之齒六十有八年矣精力耗不足任奔走智慮衰不足贊廟謨惟陛下哀憐賜臣骸骨以歸幸甚上覽其疏而憫之乃進公資善大夫俾休於家蓋異數也命下之日公卿大夫皆欣然曰吾君優禮老臣之恩阮公明哲保身之節可謂兩得之矣顧公已歸不獲執巵酒為公壽乃屬豫為文寓至長子以頌且賀焉豫惟君子出而致用勛烈著於國惠澤洽於民者固鮮茍或有之然晚節末路沉酣寵利卒與禍俱其得釋軒冕之榮遂雲山之樂者尤鮮也公自登進士第為廷尉有明允之譽為郡守有循良之稱佐大藩以至為方伯著旬宣之績及遷都憲蒞閩陜威惠所加夷夏悅服入佐司馬以至今官聲望尤重所謂勛烈惠澤公無歉焉及將老也又能捧身而退承天子之寵光登山而遨望歸岫之浮雲踞石而歌和考槃之雅調回視昔日惴惴於憂患之途不啻脫鯨波之滈溔而泛畫舫於安流也出羊腸之崛峍而鳴和鑾於康衢也所謂釋軒冕而樂雲山者公實有之嗚呼韋賢致仕而去可謂審明哲之幾矣然在相位功業無聞焉冦平仲出入將相可謂有功於國矣然老不知退卒為姦人所擠二公所不能得者公兼而全之可不謂賢乎豫少公五嵗然衰且病甚於公乞身之疏屢上而未獲命未知何日得如公之歸也序以賀公不獨頌公歸休之樂又以識豫歆艷之私云慶太常林先生八十詩序古之君子道弸於中文彪於外者多矣然際盛時得推所學以黼黻休明之治者蓋鮮幸而有之然或困於憂患厄於疾疢其介繁祉享修齡而康豫於晚嵗者尤鮮韓退之一代文宗也困厄頓躓終其身其所遇何如哉歐陽永叔繼韓而興雖嘗致位兩府然歸潁僅數年享壽六旬有六而已其於所謂壽且康者有歉焉若夫際盛時享多福而得韓歐之所未有者豫于太常少卿兼翰林學士莆陽林先生見之先生生於光嶽氣完之時稟和厚清明之氣其為學也博而精其為德也溫以肅其發於文也簡鬯淵永有古作者之風早遊場屋已有盛名遂以進士及第官翰苑掌帝制秉史筆侍經筵纍遷今官凡朝廷玉牒寶册之文金匱石室之紀先生皆與執筆焉公卿大夫紀功耀德之銘名山大川釋老之碑多出其手屢典文衡所得多知名士歷官三十餘年所謂憂患疾疢未嘗一及其心身先皇帝在御先生以年滿七十數求去優詔不允今天子嗣位之初先生求去益切乃得致仕南歸超然物表極山水之娛有子五人孫十人而季子載諸孫劒皆中鄉貢進士其講業郡庠邑校者又數人盛矣哉韓歐所未有也成化己丑先生年登八十而康強和豫如壯者十月乙卯乃先生初度之辰逺近奉觴胥慶今福建按察使劉公叔榮語寮佐曰先生之壽且康豈惟林氏一家之慶實斯文之慶也吾與諸君子非先生之門生則其所與進者也頌禱缺焉於心獨無歉乎乃相與屬筆於喬新焉喬新嘗讀南山有臺之詩觀詩人所以祝願君子者不獨頌其德而又祝其壽不獨祝其福備於身而又祝其福延於後可謂善於頌禱者已先生克享多祉於南山有臺之所祝願者兼之矣敢竊取斯義作詩七章以為先生壽以致羣公頌禱之意云其詩曰巖巖壺山作鎮海瀕鬱茲靈和誕生碩人維此碩人有德有文神介之福百嘏駢臻右一其德維何仁義是蘉其文維何黼藻斯皇乃薦于鄉乃第奉常乃登玉署斯文之光右二玉牒瑶編彛卣之銘追琢其章金薤晶瑩乃陟容臺躬秉寅清韡矣厥榮赫矣厥聲右三黃髮皤皤宣力孔多乃懸其車乃休于家莆山之阿莆水之沱以詠以遊以嘯以歌右四維此十月八帙開祥宗戚具來式燕于堂我有旨酒亦有羔羊薄言獻之祝公壽康右五壽康伊何伴奐爾遊繇耋而耄以承天休相彼玉瓚注茲黃流君子有榖多祉是遒右六天祚碩人俾多賢子爰及孫曾世載其美克振其光克纘其慶篤斯不忘錫類家邦右七封刑部左侍郎杜公挽詩序成化十有七年春三月封刑部左侍郎金堂杜公以疾卒於家凡知公之賢者識與不識咸賦虞殯之章以寫其咨嗟憫悼之情其子敬修萃為巨帙屬豫序之豫生也晚不及拜公之舄履下然與公之子同官知公之善行頗稔故不敢以不文辭公蜀人也天資醇篤鄉推長者其行事往往與蜀之先哲暗合蓋非勉而能者昔范景仁之兄鎡卒于隴城景仁訪求其遺孤躬字而教之俾克有立蘇老泉之父序當兵亂之後人不知學序篤於教子已而仲子涣以進士舉季子洵以文章顯陳省華之子堯叟堯佐相繼登相府堯咨亦為名法從而省華恂恂然未嘗以勢位驕其鄉里三君子皆蜀産也公少喪二兄而公撫其孤恩逾已出咸底於成可以趾美范公矣金堂素乏進士公力教其子以學所以淬礪之者甚至既而敬修擢髙科位司冦義方之訓蓋無愧於蘇公也自始封至其卒三十餘年薦被命書宗戚鄉里以為榮而公益以謙慎自持嵗時蠟社相與盡其歡不為表襮有陳公之遺風焉世嘗言古今人不相及以公所行校之三君子者有以異乎公之嘉言可以警世卓行可以範俗者甚多觀此三事則其餘可以類推矣公真所謂長者哉夫挽詩之作所以哀人之不幸也公官封三品享年九十有一子六人孫十有二人曾孫又六人所謂榮名盛福公蓋兼而有之奚不幸之有然諸君子猶有哀挽之作者蓋悼善人云亡而惜後生不及見先輩之風猷也欲知公者誦諸君子之詩而考豫之序庶有以得其槩矣公諱榮聰字惟德竹軒其别號云南京刑部侍郎陳公挽詩序成化十有八年冬十二月詔以都察院右副都御史廬陵陳公為南京刑部右侍郎時公巡撫貴州將赴任便道歸省先隴得疾遂不起訃聞天子遣官諭祭且命有司治葬事朝之大夫君子知公者皆揮淚相弔且賦虞殯之章以寫其咨嗟痛悼之情公之子鄉貢進士旦稡為一帙屬豫序蓋以豫與公相知最深故也公諱儼字時莊世家廬陵之吟溪少頴敏好學弱冠講業於大司馬蕭文昭公之門文昭公器之妻以其子學成去應進士舉遂登甲科擢刑部廣東司主事遷湖廣司郎中有賢聲升山東參政再遷布政使賢聲益著朝廷滋以公可大用升佐內臺出蒞南鄙公在刑部凡小大之獄必求其情大司冦四明陸公賢之四方有疑獄有司不能讞者輒屬公往訊之公所推斷罔不心服嘗奉勑録囚南畿平反甚衆其在山東適遼左用師公督芻餉規畫精密士飽而民不勞嵗大歉躬歷郡縣發倉儲勸富室以賑飢羸多所全活東人德之其在貴州苖民構亂四出焚剽公督兵進討誅其渠帥而宥其脅從羣蠻畏懷相率詣轅門請降獻羊酒以犒師及南臺之命下士大夫相語曰南都自是無寃民矣世方仰其大有為而公遽以疾卒嗚呼豈公之命止於是邪抑民之無祿而天莫憗遺也豫與公同登進士同官刑部同受知於司冦陸公豫出佐閩臺而公亦出參東藩及公宣撫貴州而而豫亦宣撫晉陽既而豫被召入佐司冦而公亦有南臺司冦之遷蓋與公周旋三十餘年交誼之篤自謂景仁君實不能過也方期與公宣力南北以各卒其平生報國之志而公遽舍我去矣鳴呼哀哉挽詩之序豫不忍言又不忍無言也姑述公履歷之槩冠於篇端以致豫意焉若其治行之大世系歷官卒葬之詳則國史有傳隧道有碑幽竁有銘豫可略也憲副遊公挽詩序成化八年冬十一月福建按察副使豐城遊公以疾卒於官寮友哭相弔曰天奪豫良友豫何從聞規誨之言邪諸生亦慟哭曰天奪豫良師豫於何考德而問業邪閩之致政之老里居之良亦咨嗟涕洟相唁曰天奪豫良大夫孰為吾閩成材而阜俗邪於是相率賦虞殯之章以述公之行而寫其哀悼之情公之子直祥彚為一帙而屬豫序之公諱明字大升世為江右儒家弱冠遊場屋已赫然有盛名既而領鄉薦登大學得盡友天下名士而讀所未見書其學與行益卓乎不可及登景泰辛未進士擢刑部主事轉員外郎出僉福建按察司事董學政九載將奏績就升今官揚歷中外二十餘年懿材清德為時偉人天下士大夫識與不識稱其賢者無間言蓋公之為人其存心也公而恕其接物也肅以和其施於政也嚴而不殘其與人交不矯矯為異亦不翕翕為同導其善規其不及侃侃務盡其誠其教人也以涵養德性為本以辨析義理為要斥佛老詭戾之説曰吾道之蠧也黜時文軋茁之怪曰大雅之蠱也開示存心致知之方曰作聖之階梯也以故寮友歸其誠諸生服其教而大夫君子仰其賢此哀悼之詞所繇作也嗟夫公之存也人愛而敬之其歿也人哀而悼之所謂生榮死哀庶幾乎無憾矣或者則謂賢者必貴仁者必壽天道之常也公賢且仁然官止四品年僅六十其道未大行於時天之難忱蓋不能無憾焉豫以為不然上蔡謝先生程門之髙弟也然官止莞庫而已東萊吕先生有志於道學者也然年僅四十有五而已天之不可必也久矣公之位雖禾躋於通顯其年雖未臻於耋耄然較諸上蔡東萊所得則過之矣亦可以無憾也豫故序諸卷端以慰士君子之心而解其悲悼焉公號暗然其卒也諸生私諡曰貞介先生云泉庵饒處士挽詩序吾旴南城饒邦獻詣豫拜且泣曰先君泉庵處士以今年夏四月十有六日棄諸孤得年六十有一惟先君晦迹泉石不求人知平生所行任性自然非有驚世駭俗之行世亦無繇知之者不肖孤大懼先君身沒而名無傳焉竊聞古之逸民所以有聞於後世者未必皆其自致也賢人君子聞其善而著之文字則遂以不朽耳故不肖孤求當世大夫君子作為哀挽之詞以頌先君之善惟先生序而傳之庶幾先君藉是不朽焉豫曰是孝子之用心也而宗為一鄉之望豫知之熟矣然豫自少宧遊四方不獲與而翁接家世之詳所存所履之槩能言之乎邦獻泣而對曰我先世家鄱陽宋初始遷撫之宜黃其後又自宜黃徙南城之上湖宋末又徙邑東鄉之雙溪今群從子孫殆數千指故名所居之地曰饒坊先君諱清字尚亷泉庵其别號也少服祖考之訓力田治生不求聞達與人交一本於誠不漫為然諾里之人以爭訟來質者是是非非率其心而斷之罔不信服生四子延名師教之俾不墜其家此先君之行也不肖孤又聞之王承福一圬者耳以昌黎之文而傳揚潛一梓人耳以河東之文而傳况先君詩禮之族世以善聞鄉推長者非承福與潛比也顧乃湮淪無傳則諸孤不孝之罪大矣惟先生圗之豫曰如子之言是可以傳矣泉庵以敦朴持其家以信義行其鄉以詩書教其子可不謂賢乎而邦獻嚴其親之終惓惓欲信其善於後世可不謂孝乎父賢子孝是真可傳矣雖然承福與潛所以有傳者以昌黎河東之文而人喜讀之也顧豫不腆之文人孰讀之惡能使而翁不朽哉姑序之篇首使誦諸君子之詩者有考焉傳不傳非豫所能必也大尹楊君挽詩序豫友壽光尹楊君元霽既卒凡士大夫知其為人者識與不識皆咨嗟慟悼或為詩歌以哀之福建參政鍾公景清懼其久而散軼也彚為一編而屬豫序之豫素知元霽而哀之尤切者顧能已於言哉昔韓退之於孟東野道其命於天者以送之豫取以為法焉元霽諱昕溫之瑞安人也少以頴敏好學聞豫先公為溫守愛其溫粹選為邑庠弟子員元霽益肆力於學羣經百氏無所不窺未弱冠領鄉薦試於禮部輒不利人皆曰非學之罪元霽之命也久之以大學生待選銓曹時先公為吏部尚書知其賢欲處之左右會司封缺主事將以元霽補之而元霽鄉人有官近侍者媢之乃倡言先公欲以要職私門下士羣議譁然先公嘆曰是楊生之命也以生之賢何職不宜為遂擢知上海縣事元霽至上海蘇枯齦強政以大和未幾丁內艱去服闋至京適華亭缺知縣華亭上海鄰邑也其士民稔知元霽之治狀相率請於朝願以元霽知華亭詔從其請元霽以治上海者治之盜遁姦革益赫赫有聲部使者薦其材任御史遂召試事御史臺今冡宰崔公嘗巡撫南畿素重元霽每為羣公道其賢會知臺事者與崔公有隙且疑其私於元霽竟黜之復以舊官知壽光其治壽光如治二邑民咸安之有古循吏之風焉凡知元霽者方期其大用而元霽不幸歿矣嗟夫學如元霽賢如元霽有治聲如元霽受之於大臣如元霽其都重位建崇勳以光顯於時可必矣然卒終於一縣尹而不克大其施豈非所謂命邪豈傳所謂天道無親常與善人者固不可信邪抑術家以甲子支干推人壽夭貧賤貴富者固一定而不可易邪然元霽平生於進退升沉處之淡然於所謂命者固知之矣故豫道其命於天者以序其挽詩亦元霽之志也若其世系治行之詳則翰林學士莆陽柯先生銘其墓矣茲不贅介庵倪先生挽詩後序豫讀遷固以下諸史而考古之韋布之賢見於逸民獨行傳者代不數人上下千餘年其可見者數十人而已因竊嘆曰世如彼其逺也砥節厲行者如彼其多也而見於史者如此其寥寥也豈立言君子固有所遺邪抑為之子孫者不能振而發之邪是皆可悲也及讀介庵倪先生虞殯之章又嘆曰是足以傳矣太史氏傳逸民獨行者於此有徴矣蓋先生孝友正直君子也髫齔時父仲斌甫坐微纍謫它郡先生號哭追送躑躅江滸不忍歸見者嗟異及父歸則先生長矣凡可以悅其親者靡不致力焉諸弟欲析居先生不能止資産惟諸弟所擇既析居而二弟以逋負屢破産先生輒分所有賙之里氓為閭右所凌死非命其孤弱不敢言先生為直之於官抵閭右罪近舍有古戰爭地每夕磷青熒起沒過者多顛踣先生嘗率家僮拯之所全活甚衆其孝友正直之概如此則其修諸身行於家而施於其鄉者可推而知也先生之歿也少宰葉文莊公表其墓翰林學士楊先生銘其竁廣東參政劉君欽謨又傳其事而名流畯儒知先生之賢者又相率賦詩以致其哀悼之意焉先生之子湖南參政良弼稡為一編屬豫序之嗟夫諸君子之言足以發幽光而昭潛德矣良弼於父之善可謂能振而發之矣先生之行焯焯有傳可以無憾矣昔歐陽子傳李自倫其事迹無可紀次而其名氏見於公牘者亦謹書之蓋惟恐其善之不傳也後世作史者復有歐陽子據諸君子之詩以考先生之行而敘述之其聲光照映簡册豈獨李自倫哉先生諱珣字廷珙世家嘉興之平湖介庵其别號也以子貴封吏部司勳主事云椒邱文集卷十二
