body:
  text: 椒邱文集卷十五明何喬新撰賦附文附樂歌弔昆陽城賦昆陽城在葉一舍許楚葉公所築縣治既遷舊城亦圮其可見者頽垣斷礎而已豫招籲流民至葉周覽遺迹思光武之駿烈而悼陵谷之變遷也賦以弔之其辭曰后皇嘉惠兮愍蒸庶之流離豫承命以籲懷兮爰弭節乎滍之湄陟崇岡以遐覽兮風雲慘其增悲原野寥兮頽垣之隱起僕夫跽而告豫兮曰兹昆陽之遺址顧樓櫓之安在兮雉堞悵其已圯血淪地而化碧兮戟沉沙而凝紫耕夫豈識興亡兮方肆墾而未已嘆炎祚之中微兮戚畹竊其威權羌狡童之狂僭兮據鼎耳而埀涎始矯行而罔世兮卒假符而誣天慠然自擬黃虞兮誦六藝以文其姦繄髙皇之龍孫兮憤丕基之忽墜援戈典於楚甸兮將叩關而問罪彼緑林與新市兮棼總總而來萃既定宛而取郾兮駐諸梁之故壘何狡童之迷復兮驅羣醜而來攻騎膠葛而言邁兮類螳斧而蝟蜂圍效彼魚麗兮或鸛鶴之橫縱志驕而氣溢兮謂不日而成功天道祐順兮人心迪其果毅王旅闞如虓虎兮軍容肅乎暨暨鼓闐闐而雷震兮旍靡靡而電曵風雨助其威怒兮士賈勇而髙厲彼逆徒何蠢蠢兮棼束手而就殪或倒戈而疾馳兮或棄甲而橫潰野流血而變赭兮川浮胔而擁穢氛䘲廓而清明兮人神為之暢快元凶授首兮遂定鼎而澗瀍噓炎燼於既熄兮迓景命而益延復漢官之威儀兮慰百姓之震衍昔商周師於牧野兮炎黃戰於阪泉視兹役之烈烈兮在古未能或先世運忽其變遷兮哀漢社之已屋荒墉穴彼狐兮京觀墾為平陸草露淒以沾衣兮林霏淡其慘目惟山鳥之嚶嚶兮恍國殤之夜哭駐豫車而一弔兮菀忳忳而含戚三谷賦麻源三谷之勝為吾旴江山水甲今司勛員外郎左君時翊之仙廬在焉時翊嘗為豫道其泉石幽雅之趣巖壑瑰詭之觀豫欣然欲逰而未能乃想像而賦之每一展玩庶幾乎宗少文之卧遊矣出城闉以遐覽兮爰陟峻而捫幽度駝嶺之谽谺兮訪仙臺乎山之陬銅陵岌嶪而凝黛兮紅泉汨㶁其鳴璆琪花瑤草紛不知其名兮桂樹鬱其相繆豫乃凌犖確厲清泠窺石門之窈窕躡雲蓋之崢嶸石梁龍矯兮卧波仙觀翬飛兮凌空吸紫霞兮石閣招白雲兮羅峰步豫馬於靈豐兮悵宿莽之離離訪翻經之遺臺兮蒼煙慘其增凄若乃崇岡􅍶崒疉嶺巑岏丹光夜爍土花春殷非子期仙隱之所存乎寒磷宵飛山精暮泣折戟沉沙戰血凝碧非危郎駐兵之故柵乎山川宛其如昨嗟昔人其安在攀古柏之虬枝兮增豫心之永慨謂仙人之不死兮吾不得而見之謂英雄之不朽兮亦澌盡而無遺招黃鶴而訊之兮鶴翩翩其髙翥尋斷碑於荒榛兮蝸涎苔花閟而不可覩重豫懷之耿耿兮撫幽篁而延佇回飈冷兮欲秋斜月淡兮將夕駕豫輈以復路兮聊容與乎田北騁豫目以流觀兮見夏屋之渠渠萬瓦鱗鱗以波偃曰美人之故廬緑樹藹其承宇兮清泉琤其循除詠先生之遺風兮有左琴而右書愛兹境之幽勝兮恍王官於緑野欲誅茅以葺廬兮敢云信美非吾土何所獨無芳草兮羌眷眷而懷兹念美人之好修兮茍去此其從誰倘解印以南旋兮將稅駕乎旴之湄從美人以徜徉兮終歲晏以為期梅雪齋賦新建李京春氏好修之士也嘗銘其燕居之齋曰梅雪蓋梅取其貞雪取其白也豫嘉京春好尚與世俗異乃為賦之其辭曰夫何美人之好修兮逺兹垢以自清闢崇軒以息遊兮表梅雪以為名雪以况昭質之弗虧兮梅以况其姱節服貞白以自嘉兮蹈前修之為則昔美人之既有知兮恆汲汲乎修能厭桃李之嬌媚兮又何羡乎美人之姿態惟兹梅為可貴兮鍾造化之沖和向北風而合韻兮粲的皪之瓊葩惟兹雪之可喜兮信皎潔其不汙白皚皚以遐積兮變埃壒為珣玗方仲冬之凝沍兮狂飈凛以戒寒元雲鬱以四塞兮雪花交下其漫漫松筠慘以改色兮又况荏弱之荃蘭當衆芳之搖落兮惟兹梅之不然吐素華之濯濯兮欲與六出而爭妍美人退而齋居兮啓南窗以遐矚悵百卉之既萎兮眷梅雪之如玉芳菲菲以襲人兮光㵿㵿其眩目誦廣平之妍辭兮賡郢客之妙曲感貞白之若兹兮忽有契其中情聊假物以自况兮揭華扁於軒櫺維梅之貞兮猶吾節之不移也維雪之白兮猶吾志之不緇也羌朝夕於此齋兮信芳潔之不忘茍豫行之靡忒兮不見是亦何傷欸時俗之昧昧兮胡好尚其獨異值桃李為庭實兮采芙蓉以為珮惟溺志於紛華兮委兹梅而弗睇愛江上之清風兮悅山中之白雲惟光景之流連兮曽兹雪之足云何美人之耿介兮乃獨為此度也夫豈矯世以自異兮惟好修之故也先民有言兮名不可以虛作茍矯名而無實兮顧身心亦何獲中情信其貞白兮斯行成而名彰朂諸兹志尚兮耿百世猶有光暗然軒賦憲副豐城遊先生名其藏修之軒曰暗然蓋志於聖賢為己之學也豫嘗從事於斯而未有得焉因先生名軒有慨於中為賦之以申其義云繄末俗之徇外兮絢繁飾以自揚何美人之練要兮挹至道而深藏美人稟兹懿質兮又重之以好修追洙泗之遐軌兮航濂溪之絶流日孜孜而靡懈兮期先哲之與儔曰君子求諸己兮兹前聖之格言溫恭濬哲兮舜德所以為元回也如愚兮夫子屢歎其賢曽氏之傳得其宗兮日勤勤乎三省逮聖孫之紹其緒亦曰衣錦而尚絅服聖人之明訓兮指羣哲以作程潄詩書之芳潤兮啐道德之精英愳充實之未至兮夫何慕乎修名元縞為冠兮大練為衣貝錦在其中兮文采燁其陸離太羮在俎兮元酒在樽孰云淡泊兮乃至味之攸存朱絃疏越兮世置瑱而莫豫聽一倡而三歎兮有韶濩之遺聲相珣玗之在璞兮氣如虹而外揚驪珠濳於九淵兮吐青熒之耿光萬善衍溢於吾躬兮肆暗然而日章嗟衆人之貿貿兮何文肆而中枵然而若盈兮躬處約而為泰製芰荷之緑衣兮被芙蓉之朱裳駕華輈之煥爛兮珮寶璐之琅琅鳳旍繽其翾飛兮絃匏奏而鏗鏘華文煒其可美兮羌無實而日亡歎豫生之他傺兮志古人之所服文質疏內兮每見嗤於流俗方世俗之矜衒兮又孰揆豫之中情豫不能改此度以徇時兮將合矩矱於顏曽幸美人之耿介兮夙與豫而目成解佩蘭以贈豫兮又重之以芳盟曰彼儒服而市心兮夫焉可與適道志乎古必違乎今兮又何必諧乎世好堅汝志而毋惑兮庶任重而逺到懼豫力之莫任兮愛此言之不可忘念餘齒之未衰兮願從美人以相羊慮此志之不固兮爰抒情而成章鉤勒竹賦南谷先生好竹其友金本清氏以所作鉤勒竹贈之蓋竹有君子之德先生好之其中必有契焉椒邱子因推其意而賦之其詞曰夫何美人之清修兮秉姱節以為常所好在乎同德兮豈羣葩之能當駕飈輪而遐覽兮乃夷猶乎瀟湘芳草薆其溢目兮紛迎秋而凋傷爰有貞筠兮冰玉其標挺宿莽而獨立兮凌霰雪而不凋雖同族於草木兮顧殊質於夭喬承雨露於天際兮蒼玉瑩其嬋娟回風飄拂兮揚鳳羽之翩躚迅雷奮乎九地兮迸龍孫之斬然感美人之永歎兮載移植於崇軒嗟衆芳之總總兮何變化之不常彼幽蘭之旖旎兮羌無實而容長申椒誾誾其芳烈兮糅蕭艾而不香荃蕙化為茅兮况辛夷與昌陽覽衆芳之若兹兮歎兹筠之可欽淡容與於春陽兮類富貴而不淫厯元冬而一色兮若處憂患之不易其心中虛如有所受兮外直而不倚雖歲序之遞遷兮肯隨俗而委靡何衆人之殊尚兮競樹桃李於門牆菉葹果何物兮亦雜蒔乎都房曽不知兹筠之可嘉兮獨凌厲於嚴霜委厥美以徇時兮非兹筠之所志也保晚節於歲寒兮庶比德於君子也繄鳳池之仙客兮夙與美人其同調揮毫以肖厥像兮神造追乎文趙蛟螭紛其攫拏兮珊瑚盤錯而交柯金刀鐵鈕不足喻其壯兮森若劍戟之相摩涼飈生於座隅兮明月娟娟而在户恍淇澳於渭濵兮撫貞姿而延佇亂曰羣葩葳蕤迎秋而萎兮猗猗貞筠隆寒不衰兮直如史魚清比伯夷兮置以為像爰肖厥儀兮保兹姱節歲晏為期兮石鐘山賦彭蠡之口有石鐘山焉蘇文忠公辨之詳矣士大夫喜幽尋而樂勝選者莫不遊焉景泰六年春三月豫與今夏官郎中王君尚忠俱以進士奉使江南尚忠家湖口邀豫艤舟絶壁之下以訪其所以謂石鐘者水石相激響若洪鐘始信昔賢之言不誣也因為賦之後十有二年尚忠出示舊稿俾重書之因歎豫學之不進而悼勝遊之難再也乃刪其辭以歸之云乙亥之歲暮春之夕豫與王子泛舟澄湖艤於絶壁援危藤登懸崖以訪昔賢之遺迹於時天和氣清江空月明魚龍咸伏波濤不驚縱豫目以遐覽舒懷古之幽情但見怪石嵳峩㠍嶫崴磊峥嶸奇形異狀不可殫名或如鳳如螭欲蟠欲飛或如鬼如獸將行將驟岩崿霮䨴拂藍撲黛穴罅呀􅥾欱雲噴雷異哉石乎蓋造物者之所胚胎也俄而微雲生於廬阜長風來乎太空驅濤擁瀨吼鯨躍龍爰有洪聲發於水中殷殷喤喤如遊舜庭而聽鏞鐘之撞鏘鏘鍧鍧如入周廟而聞無射之聲填兮若雷颯兮若雨又如卻至使楚而金奏作於下豫乃恍然而驚悄然而思問王子曰是何聲耶豈靈鼇奮首而三山頽耶抑海若驚起而號風雷耶無乃共工氏觸不周而天柱摧耶胡為乎有是聲也王子笑曰子不知耶是所謂石鐘者也昔者酈元言之而不詳李勃訪之而失實東坡居士泛舟江上以求之而後衆論定於一也豫曰石之為物塊乎其形未與水遇不聞其鳴水之為物湛乎其清未與石鬬若嘗有聲彼涵乎清越窽坎鏜鎝之音果出於水耶亦出於石耶王子曰不然夫水之性動石之性靜動靜相摩厥聲以應水之質柔石之質剛柔剛相蕩厥聲以彰是非水之聲也亦非石之聲也水石相搏而聲出焉此石鐘之所以名也夫峭壁岩岩鐘之銑角也懸蘿裊裊鐘之旋蟲也丹崖翠壑鐘之簨簴也驚濤駭浪鐘之撞杵也是鐘也蓋天地為爐萬物為銅陰陽為炭造化為工齊侯不得銘其績而鳬氏無所與其功也嗟夫洪水橫流巨浸稽天象罔出而侮人螭蜃過而垂涎民其魚矣尚何鐘之聽焉今吾與子脫介鱗而辨冠去沮洳而宫室泛蘭舟以遨遊聽水樂以自適揆厥所元伊誰之力耶於是相與徜徉眺望咨嗟感激已而雲消風止浪平響息水天相映瑩然澄碧返而登舟呼酒相酢乃鼓枻而歌曰駕吾舟兮泛長江馮夷起舞兮酌我以羽觴侑以嘉樂兮鼓鐘喤喤慨念上古時濁流湯湯孰致平成兮孰理懷襄願銘此鐘兮紀神功千秋萬歲兮永不忘秋蘭賦金君文逺晉陵之隱君子也於物無所好顧獨愛蘭蓋其情性有合焉耳嘗得畫蘭一卷曲盡露葉春莖之妙文逺寶而藏之其從子秋官主事和之出以示豫豫為推其意而賦之其詞曰豫昔好此芳草兮歲逾邁而不衰步豫馬於楚畹兮弭豫棹乎澧之湄登芳臯以騁望兮渺豫心之顧懷蕭艾􅀢靡其極目兮宿草莽莽以紛披眷兹蘭之旖旎兮屏山谷以自藏芳菲菲而襲豫兮羌居蔽而聞章濯湛露以自潔兮泛光風而逺揚雖寂寥乎山阿兮豈以無人而不芳感豫心而長喟兮爰移植乎都房飾雕檻以固護兮恐回風之飄揚驅蜂蝶以逺屏兮恐芳蕊之見凌何所獨無芳草兮胡眷眷而懷兹念緑葉而素莖兮敻異乎杜蘅與江蘺憺容與而獨秀兮肖君子之幽貞也芬郁郁而逺聞兮猶吾德之馨也人之心不與吾同兮胡好惡其獨異户服艾以自好兮紉萹薄以為佩菉葹薆其盈室兮顧謂秋蘭為不芳茍中情之貞姱兮不吾知其何傷苦靈均之好修兮每惓惓於荃蘭與衆草而為伍兮發素王之悲歎固豫異乎衆好兮矧兹幽獨之可願期與子而為友兮敦久要而弗諼委厥美以從俗兮匪余情之所安肖子像以為儀兮矢共保乎歲寒重曰眷彼佳卉擅國香兮煢獨處廓聊自芳兮姱而不淫可充纕兮不采而佩庸何傷兮置以為像無異乎夷之清兮衍慶堂賦湖南方伯吳公扁其所居之堂曰衍慶昭先德也蓋公之髙祖崇本翁以仁厚肇厥家而曽祖清逸翁祖靜庵翁考怡靖翁世有令德以培其基儲休委祉大發於公此堂之所以名也豫以公為同寮故推其名堂之意而賦之其詞曰夫何穹堂之將將兮據吳山之幽勝揭華扁於前榮兮昭先世之休慶維兹堂之宏建兮既考極而相方工師殫其智巧兮矧掄材之孔良木蘭為榱兮文杏煥其為梁礱文磶以居楹兮煉蜃以塓其垣墻楶棁粲乎山與藻兮丹雘煒其有光桂樹陰陰以承宇兮荃蕙旖旎而含芳泉㶁㶁而循除兮三秀猗猗而效祥匪徒宗戚之燕集兮祖考於焉而蒸嘗嗟斯堂之肇造兮實先世之所貽彼延陵之宏博兮乃慶源之由開崇本遘時孔艱兮秉恭儉以作則清逸恂恂惠和兮亦允蹈乎先德靜庵懷瑾握瑜兮維先猷之踐修怡靖憺以貞間兮撫松菊而夷猶皇天無私阿兮眷積善而敷祐茍或嗇於其躬兮休祉式豐於其胄肆美人之挺生兮鍾海嶽之靈秀日磨淬而好修兮期光前而裕後振六翮以上征兮戾天衢而髙翥始䇿名於大廷兮荐揚聲於粉署參大政於西蜀兮頌聲藹其載路陟南紀之雄藩兮政與陽和其同布羌休顯之臻兹兮由先澤之汪洋感締造之孔艱兮吾其敢忘於構堂維兹堂之宏敞兮匪暇豫以自逸也念先慶之流衍兮思不忘於繼述也覽濤江之溶㵝兮思先澤之悠長也蘭茝紛其充庭兮恍先德之遺芳也積善有慶兮聖垂訓於大易孰無施而有報兮孰不種而有穫于公髙其門閭兮知後嗣之必昌晉公邁種厥德兮樹三槐以為徵天道不爽兮諒今昔以同然維嗣德之有人兮斯慶澤之益延亂曰瞻彼髙堂何言言兮德以為基禮為藩兮趾美承芳罔或愆兮世載令聞雲來嬋嫣兮和歸去來辭題王司馬休菴休菴者大司馬王公歸休之室也公國之重臣職典邦政聖天子之所倚毗而天下士大夫所望以興道致治者也顧以夙夜在公憂勤致恙數上章求去位優詔不允而公請之益堅乃得解政暫歸烏乎卓哉世之名位與公等者不少勛烈如公者蓋亦有焉至於當國家倚任之時而秉急流勇退之節者求諸古今蓋不多得也乃今於公見之昔陶淵明解官而歸作歸去來辭以見志千載之下頌其辭想其人景仰而不已公之風節視淵明蓋無愧焉喬新仰公之盛德久矣第以地分懸絶未嘗敢一謁公之門今公之歸休是菴也不得已於言故取歸去來辭和之以道公歸休之樂又以見公之風節足以繼美於昔人也其辭曰歸去來兮胡為眷眷而懷歸念人生之如寄忽感悟以興悲眷明哲之已逺幸軌轍之可追既委心於義命又奚較乎是非指崤函之歸路想兒女之牽衣望太華之嶙峋見翠靄之霏微故園伊邇我車載奔緑陰垂宇清光繞門蘭茝未蕪簡篇尚存撫我素琴酌我芳尊無囂聲之聒耳無憂悰之在顏悵百歲其幾何知一菴之足安玩寒泉之滴滴聽黃鳥之關關坐盤石以長嘯登崇巖以縱觀魚洋洋以潛泳雲靄靄以往還撫物理而自感聊夷猶以盤桓歸去來兮與赤松而同遊屣軒冕其如脫惟道義之是求榮莫榮於不辱樂莫樂於無憂斂濟世之宏略爰經畫其田疇乃駕鹿車乃泛蘭舟采蘋藻兮幽澗藝蘭杜兮芳邱滌煩襟於茂蔭濯塵纓於清流念歸全於此菴實祖考之餘休已矣乎吾不能變心以徇時相彼欲去而可留汨寵利竟安之尋泉石之舊盟赴鷗鳥之幽期逐猿鶴以長往荷鎛釤以載耔續歸田之雅製歌考槃之遺詩信俯仰以無愧泰然自得夫何疑和歸去來辭送李先生成化二年夏六月少宗伯安成李先生上疏謝病優詔許之且諭以病愈還朝蓋欲復用之也於戲休哉聖天子好賢無己之心先生急流勇退之節蓋曠古所未有也昔者陶淵明為彭澤令解印而歸作歸去來辭以見志百世之下讀其辭而髙之先生之事業固非淵明所及而其遭際又淵明之所無者惟其髙風清節足以廉貪立懦則先生與淵明異世而同符也先生考甲戌進士時喬新誤蒙甄拔辱知最深故取淵明之辭和之以遺歸休之樂云歸去來兮倦遊草載今始歸幸夙心之既遂胡喜極而更悲設供帳於都門紛冠蓋其豫追望層峰於雲際疑家山而猶非僕夫歌以促駕稚子笑而牽衣問歸路以猶緬悵屢歌乎式微故廬在望歸心欲奔白雲承宇蒼松蔭門石徑未荒岫幌猶存良朋在座新醪滿尊道故舊以共醉春風盎其在顏喜菟裘之已營知蝸室之足安葺芳杜以成帷攬碧蘿以為關臨瀘水以洗耳登書臺以遐觀鴻𡨕𡨕以髙舉雲冉冉以孤還歲晼晚其將暮攀桂枝而盤桓歸去來兮訪昔日之釣遊浮世憺其相忘外物廓乎無求蔭茂樹以自適玩遺經以忘憂田翁告豫以有年黍稷薆其盈疇或山而屐或水而舟緡遊鯈兮碧澗擷芳實兮椒邱招白雲於逺岫弄明月於清流念歸老於田園信造化之餘休已矣乎出處進退信有時彼懷祿而干進留老將至矣竟安之襲髙風於表聖踐芳躅於榮期或乘月以長嘯或迎春以載耔歌白駒之雅調和招隱之新詩功成而身退超然物表夫何疑和歸去來辭送尹二尹君子之仕也不矯情以為髙不徇俗以為通惟其時而已昔陶淵明為彭澤令恥束帶見督郵解官而歸君子不以為矯吾廣昌丞桐城尹君佐邑僅餘三載亦以志不得盡行致仕而歸君子亦不以為非君將歸縣正周侯等屬豫言為贈豫謂淵明之歸賦歸去來辭以見志今君之歸宜有能言之士為之賦者而未聞也乃因淵明之題而次其韻以遺周侯等以贈尹君祖道之日命五六童子歌之以代陽關之曲云歸去來兮歲將晏而北歸既去勞而就佚胡喜極而增悲望𡨕鴻於天末逆朔風而相追悔顓孫之干祿慕伯玉之知非對離筵之芳酎振仕路之塵衣瞻龍眠之舊隱煙樹菀其依微風帆晝彍霜屨晨奔去家千里倐已到門問朋舊之存殁幸宗戚之具存載刲肥羜亦列芳樽無鐫誚之入耳無憂悒之在顏身既隱而無競心無營而自安玩遊倏之圉圉聽黃鳥之間關濯長江之清泚挹五老之奇觀念魚貪餌而忘返孰若鷗知機而遄還感物類之禍福攬松桂而盤桓歸去來兮已息心於宦遊競浮名其何益逐世好其焉求榮孰榮於不辱樂孰樂於無憂如古人其可作吾將希蹤於田疇或山而騎或川而舟采紫芝於丹谷鑱黃獨於青邱燒痕茸茸而變緑泉聲激激而分流靜觀萬物之自得充然吾心之休休已矣乎流行坎止信有時茍欲去而可留將舍此其安之從赤松而仙遊結黃石之幽期視蕭韓溺志於功名寧以沮溺勤身於耘耔賡伐木之餘韻詠歸田之雅詩茍中心之自得樂天委命其何疑續歸去來辭太子少保禮部尚書劉公以疾乞解政章七上聖天子乃許之命馳驛以歸又俾有司月給俸為養蓋優老之異數也公將行羣公相率賦詩贈之豫與公為同年友而豫老且病甚於公亦嘗求歸而未得寂寥短章不足寫情乃續淵明歸去來辭以道公歸休之樂兼致豫欣慕之私祖筵既張俾未冠者歌之以代驪駒之曲云歸去來兮承溫詔而西歸超氛埃以遐舉兮信明哲而知幾羌素節之既遂兮胡喜極而更悲念弱冠之筮仕兮亦既遻乎明時䇿大廷而賜第兮肆通籍於金閨佐宰衡之黜陟兮典容臺之禮儀春卿宫保之荐陟兮何天寵之吾私或贊祼於清廟兮或奠璧於太壇秉寅清以將事兮昕夕惕其靡安羲馭迅而莫追兮歲忽忽其將暮悵吾髮之種種兮願投簪而逸處叩天閽而敶辭兮曰臣病之日侵皇覽揆吾之中情兮俾歸老涪之南駕余皇而浮江兮又攽祿而養之湛恩汪濊兮嗟欲報而無期冠蓋棼其出飢兮酌兕觥而歌驪駒都人瞻望咨嗟兮亦奚異乎二疏懷吾皇之明聖兮悵欲去而踟蹰瞻都城之煙樹兮感吾涕之漣洳朝發軔於薊門兮夕鼓栧乎潞渚泛彭蠡而上巴峽兮時慿髙而弔古思香山與洛社兮願遵昔賢之遺矩曽日月之幾何時亦既戾乎故邦尋鷗盟其未寒兮喜園廬之未荒撫桂松而延佇兮登雲崖以舒嘯賡考槃之遺什兮歌小山之雅調嗟豫齒髮之日衰兮亦眷眷而懷歸章屢上而未獲命兮嬋媛而增欷黃鵠翩然髙逝兮羈鳥猶栖乎彤籠君恩不我遺兮駕桂棹以相從亂曰君子仕止惟其時兮相彼昧者亦何知兮𡨕升不已禍卒罹兮知止不殆古有炯戒兮眷兹明哲功成勇退兮徜徉林壑聊以卒歲兮懷韓忠獻公文魏國韓忠獻公彰德人也公之相業軼房杜而陋蕭曹矣至其能容富弼而薦歐陽修尤他賢相所不及弼與公同在政府持論多異而公待之坦然略無芥蒂修以文章擅一世名世多嫉而擠之者公獨引而置之政府嗚呼世之為相者惡異己如仇敵有能容之如公者乎士有盛名者常恐其軋己有如公能薦之者乎豫過彰德思公而不可見也故為文以致感慕之意云登休逸之崇臺兮望狎鷗之荒亭訪遺躅而不可見兮感豫涕之交橫采溪毛以薦芳兮欵靈宇而􅀈誠當宋氏之中葉兮天純佑而多賢范富在其左右兮晏賈翼而後先彼淵篤與直溫兮紛茅拔而茹連惟夫子之挺生兮遘兹昌時重厚如勃兮文章過之赤舄几几兮日容與乎彤闈追伊周之逸駕兮陋蕭曹而不屑為余蔡謇謇兮公讓其直狄种桓桓兮公嘉其績七政若度兮百僚承式鐃鼜不驚兮野無蟊螣四民熙熙兮孰知公力譬粳稌之芃芃兮忘甘澍之為澤彼弼之議政兮胡悻直而不同非夫子之偉量兮孰休休而有容修之姱辭兮信矘朗而寡儔夫子引之共政兮人文庶幾乎漢周何公亮之肆謗兮訴夫子以專權天聽弗聰兮俾解政以歸田神功斂而若無兮日夷猶於洛社衣錦而晝行兮華構恍其緑野新法紛如牛毛兮民嗷嗷而喪生厭斯世之迫厄兮忽騎箕以遐征嗟士俗之日偷兮好蔽美而稱惡龜以靈而見剖兮女以蛾眉而見妬德逺之貞亮兮祉訴鼎而懷忌晉公知愈為賢兮曽莫引之共事惟夫子之盛德兮固今古之所稀跽薦酒而陳詞兮願荒忽而顧懷茍九原之可作兮吾將執鞭而從之忠愛祠迎送神樂歌忠愛祠在汀州卧龍山下邦人所建以祀郡推豫章謝侯也侯為郡有惠政及劍溪盜起攻剽至汀侯出奇破賊民賴以安侯既沒汀民感其遺愛相與言於郡請為立祠守臣以聞詔賜祠額曰忠愛蓋以侯效忠於國而惠及其民也豫嘗佐閩臺行部屢至汀知侯之德政為詳故作迎送神之歌遺汀人俾歲時享祀歌之以侑牲醴焉其詞曰采芳藻兮澗之濵椒糈馨兮桂酒醇鼓坎坎兮舞羽繽紛侯來降兮慰我民雲為輿兮風為馬侯弭節兮山之下覽舊邦兮一慨故壘荒兮嘉穀被野龍灘浟浟兮水不波園有芋栗兮池有蒲荷寒尨不吠兮稚耋嘯歌曷臻兹兮侯功孔多遺愛在民兮亦有嘉績嗟莫報兮侯之德侯之神兮如在尚顧豫兮昭假右迎神四章章四句霓旍抗兮風披披劍縱橫兮佩陸離紛進拜兮願侯遲遲侯不少佇兮我心悲嗟汀之境兮繄侯桐鄉侯毋懷兮豫章朝出遊兮暮回翔慰我民兮維不忘吹豳籥兮拊魯鼓侯降靈兮錫我純嘏潢池清兮民安堵蟊賊逺屏兮時暘時雨靈宇幽兮露靄蒙蒙松桂萷槮兮泠然以風侯之歸兮何許元鶴唳兮雲中右送神四章章四句椒邱文集卷十五
